  body { font-family: system-ui, -apple-system, sans-serif; background:#020617; }
  .tab-btn.active { color:#38bdf8; border-bottom:2px solid #38bdf8; }
  input, select, textarea { background:#1e293b; border:1px solid #334155; color:#e2e8f0; border-radius:6px; padding:7px 10px; font-size:13px; outline:none; width:100%; }
  input:focus, select:focus, textarea:focus { border-color:#3b82f6; }
  input[readonly] { background:#0f172a; color:#64748b; }
  input[type="file"] { background:#1e293b; border:1px dashed #334155; color:#94a3b8; padding:10px; cursor:pointer; }

  .spinner { width:40px; height:40px; border:3px solid #1e293b; border-top:3px solid #38bdf8; border-radius:50%; animation: spin 0.8s linear infinite; margin:0 auto; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .toast { position:fixed; bottom:20px; right:20px; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px 18px; z-index:2000; font-size:13px; transition:all 0.3s; }
  .toast.success { border-color:#22c55e; color:#4ade80; }
  .toast.error { border-color:#ef4444; color:#ef4444; }
</style>

<script>
// ═══════════════════════════════════════════════════════════
// ⚠️  IMPORTANTE: PEGA AQUÍ TU URL DE APPS SCRIPT
//     Implementar → Administrar implementaciones → copiar URL
// ═══════════════════════════════════════════════════════════
const API_URL = 'PEGA_AQUI_TU_URL_DE_APPS_SCRIPT';

// ── CONSTANTES ──
const MARCAS        = ["Toyota","Hyundai","Kia","Nissan","Chevrolet","Ford","Honda","Mazda","Mitsubishi","Suzuki","Changan","Chery","Geely","Volkswagen","Otros"];
const COLORES       = ["Blanco","Negro","Plata","Gris","Rojo","Azul","Beige","Verde","Otro"];
const TRANSMISIONES = ["Manual","Automático","CVT","Doble embrague","MT","AT"];
const TRACCIONES    = ["4x2","4x4","AWD","FWD","RWD"];
const ESTADOS       = ["Disponible","Publicado","Reservado","Vendido"];
const CARROCERIAS   = ["Sedán","SUV","Hatchback","Pickup","Van","Coupé","Indiferente"];
const ORIGENES      = ["Facebook","Instagram","TikTok","WhatsApp","Referido","Web","OLX","Otros"];
const PAGOS         = ["Contado","Financiado","Por definir"];
const STATUS_CRM    = ["Caliente","Tibio","Frío","Descartado"];
const STATUS_COLORS = { Caliente:"#ef4444", Tibio:"#f59e0b", "Frío":"#3b82f6", Descartado:"#6b7280" };
const STATUS_EMOJI  = { Caliente:"🔴", Tibio:"🟡", "Frío":"❄️", Descartado:"⚫" };
const CARROCERIA_MAP = {
  "Rush":"SUV","Kicks":"SUV","Tracker":"SUV","Tucson":"SUV","Venue":"SUV","Xtrail":"SUV","Qashqai":"SUV",
  "CX3":"SUV","Outlander":"SUV","Captiva":"SUV","Territory":"SUV","CS35":"SUV","GX3 Pro":"SUV",
  "Sentra":"Sedán","Tiida":"Sedán","Sonic":"Sedán","Gol":"Sedán","Joy":"Sedán",
  "I20":"Hatchback","Agya":"Hatchback","Groove":"Hatchback","Beat":"Hatchback",
  "Colorado":"Pickup"
};

// ── ESTADO ──
let vehs = [], clis = [], operaciones = [];
let currentTab       = "dashboard";
let filterEstado     = "Todos";
let filterStatus     = "Todos";
let searchVeh        = "";
let searchCli        = "";
let lastMatchVeh     = null;
let lastMatches      = [];
let cargando         = true;
let ultimoIdOperacion = null;   // último OP generado en Tasación
let opExpandidas      = {};     // cards expandidas en Operaciones
let filtroOperaciones = "Todas";
let operacionesCargando = false;

// ── API REST (reemplaza google.script.run) ──
function apiFetch(action, payload) {
  return fetch(API_URL, {
    method : 'POST',
    headers: { 'Content-Type': 'text/plain' },   // evita preflight CORS
    body   : JSON.stringify({ action, payload })
  }).then(r => r.json());
}

function apiGet(action) {
  return fetch(API_URL + '?action=' + action).then(r => r.json());
}

function sincronizar() {
  cargando = true;
  showLoader(true);
  apiGet('datos')
    .then(procesarDatos)
    .catch(errorCarga);
}

function procesarDatos(data) {
  try {
    if (!data) data = {};
    if (Array.isArray(data)) {
      vehs = data.map(normalizarVehiculo);
      clis = [];
    } else {
      vehs = (data.vehiculos || data.inventario || []).map(normalizarVehiculo);
      clis = (data.clientes  || data.crm        || []).map(normalizarCliente);
    }
    cargando = false;
    showLoader(false);
    render();
    toast(`✅ ${vehs.length} vehículos · ${clis.length} clientes`, "success");
  } catch(err) {
    errorCarga(err);
  }
}

function errorCarga(err) {
  cargando = false;
  showLoader(false);
  vehs = []; clis = [];
  render();
  toast("⚠️ " + (err.message || "Error al conectar con el servidor"), "error");
}

function recargarApp() {
  toast("✅ Guardado correctamente", "success");
  sincronizar();
}

function errorGuardar(err) {
  toast("⚠️ Error al guardar: " + (err.error || err.message || err), "error");
}

// ── NORMALIZADORES ──
function normalizarVehiculo(row) {
  return {
    id: row.id || row.ID || Date.now()+Math.random(),
    marca:row.Marca||row.marca||"", modelo:row.Modelo||row.modelo||"", version:row.Version||row.version||"",
    transmision:row.Transmision||row.transmision||"", traccion:row.Traccion||row.traccion||"", motor:row.Motor||row.motor||"",
    anio:parseInt(row["Año"]||row.anio||row.Anio||0)||0, kilometraje:parseInt(row.KM||row.kilometraje||0)||0,
    color:row.Color||row.color||"", placa:row.Placa||row.placa||"",
    soat:parseFecha(row.SOAT||row.soat), revTecnica:parseFecha(row.Revision_Tecnica||row.revTecnica),
    prenda:row.Prenda||row.prenda||"No", fechaCompra:parseFecha(row.Fecha_Compra||row.fechaCompra),
    comision:parseFloat(row.Comision||row.comision||0)||0, costoInspeccion:parseFloat(row.Costo_Inspeccion||row.costoInspeccion||0)||0,
    gastosNotaria:parseFloat(row.Gastos_Notaria||row.gastosNotaria||0)||0, gastoFirma:parseFloat(row.Gasto_Firma||row.gastoFirma||0)||0,
    costoCompra:parseFloat(row.Costo_Compra||row.costoCompra||0)||0, retoques:parseFloat(row.Retoques||row.retoques||0)||0,
    gastoCombustible:parseFloat(row.Gasto_Combustible||row.gastoCombustible||0)||0, gastoLavado:parseFloat(row.Gasto_Lavado||row.gastoLavado||0)||0,
    gastosCochera:parseFloat(row.Gastos_Cochera||row.gastosCochera||0)||0, otrosGastos:parseFloat(row.Otros_Gastos||row.otrosGastos||0)||0,
    precioVenta:parseFloat(row.Precio_Venta||row.precioVenta||0)||0,
    fechaPublicacion:parseFecha(row.Fecha_Publicacion||row.fechaPublicacion),
    precioPublicacion:parseFloat(row.Precio_Publicacion||row.precioPublicacion||0)||0,
    fechaVenta:parseFecha(row.Fecha_Venta||row.fechaVenta), descripcionGastos:row.Descripcion_de_Gastos||row.descripcionGastos||"",
    comentarios:row.Comentario||row.comentarios||"", estado:row.Estado||row.estado||"Disponible"
  };
}
function normalizarCliente(row) {
  return {
    id:row.id||row.ID||Date.now()+Math.random(), nombre:row.Nombre||row.nombre||"",
    fechaContacto:parseFecha(row.Fecha_Contacto||row.fechaContacto), celular:row.Celular||row.celular||"",
    marcaBusca:row.Marca_Busca||row.marcaBusca||"Indiferente", modeloBusca:row.Modelo_Busca||row.modeloBusca||"",
    ranioMin:parseInt(row.Anio_Min||row.ranioMin||2015)||2015, ranioMax:parseInt(row.Anio_Max||row.ranioMax||2026)||2026,
    presupuesto:parseFloat(row.Presupuesto||row.presupuesto||0)||0,
    transmisionDesea:row.Transmision_Desea||row.transmisionDesea||"Indiferente",
    carroceria:row.Carroceria||row.carroceria||"Indiferente", partePago:row.Parte_Pago||row.partePago||"No",
    partePagoDesc:row.Parte_Pago_Desc||row.partePagoDesc||"", status:row.Status||row.status||"Tibio",
    origen:row.Origen||row.origen||"WhatsApp", tipoPago:row.Tipo_Pago||row.tipoPago||"Por definir",
    fechaUltimoContacto:parseFecha(row.Fecha_Ultimo_Contacto||row.fechaUltimoContacto)
  };
}
function parseFecha(v) {
  if(!v) return "";
  if(typeof v==="string") {
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.split("T")[0];
    const p=v.split("/");
    if(p.length===3){let[d,m,y]=p;if(y.length===2)y="20"+y;return`${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;}
    return "";
  }
  try{return new Date(v).toISOString().split("T")[0];}catch{return "";}
}
function vehToBackend(v) {
  return {
    id:v.id, Marca:v.marca, Modelo:v.modelo, Version:v.version, Transmision:v.transmision,
    Traccion:v.traccion, Motor:v.motor, "Año":v.anio, KM:v.kilometraje, Color:v.color, Placa:v.placa,
    SOAT:v.soat, Revision_Tecnica:v.revTecnica, Prenda:v.prenda, Fecha_Compra:v.fechaCompra,
    Comision:v.comision, Costo_Inspeccion:v.costoInspeccion, Gastos_Notaria:v.gastosNotaria,
    Gasto_Firma:v.gastoFirma, Costo_Compra:v.costoCompra, Retoques:v.retoques,
    Gasto_Combustible:v.gastoCombustible, Gasto_Lavado:v.gastoLavado, Gastos_Cochera:v.gastosCochera,
    Otros_Gastos:v.otrosGastos, Precio_Venta:v.precioVenta, Fecha_Publicacion:v.fechaPublicacion,
    Precio_Publicacion:v.precioPublicacion, Fecha_Venta:v.fechaVenta,
    Descripcion_de_Gastos:v.descripcionGastos, Comentario:v.comentarios, Estado:v.estado
  };
}

// ── HELPERS UI ──
function showLoader(show) { document.getElementById("loader").style.display = show ? "flex" : "none"; }
function toast(msg, type="success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`; el.textContent = msg;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(()=>el.remove(), 3500);
}
const today   = () => new Date().toISOString().split("T")[0];
const fmt     = d => d ? new Date(d+"T00:00:00").toLocaleDateString("es-PE") : "—";
const diffDays= (a,b) => Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
const money   = n => "$ "+parseFloat(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});
const calcCostoTotal = v => [v.costoCompra,v.comision,v.costoInspeccion,v.gastosNotaria,v.gastoFirma,v.retoques,v.gastoCombustible,v.gastoLavado,v.gastosCochera,v.otrosGastos].reduce((s,x)=>s+(parseFloat(x)||0),0);
const calcDiasStock  = v => { if(!v.fechaPublicacion) return null; const fin=v.estado==="Vendido"&&v.fechaVenta?v.fechaVenta:today(); return diffDays(v.fechaPublicacion,fin); };
const calcUtilidad   = v => { const ct=calcCostoTotal(v); if(parseFloat(v.precioVenta)>0)return{val:parseFloat(v.precioVenta)-ct,tipo:"real"}; if(parseFloat(v.precioPublicacion)>0)return{val:parseFloat(v.precioPublicacion)-ct,tipo:"proyectada"}; return null; };
const getCarroceria  = v => CARROCERIA_MAP[v.modelo]||"Sedán";
const estadoColor    = e => e==="Vendido"?"#22c55e":e==="Reservado"?"#a855f7":e==="Publicado"?"#3b82f6":"#64748b";
function badge(text,color){return`<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${text}</span>`;}

function matchScore(cli,veh) {
  if(parseFloat(veh.precioPublicacion)>parseFloat(cli.presupuesto)) return null;
  if(parseInt(cli.ranioMin)>parseInt(veh.anio)||parseInt(cli.ranioMax)<parseInt(veh.anio)) return null;
  let score=0; const flags=[];
  if(cli.marcaBusca===veh.marca||cli.marcaBusca==="Indiferente"){score+=30;flags.push("✅ Marca");}
  if(!cli.modeloBusca||cli.modeloBusca.toLowerCase()===veh.modelo.toLowerCase()){score+=20;flags.push("✅ Modelo");}
  if(cli.transmisionDesea===veh.transmision||cli.transmisionDesea==="Indiferente"){score+=20;flags.push("✅ Transmisión");}
  if(cli.carroceria===getCarroceria(veh)||cli.carroceria==="Indiferente"){score+=15;flags.push("✅ Carrocería");}
  if(parseFloat(veh.precioPublicacion)<=parseFloat(cli.presupuesto)*0.95){score+=15;flags.push("✅ Precio ok");}
  return score>=50?{score,flags}:null;
}
function findMatchesForVeh(veh) {
  if(!["Disponible","Publicado"].includes(veh.estado)) return [];
  return clis.filter(c=>["Caliente","Tibio"].includes(c.status)).map(c=>{const r=matchScore(c,veh);return r?{cliente:c,score:r.score,flags:r.flags}:null;}).filter(Boolean).sort((a,b)=>{const o={Caliente:0,Tibio:1};return(o[a.cliente.status]??2)-(o[b.cliente.status]??2)||b.score-a.score;});
}
function findMatchesForCli(cli) {
  if(!["Caliente","Tibio"].includes(cli.status)) return [];
  return vehs.filter(v=>["Disponible","Publicado"].includes(v.estado)).map(v=>{const r=matchScore(cli,v);return r?{vehiculo:v,score:r.score,flags:r.flags}:null;}).filter(Boolean).sort((a,b)=>b.score-a.score);
}

// ── RENDER PRINCIPAL ──
function render() {
  document.querySelectorAll(".tab-btn").forEach(b=>b.classList.toggle("active",b.dataset.tab===currentTab));
  const alertasSOAT = vehs.filter(v=>v.soat&&diffDays(today(),v.soat)>=0&&diffDays(today(),v.soat)<=30);
  const alertasRev  = vehs.filter(v=>v.revTecnica&&diffDays(today(),v.revTecnica)>=0&&diffDays(today(),v.revTecnica)<=30);
  const alertasCli  = clis.filter(c=>["Caliente","Tibio"].includes(c.status)&&c.fechaUltimoContacto&&diffDays(c.fechaUltimoContacto,today())>=7);
  const totalAlertas= alertasSOAT.length+alertasRev.length+alertasCli.length;
  const ab = document.getElementById("alertBadge");
  if(totalAlertas>0){ab.classList.remove("hidden");ab.textContent=`🔔 ${totalAlertas}`;ab.onclick=()=>{currentTab="dashboard";render();};}
  else ab.classList.add("hidden");

  const content = document.getElementById("content");
  if(usuarioActual&&usuarioActual.rol==="tecnico"){currentTab="inspeccion";content.innerHTML=renderInspeccion();return;}
  if(currentTab==="dashboard")   content.innerHTML=renderDashboard(alertasSOAT,alertasRev,alertasCli);
  else if(currentTab==="inventario") content.innerHTML=renderInventario();
  else if(currentTab==="crm")    content.innerHTML=renderCRM();
  else if(currentTab==="matches") content.innerHTML=renderMatches();
  else if(currentTab==="tasadora") content.innerHTML=renderTasadora();
  else if(currentTab==="operaciones"){content.innerHTML=renderOperaciones();if(!operaciones.length)cargarOperaciones();}
  else if(currentTab==="inspeccion") content.innerHTML=renderInspeccion();
}
function setTab(t){currentTab=t;render();}

// ── DASHBOARD ──
function renderDashboard(alertasSOAT,alertasRev,alertasCli) {
  const enStock=vehs.filter(v=>["Disponible","Publicado"].includes(v.estado));
  const vendidos=vehs.filter(v=>v.estado==="Vendido");
  const utilRealTotal=vendidos.reduce((s,v)=>{const u=calcUtilidad(v);return s+(u?.val||0);},0);
  const utilProyTotal=enStock.reduce((s,v)=>{const u=calcUtilidad(v);return s+(u?.val||0);},0);
  const cliActivos=clis.filter(c=>["Caliente","Tibio"].includes(c.status)).length;
  const inversionStock=enStock.reduce((s,v)=>s+calcCostoTotal(v),0);
  const stats=[

let tasadoraData = { placa:"", valorComercial:0, costoReacondicionamiento:0, cargasLegales:0, margenGanancia:15 };

function calcularOferta(d) {
  const valorComercial=parseFloat(d.valorComercial)||0, reacond=parseFloat(d.costoReacondicionamiento)||0,
        cargas=parseFloat(d.cargasLegales)||0, margen=parseFloat(d.margenGanancia)||0;
  const totalDeducciones=reacond+cargas, utilidadNeta=valorComercial*(margen/100),
        precioMaxOferta=valorComercial-totalDeducciones-utilidadNeta, inversionTotal=precioMaxOferta+totalDeducciones;
  return{valorComercial,reacond,cargas,totalDeducciones,utilidadNeta,precioMaxOferta,inversionTotal,margen};
}

              <span id="desgUtilidad" class="font-extrabold text-amber-300 text-lg">${money(r.utilidadNeta)}</span>

function actualizarResultados() {
  const r=calcularOferta(tasadoraData), ofertaInvalida=r.precioMaxOferta<=0&&r.valorComercial>0;
  const hero=document.getElementById("heroOferta"), display=document.getElementById("precioMaxDisplay"), subtext=document.getElementById("ofertaSubtext");
  if(!hero||!display) return;
  hero.className=`bg-gradient-to-br ${ofertaInvalida?'from-red-900/60 to-red-950/40 border-red-500/60':'from-emerald-900/60 to-blue-900/40 border-emerald-500/60'} border-2 rounded-2xl p-6 shadow-2xl`;
  display.className=`text-5xl md:text-6xl font-black ${ofertaInvalida?'text-red-300':'text-white'} tracking-tight`;
  display.textContent=money(r.precioMaxOferta);
  subtext.className=`text-xs mt-3 ${ofertaInvalida?'text-red-400':'text-emerald-200/80'}`;
  subtext.textContent=ofertaInvalida?'⚠️ La operación no es rentable':'Este es el máximo que puedes pagar.';
  ["desgValorComercial","desgReacond","desgCargas","desgDeducciones","desgUtilidad","desgMargen","desgInversion"].forEach(id=>{
    const el=document.getElementById(id); if(!el) return;
    if(id==="desgValorComercial") el.textContent=money(r.valorComercial);
    else if(id==="desgReacond")   el.textContent="−"+money(r.reacond);
    else if(id==="desgCargas")    el.textContent="−"+money(r.cargas);
    else if(id==="desgDeducciones") el.textContent="−"+money(r.totalDeducciones);
    else if(id==="desgUtilidad")  el.textContent=money(r.utilidadNeta);
    else if(id==="desgMargen")    el.textContent=r.margen;
    else if(id==="desgInversion") el.textContent=money(r.inversionTotal);
  });
}

function enviarTasacion(conInspeccion) {
  const r=calcularOferta(tasadoraData);
  if(!tasadoraData.placa){toast("⚠️ Ingresa la placa del vehículo","error");return;}
  if(r.valorComercial<=0){toast("⚠️ Ingresa el valor comercial","error");return;}
  const etiqueta=conInspeccion?"Con Inspección":"Precio Referencial";
  if(!confirm(`¿Guardar tasación de ${tasadoraData.placa} como "${etiqueta}"?\nOferta máx: ${money(r.precioMaxOferta)}`)) return;
  toast("Guardando...", "success");
  apiFetch('guardarTasacion', {
    placa:tasadoraData.placa, valorComercial:tasadoraData.valorComercial,
    costoReacondicionamiento:tasadoraData.costoReacondicionamiento, cargasLegales:tasadoraData.cargasLegales,
    margenGanancia:tasadoraData.margenGanancia, totalDeducciones:r.totalDeducciones,
    utilidadNeta:r.utilidadNeta, precioMaxOferta:r.precioMaxOferta, inversionTotal:r.inversionTotal,
    estado:conInspeccion?'Aprobada':'Cotización', conInspeccion:conInspeccion,
    usuario:usuarioActual?usuarioActual.nombre:""
  }).then(res=>{
    if(res.exito){
      toast("✅ "+res.mensaje,"success");
      ultimoIdOperacion = conInspeccion ? res.idOperacion : null;
      tasadoraData={placa:"",valorComercial:0,costoReacondicionamiento:0,cargasLegales:0,margenGanancia:15};
      operaciones=[];   // forzar recarga en tab operaciones
      render();
    } else { toast("⚠️ "+(res.error||"Error al guardar"),"error"); }
  }).catch(()=>toast("⚠️ Error de conexión","error"));
}

function cargarOperaciones() {
  operacionesCargando=true; render();
  apiGet('operaciones')
    .then(data=>{operaciones=data||[];operacionesCargando=false;render();})
    .catch(()=>{operacionesCargando=false;operaciones=[];toast("⚠️ Error al cargar operaciones","error");render();});
}

      const esLegacy=op._legacy;

      const estadoBadge=tieneInsp?'bg-emerald-500/20 text-emerald-400 border-emerald-500/50':'bg-amber-500/20 text-amber-400 border-amber-500/50';
      const estadoLabel=tieneInsp?'🔗 Con Inspección':'📋 Precio Referencial';

      html+=`<div class="bg-slate-900 border ${tieneInsp?'border-emerald-500/30':'border-slate-800'} rounded-xl overflow-hidden">

        ${estaExp?`

        <div class="border-t border-slate-800 p-4">
          <div class="grid grid-cols-2 md:grid-cols-4 gap-3 mb-4 text-sm">

              ${op.inspeccion.link_fotos?`<a href="${op.inspeccion.link_fotos}" target="_blank" class="bg-blue-500/20 text-sky-400 border border-blue-500/40 rounded-lg px-4 py-2 text-xs font-bold hover:bg-blue-500/30">📷 Ver Fotos</a>`:''}
              ${op.inspeccion.fecha_venc_fotos?`<span class="text-slate-500 text-xs self-center">⏰ Fotos vencen: ${op.inspeccion.fecha_venc_fotos}</span>`:''}
            </div>

            <div class="text-amber-400 text-sm font-semibold mb-1">📋 Sin inspección vinculada</div>
            <div class="text-slate-500 text-xs">Esta operación es solo de precio referencial.</div>
            ${!esLegacy?`<div class="text-slate-600 text-xs mt-1">Código para el técnico: <span class="text-sky-400 font-bold">${opId}</span></div>`:''}
          </div>`}

          <div class="flex justify-end mt-3">
            <button onclick="eliminarOperacion(${op._rowIndex},'${op.Placa||''}')" class="text-red-400 hover:text-red-300 text-xs px-3 py-1 border border-red-500/30 rounded">🗑 Eliminar</button>
          </div>
        </div>`:''}
      </div>`;
    });
    html+="</div>";
  }
  return html+"</div>";
}

function eliminarOperacion(rowIndex, placa) {
  if(!confirm(`¿Eliminar la operación de ${placa}? Esta acción no se puede deshacer.`)) return;
  apiFetch('eliminarTasacion',{rowIndex}).then(res=>{
    toast(res.exito?"✅ Operación eliminada":"⚠️ "+res.error, res.exito?"success":"error");
    if(res.exito) cargarOperaciones();
  }).catch(()=>toast("⚠️ Error de conexión","error"));
}

const ESTADO_OPERATIVO   = ["","Operativo","Desgaste Normal","Requiere Reparación"];
const ESTADO_ESTETICA    = ["","Excelente","Desgaste Leve","Roto/Para Retapizar"];

function colorSelectEstado(val) {
  if(!val) return "";
  const v=val.toLowerCase();
  if(v.includes("original")||v.includes("conforme")||v.includes("operativo")||v.includes("excelente")) return "border-green-500/60 text-green-300";
  if(v.includes("repintado")||v.includes("desgaste")||v.includes("mantenimiento")||v.includes("leve")) return "border-amber-500/60 text-amber-300";
  if(v.includes("requiere")||v.includes("roto")||v.includes("retapizar")) return "border-orange-500/60 text-orange-300";
  if(v.includes("crítica")||v.includes("critica")) return "border-red-500/60 text-red-400";
  return "";
}

function renderInspeccion() {
  let html=`<div class="max-w-3xl mx-auto">
    <div class="mb-5"><h1 class="text-xl font-extrabold">📋 Inspección Técnica</h1><p class="text-slate-500 text-sm mt-1">Peritaje de campo. Toca cada sección para expandir.</p></div>

      <input type="text" placeholder="Ej: OP-0001" value="${inspeccionData.id_operacion||''}"
        oninput="inspeccionData.id_operacion=this.value.toUpperCase();this.value=this.value.toUpperCase()"

      <div class="text-slate-500 text-xs mt-2">Si el admin generó un código de tasación, ingrésalo aquí para vincular esta inspección.</div>
    </div>`;

  INSPECCION_SECCIONES.forEach(sec=>{
    const abierta=seccionesAbiertas[sec.id];
    const completados=sec.campos.filter(c=>inspeccionData[c.k]&&String(inspeccionData[c.k]).trim()!=="").length;
    const total=sec.campos.length;
    const ringClass=sec.crucial?"ring-2 ring-amber-500/40":"";
    html+=`<div class="bg-slate-900 border border-slate-800 ${ringClass} rounded-xl mb-3 overflow-hidden">
      <button onclick="toggleSeccion('${sec.id}')" class="w-full flex justify-between items-center p-4 hover:bg-slate-800/40 transition">
        <div class="flex items-center gap-3"><span class="text-2xl">${sec.icon}</span><div class="text-left"><div class="font-bold text-sm">${sec.titulo}</div><div class="text-xs text-slate-500 mt-0.5">${completados}/${total} campos</div></div></div>
        <div class="flex items-center gap-2">${completados===total?'<span class="text-green-400 text-lg">✓</span>':completados>0?'<span class="text-amber-400 text-xs">●</span>':''}<span class="text-slate-400 text-xl">${abierta?'⌃':'⌄'}</span></div>
      </button>`;
    if(abierta){
      html+=`<div class="px-4 pb-4 border-t border-slate-800 pt-4"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
      sec.campos.forEach(c=>{
        const val=inspeccionData[c.k]||"", fullClass=c.full?"sm:col-span-2":"", reqMark=c.req?'<span class="text-red-400">*</span>':'', hl=c.highlight?'text-amber-300':'';
        if(["estructural","mecanico","operativo","estetica"].includes(c.t)){
          const opts=c.t==="estructural"?ESTADO_ESTRUCTURAL:c.t==="mecanico"?ESTADO_MECANICO:c.t==="operativo"?ESTADO_OPERATIVO:ESTADO_ESTETICA;
          const colorClass=colorSelectEstado(val);
          html+=`<div class="${fullClass}"><label class="${hl}">${c.l} ${reqMark}</label><select data-insp="${c.k}" onchange="inspeccionData['${c.k}']=this.value;render()" class="${colorClass}">${opts.map(o=>`<option value="${o}" ${val===o?"selected":""}>${o||"— seleccionar —"}</option>`).join("")}</select></div>`;
        } else if(c.t==="select"){
          html+=`<div class="${fullClass}"><label class="${hl}">${c.l} ${reqMark}</label><select data-insp="${c.k}" onchange="inspeccionData['${c.k}']=this.value;render()">${c.opts.map(o=>`<option value="${o}" ${val===o?"selected":""}>${o||"— seleccionar —"}</option>`).join("")}</select></div>`;
        } else if(c.t==="textarea"){
          html+=`<div class="${fullClass}"><label class="${hl}">${c.l} ${reqMark}</label><textarea data-insp="${c.k}" rows="3" oninput="inspeccionData['${c.k}']=this.value">${val}</textarea></div>`;
        } else {
          const hiInput=c.highlight?'bg-amber-500/5 border-amber-500/50 text-amber-100 font-bold text-base':'';
          html+=`<div class="${fullClass}"><label class="${hl}">${c.l} ${reqMark}</label><input data-insp="${c.k}" type="${c.t}" value="${val}" oninput="inspeccionData['${c.k}']=this.value" class="${hiInput}"></div>`;
        }
      });

    }

  });

  // SECCIÓN 7: Evidencia Fotográfica
  html+=`<div class="bg-slate-900 border-2 border-sky-500/30 rounded-xl mb-3 overflow-hidden">

function scoreEstado(valor){
  if(!valor) return null;
  const v=valor.toLowerCase();
  if(v.includes("original")||v.includes("conforme")||v.includes("operativo")||v.includes("excelente")) return 10;
  if(v.includes("repintado")||v.includes("desgaste normal")||v.includes("leve")) return 7;
  if(v.includes("desgaste")||v.includes("mantenimiento")) return 5;
  if(v.includes("requiere")||v.includes("roto")||v.includes("retapizar")) return 4;
  if(v.includes("crítica")||v.includes("critica")) return 1;
  return null;
}
function emojiPorScore(score){if(score===null)return"⚪ Sin evaluar";if(score>=8.5)return"🟢 Conforme";if(score>=5)return"🟡 Atención";return"🔴 Crítico";}
function calcularScoreSeccion(seccionId){
  const sec=INSPECCION_SECCIONES.find(s=>s.id===seccionId);
  if(!sec) return{score:null,resumen:"⚪ Sin evaluar"};
  let suma=0,count=0;
  sec.campos.forEach(c=>{if(["estructural","mecanico","operativo","estetica"].includes(c.t)){const s=scoreEstado(inspeccionData[c.k]);if(s!==null){suma+=s;count++;}}});
  if(!count) return{score:null,resumen:"⚪ Sin evaluar"};
  const prom=suma/count;
  return{score:Math.round(prom*10)/10,resumen:emojiPorScore(prom)};
}
function calcularScoreGlobal(){
  const c=calcularScoreSeccion("s2"),m=calcularScoreSeccion("s3"),t=calcularScoreSeccion("s4"),e=calcularScoreSeccion("s5");
  const scores=[{val:m.score,peso:0.35},{val:t.score,peso:0.25},{val:c.score,peso:0.25},{val:e.score,peso:0.15}].filter(s=>s.val!==null);
  if(!scores.length) return null;
  const pesoTotal=scores.reduce((s,x)=>s+x.peso,0);
  return Math.round(scores.reduce((s,x)=>s+(x.val*x.peso),0)/pesoTotal*10);
}

async function guardarInspeccion() {

  INSPECCION_SECCIONES.forEach(sec=>sec.campos.forEach(c=>{

  }));
  if(faltantes.length){toast("⚠️ Faltan campos: "+faltantes.join(", "),"error");return;}

  const btn=document.getElementById("btnGuardarInsp");
  if(btn){btn.disabled=true;btn.innerHTML='<span class="inline-block animate-spin mr-2">⏳</span> Generando Informe...';}

        const reader=new FileReader();
        reader.onload=e=>resolve({bytes:e.target.result.split(',')[1],nombre:file.name,tipo:file.type});

    <div class="section-title">Costos y Gastos ($)</div><div class="grid grid-cols-3 gap-3 mb-4">${inp("costoCompra","Compra","number","min=0")}${inp("comision","Comisión","number","min=0")}${inp("costoInspeccion","Inspección","number","min=0")}${inp("gastosNotaria","Notaría","number","min=0")}${inp("gastoFirma","Firma","number","min=0")}${inp("retoques","Retoques","number","min=0")}${inp("gastoCombustible","Combustible","number","min=0")}${inp("gastoLavado","Lavado","number","min=0")}${inp("gastosCochera","Cochera","number","min=0")}${inp("otrosGastos","Otros","number","min=0")}${txt("descripcionGastos","Descripción de gastos")}</div>
    <div class="section-title">Precios ($)</div><div class="grid grid-cols-2 gap-3 mb-4">${inp("precioPublicacion","Precio Publicación","number","min=0")}${inp("precioVenta","Precio Venta","number","min=0")}${inp("fechaPublicacion","F. Publicación","date")}${inp("fechaVenta","F. Venta","date")}</div>
    <div class="section-title">Notas</div><div class="grid grid-cols-3 gap-3 mb-4">${txt("comentarios","Comentarios")}</div>
    <div class="flex gap-2 justify-end"><button type="button" onclick="closeModal()" class="border border-slate-700 text-slate-400 rounded px-4 py-2 text-sm">Cancelar</button><button type="submit" id="btnSaveVeh" class="bg-blue-600 text-white rounded px-4 py-2 text-sm font-semibold">Guardar</button></div>
  </form>`;
  modal(id?"Editar Vehículo":"Nuevo Vehículo",body);
}

function saveVeh(id){
  const form=document.getElementById("vehForm");
  const data=id?{...vehs.find(x=>String(x.id)===String(id))}:{...EMPTY_VEH};
  form.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;let v=el.value;if(el.type==="number")v=parseFloat(v)||0;data[k]=v;});
  if(id) data.id=id;
  const btn=document.getElementById("btnSaveVeh");
  if(btn){btn.disabled=true;btn.textContent="Guardando...";}
  apiFetch('guardarVehiculo',vehToBackend(data))
    .then(res=>{if(res.exito){closeModal();recargarApp();}else{if(btn){btn.disabled=false;btn.textContent="Guardar";}errorGuardar(res);}})
    .catch(err=>{if(btn){btn.disabled=false;btn.textContent="Guardar";}errorGuardar(err);});
}

function openCliModal(id){
  const c=id?{...clis.find(x=>String(x.id)===String(id))}:{...EMPTY_CLI};
  const inp=(k,l,t="text",extra="")=>`<div><label>${l}</label><input data-k="${k}" type="${t}" value="${c[k]??""}" ${extra}></div>`;
  const sel=(k,l,opts)=>`<div><label>${l}</label><select data-k="${k}">${opts.map(o=>`<option ${c[k]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;
  const body=`<form id="cliForm" onsubmit="event.preventDefault();saveCli('${id||""}')">
    <div class="section-title">Datos del Cliente</div><div class="grid grid-cols-3 gap-3 mb-4">${inp("nombre","Nombre *")}${inp("celular","Celular")}${inp("fechaContacto","F. Contacto","date")}${inp("fechaUltimoContacto","Último Contacto","date")}${sel("status","Status",STATUS_CRM)}${sel("origen","Origen",ORIGENES)}${sel("tipoPago","Tipo Pago",PAGOS)}</div>
    <div class="section-title">Búsqueda</div><div class="grid grid-cols-3 gap-3 mb-4">${sel("marcaBusca","Marca",["Indiferente",...MARCAS])}${inp("modeloBusca","Modelo")}${inp("ranioMin","Año mín","number")}${inp("ranioMax","Año máx","number")}${inp("presupuesto","Presupuesto $","number","min=0")}${sel("transmisionDesea","Transmisión",["Indiferente","Manual","Automático","CVT"])}${sel("carroceria","Carrocería",CARROCERIAS)}${sel("partePago","Parte pago",["No","Sí"])}${inp("partePagoDesc","Desc. parte pago")}</div>
    <div class="flex gap-2 justify-end"><button type="button" onclick="closeModal()" class="border border-slate-700 text-slate-400 rounded px-4 py-2 text-sm">Cancelar</button><button type="submit" id="btnSaveCli" class="bg-blue-600 text-white rounded px-4 py-2 text-sm font-semibold">Guardar</button></div>
  </form>`;
  modal(id?"Editar Cliente":"Nuevo Cliente",body);
}

function saveCli(id){
  const form=document.getElementById("cliForm");
  const data=id?{...clis.find(x=>String(x.id)===String(id))}:{...EMPTY_CLI};
  form.querySelectorAll("[data-k]").forEach(el=>{const k=el.dataset.k;let v=el.value;if(el.type==="number")v=parseFloat(v)||0;data[k]=v;});
  const btn=document.getElementById("btnSaveCli");
  if(btn){btn.disabled=true;btn.textContent="Guardando...";}
  apiFetch('guardarCliente',{
    Nombre:data.nombre,Fecha_Contacto:data.fechaContacto,Celular:data.celular,
    Marca_Busca:data.marcaBusca,Modelo_Busca:data.modeloBusca,Anio_Min:data.ranioMin,Anio_Max:data.ranioMax,
    Presupuesto:data.presupuesto,Transmision_Desea:data.transmisionDesea,Carroceria:data.carroceria,
    Parte_Pago:data.partePago,Parte_Pago_Desc:data.partePagoDesc,Status:data.status,Origen:data.origen,
    Tipo_Pago:data.tipoPago,Fecha_Ultimo_Contacto:data.fechaUltimoContacto
  }).then(res=>{if(res.exito){closeModal();recargarApp();}else{if(btn){btn.disabled=false;btn.textContent="Guardar";}errorGuardar(res);}})
    .catch(err=>{if(btn){btn.disabled=false;btn.textContent="Guardar";}errorGuardar(err);});
}

// ── LOGIN / RBAC ──
const USUARIOS = {
  "1234"   : { rol:"tecnico", nombre:"Técnico",       color:"#f59e0b", tabInicial:"inspeccion" },
  "admin99": { rol:"admin",   nombre:"Administrador", color:"#22c55e", tabInicial:"dashboard"  }
};
let usuarioActual = null;

function intentarLogin(){
  const pin=document.getElementById("pinInput").value.trim();
  const err=document.getElementById("loginError");
  const usuario=USUARIOS[pin];
  if(!usuario){err.textContent="PIN incorrecto.";err.classList.remove("hidden");document.getElementById("pinInput").value="";return;}
  usuarioActual=usuario;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appWrapper").classList.remove("hidden");
  aplicarRBAC();
  currentTab=usuario.tabInicial;
  if(usuario.rol==="admin") sincronizar();
  else { cargando=false; showLoader(false); render(); }
}

function aplicarRBAC(){
  if(!usuarioActual) return;
  const esAdmin=usuarioActual.rol==="admin";
  document.querySelectorAll(".tab-btn").forEach(btn=>{
    const role=btn.dataset.role;
    btn.classList.toggle("hidden",role==="admin"&&!esAdmin);
  });
  document.getElementById("btnSync").style.display=esAdmin?"":"none";
  const b=document.getElementById("userBadge");
  b.textContent=`${usuarioActual.rol==="admin"?"👑":"🔧"} ${usuarioActual.nombre}`;
  b.style.background=usuarioActual.color+"22"; b.style.color=usuarioActual.color;
  b.style.border=`1px solid ${usuarioActual.color}55`; b.classList.remove("hidden");
}

function cerrarSesion(){
  if(!confirm("¿Cerrar sesión?")) return;
  usuarioActual=null; vehs=[]; clis=[]; inspeccionData={}; archivosInspeccion=[];
  document.getElementById("appWrapper").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("pinInput").value="";
  document.getElementById("loginError").classList.add("hidden");
  setTimeout(()=>document.getElementById("pinInput")?.focus(),100);
}

document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click",()=>{currentTab=b.dataset.tab;render();});
});
setTimeout(()=>document.getElementById("pinInput")?.focus(),100);
</script>
</body>
</html>
