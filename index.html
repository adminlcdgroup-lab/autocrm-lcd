function abrirEmbudoCard(idOp) {
  const c = cotizaciones.find(x => String(x.ID_Operacion || x._rowIndex) === String(idOp));
  if (!c) { toast('⚠️ Operación no encontrada', 'error'); return; }

  const estado = _normalizarEstadoEmbudo(c.Estado);
  const def = EMBUDO_ESTADOS.find(s => s.key === estado) || EMBUDO_ESTADOS[0];
  const cliCelular = c.Cli_Celular || '';
  const waLink = cliCelular ? `https://wa.me/${String(cliCelular).replace(/[^0-9]/g,'')}` : '';
  const km = c.KM || 0;
  const oferta = Number(c.Precio_Maximo_Oferta) || 0;
  const precioFinal = Number(c.Precio_Final_Compra) || 0;
  const transiciones = EMBUDO_TRANSICIONES[estado] || [];

  const datos = [
    ['Vehículo', `${c.Marca||''} ${c.Modelo||''} ${c.Version||''}`.trim() || '—'],
    ['Año', c.Anio || '—'],
    ['Placa', c.Placa || '—'],
    ['KM', km ? parseInt(km).toLocaleString()+' km' : '—'],
    ['Valor comercial', money(c.Valor_Comercial)],
    ['Oferta máxima', money(oferta)],
    ['Margen', (c.Margen_Ganancia_Pct||0)+'%']
  ];
  if (precioFinal > 0) datos.push(['💰 Precio final compra', money(precioFinal)]);
  if (c.Fecha_Compra) datos.push(['Fecha compra', c.Fecha_Compra]);
  if (c.ID_Vehiculo_Stock) datos.push(['En Stock', '🚗 ' + c.ID_Vehiculo_Stock]);

  let body = `
    <div class="flex items-center gap-2 mb-4">
      <span class="badge" style="background:${def.color}22;color:${def.color};border:1px solid ${def.color}55">${def.icon} ${def.label}</span>
      <span class="text-slate-500 text-xs">${escHtml(c.ID_Operacion||'')}</span>
    </div>

    <div class="bg-slate-800/60 rounded-lg p-3 mb-4">
      <div class="text-sky-400 text-xs font-bold mb-2">👤 Cliente</div>
      ${c.Cli_Nombre
        ? `<div class="font-semibold text-slate-100">${escHtml(c.Cli_Nombre)}</div>
           ${cliCelular ? `<a href="${escAttr(waLink)}" target="_blank" class="text-emerald-400 hover:text-emerald-300 text-sm">📱 ${escHtml(cliCelular)} — abrir WhatsApp</a>` : ''}
           <div class="mt-2">
             <label class="text-[10px]">Notas / Seguimiento</label>
             <textarea id="embudoNotas" rows="2" class="mt-1" placeholder="Ej: llamará el viernes, lo consultará...">${escHtml(c.Cli_Notas||'')}</textarea>
             <button onclick="guardarNotasEmbudo('${escAttr(c.ID_Operacion)}')" class="text-xs text-sky-400 hover:text-sky-300 mt-1 font-semibold">💾 Guardar notas</button>
           </div>`
        : `<div class="text-slate-500 text-sm italic">Sin datos de cliente registrados</div>`}
    </div>

    <div class="grid grid-cols-2 gap-2 mb-4 text-sm">
      ${datos.map(([k,v])=>`<div class="bg-slate-800 rounded p-2"><div class="text-slate-500 text-[10px]">${k}</div><div class="font-semibold mt-0.5">${escHtml(v)}</div></div>`).join('')}
    </div>`;

  // Sección precio final si está en Inspección o Precio Final
  if (estado === 'En Inspección' || estado === 'Precio Final') {
    body += `<div class="bg-yellow-500/5 border border-yellow-500/20 rounded-lg p-3 mb-4">
      <label class="text-yellow-300 text-xs font-bold">💰 Precio Final de Compra ($)</label>
      <input type="number" id="embudoPrecioFinal" min="0" step="100" value="${precioFinal||''}" placeholder="Ej: 14500" class="mt-1 text-lg font-bold">
      <div class="text-[10px] text-slate-500 mt-1">Precio real acordado tras la inspección. Se usará como costo de compra al pasar a Stock.</div>
    </div>`;
  }

  // Acciones contextuales
  body += `<div class="flex flex-col gap-2 mt-4">`;
  transiciones.forEach(t => {
    if (t.to === '__COMPRAR__') {
      body += `<button onclick="confirmarCompraEmbudo('${escAttr(c.ID_Operacion)}')" class="btn-primary" style="background:linear-gradient(180deg,#16a34a,#15803d);">${t.label}</button>`;
    } else {
      const cls = t.danger ? 'border border-red-500/40 text-red-400 hover:bg-red-500/10'
                : t.primary ? 'btn-primary'
                : 'border border-slate-700 text-slate-300 hover:bg-slate-800';
      body += `<button onclick="moverEmbudo('${escAttr(c.ID_Operacion)}','${escAttr(t.to)}')" class="${cls} rounded-lg py-2.5 text-sm font-semibold">${t.label}</button>`;
    }
  });
  body += `<button onclick="closeModal()" class="text-slate-500 text-xs mt-1 hover:text-slate-300">Cerrar</button>`;
  body += `</div>`;

  modal(`${def.icon} Operación de Compra`, body);
}

function _embudoRun(fnName, payload, okMsg) {
  if (typeof google === "undefined" || !google.script || !google.script.run) {
    toast('⚠️ Modo preview', 'error'); return;
  }
  google.script.run
    .withSuccessHandler(r => {
      if (r && r.exito === false) { toast('⚠️ ' + (r.error||'Error'), 'error'); return; }
      closeModal();
      toast(okMsg || (r && r.mensaje) || '✅ Actualizado', 'success');
      cargarCotizaciones();
    })
    .withFailureHandler(err => toast('⚠️ Error: ' + (err.message||err), 'error'))
    [fnName](payload);
}

function moverEmbudo(idOp, nuevoEstado) {
  // Si vamos a "Precio Final" y hay input de precio, lo guardamos también
  const campos = {};
  const inpPF = document.getElementById('embudoPrecioFinal');
  if (inpPF && parseFloat(inpPF.value) > 0) campos.Precio_Final_Compra = parseFloat(inpPF.value);
  _embudoRun('actualizarTasacion', { idOperacion: idOp, estado: nuevoEstado, campos: campos }, '✅ Movido a: ' + nuevoEstado);
}

function guardarNotasEmbudo(idOp) {
  const notas = document.getElementById('embudoNotas')?.value || '';
  _embudoRun('actualizarTasacion', { idOperacion: idOp, campos: { Cli_Notas: notas } }, '💾 Notas guardadas');
}

function confirmarCompraEmbudo(idOp) {
  const inpPF = document.getElementById('embudoPrecioFinal');
  const precioFinal = inpPF ? parseFloat(inpPF.value) || 0 : 0;
  if (precioFinal <= 0) {
    toast('⚠️ Ingresa el precio final de compra antes de confirmar', 'error');
    if (inpPF) inpPF.focus();
    return;
  }
  confirmAccion({
    title: 'Confirmar compra',
    message: `Se registrará la compra por ${money(precioFinal)} y el vehículo pasará automáticamente al Stock como "Disponible". ¿Confirmar?`,
    confirmText: '✅ Confirmar y pasar a Stock',
    icon: '🚗'
  }).then(ok => {
    if (!ok) return;
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      toast('⚠️ Modo preview', 'error'); return;
    }
    google.script.run
      .withSuccessHandler(r => {
        if (r && r.exito === false) { toast('⚠️ ' + (r.error||'Error'), 'error'); return; }
        closeModal();
        toast((r && r.mensaje) || '✅ Compra confirmada · vehículo en Stock', 'success');
        cargarCotizaciones();
        // Tras refrescar el Stock, buscar compradores compatibles con el auto nuevo
        const placaNueva = (r && r.idVehiculo) || '';
        _postSyncCallback = () => notificarCompradoresCompatibles(placaNueva);
        sincronizar();
      })
      .withFailureHandler(err => toast('⚠️ Error: ' + (err.message||err), 'error'))
      .confirmarCompra({ idOperacion: idOp, precioFinal: precioFinal });
  });
}

// Tras entrar un auto al Stock, revisa la base de Compradores y avisa si hay match
function notificarCompradoresCompatibles(placa) {
  if (!placa) return;
  const veh = vehs.find(v => String(v.placa).toUpperCase() === String(placa).toUpperCase());
  if (!veh) return;
  const matches = (typeof findMatchesForVeh === 'function') ? findMatchesForVeh(veh) : [];
  if (!matches || matches.length === 0) return;

  const top = matches.slice(0, 5);
  const body = `
    <div class="bg-emerald-500/10 border border-emerald-500/30 rounded-lg p-3 mb-4">
      <div class="text-emerald-400 font-bold text-sm">🚗 ${escHtml(veh.marca)} ${escHtml(veh.modelo)} ${escHtml(veh.anio)} entró al Stock</div>
      <div class="text-slate-400 text-xs mt-1">Encontramos <b>${matches.length}</b> comprador${matches.length>1?'es':''} registrado${matches.length>1?'s':''} que buscan algo así:</div>
    </div>
    <div class="space-y-2">
      ${top.map(m => {
        const cel = m.cliente.celular || '';
        const wa = cel ? `https://wa.me/${String(cel).replace(/[^0-9]/g,'')}?text=${encodeURIComponent('Hola '+(m.cliente.nombre||'')+', ingresó a nuestro stock un '+veh.marca+' '+veh.modelo+' '+veh.anio+' que puede interesarte.')}` : '';
        return `<div class="bg-slate-800/60 rounded-lg p-3 flex items-center justify-between gap-2">
          <div>
            <div class="font-semibold text-slate-100 text-sm">${STATUS_EMOJI[m.cliente.status]||''} ${escHtml(m.cliente.nombre||'Cliente')}</div>
            <div class="text-slate-500 text-xs">Compatibilidad ${m.score}/100 · presupuesto ${money(m.cliente.presupuesto)}</div>
          </div>
          ${wa ? `<a href="${escAttr(wa)}" target="_blank" class="btn-primary text-xs whitespace-nowrap" style="background:linear-gradient(180deg,#16a34a,#15803d);padding:8px 12px;">📱 Contactar</a>` : `<span class="text-slate-600 text-xs">sin celular</span>`}
        </div>`;
      }).join('')}
    </div>
    <div class="flex justify-end mt-4">
      <button onclick="closeModal();setTab('matches')" class="text-sky-400 text-xs font-semibold hover:text-sky-300">Ver todas las oportunidades →</button>
    </div>`;
  modal('🎯 Compradores compatibles', body);
}

let auditoriaData = [];
let auditoriaCargando = false;
let _audInFlight = false;
let filtroAudTipo = "Todos";
let filtroAudUsuario = "Todos";
let searchAud = "";

function cargarAuditoria() {
  if (_audInFlight) return;
  if(typeof google === "undefined" || !google.script || !google.script.run) {
    auditoriaData = []; auditoriaCargando = false; return;
  }
  _audInFlight = true;
  auditoriaCargando = true;
  render();
  google.script.run
    .withSuccessHandler(r => {
      _audInFlight = false;
      auditoriaData = (r && r.entries) ? r.entries : [];
      auditoriaCargando = false;
      render();
    })
    .withFailureHandler(err => {
      _audInFlight = false;
      auditoriaCargando = false;
      auditoriaData = [];
      toast("⚠️ No se pudo cargar la auditoría: " + (err.message||err), "error");
      render();
    })
    .obtenerAuditoria(400);
}

function _audFiltrada() {
  return auditoriaData.filter(a => {
    if (filtroAudTipo !== "Todos" && a.tipo !== filtroAudTipo) return false;
    if (filtroAudUsuario !== "Todos" && a.usuario !== filtroAudUsuario) return false;
    if (searchAud) {
      const q = searchAud.toLowerCase();
      const blob = `${a.usuario} ${a.tipo} ${a.accion} ${a.descripcion} ${a.id_entidad}`.toLowerCase();
      if (!blob.includes(q)) return false;
    }
    return true;
  });
}

function generarAlertasInteligentes() {
  const alertas = [];
  const hoy = today();
  const enStock = vehs.filter(v => ["Disponible","Publicado","Reservado"].includes(v.estado));

  // 1. Stock lento >45 días
  enStock.forEach(v => {
    const dias = calcDiasStock(v);
    if (dias !== null && dias > 45) {
      const precioActual = parseFloat(v.precioPublicacion) || 0;
      const sugerencia   = precioActual > 0 ? Math.round(precioActual * 0.95) : null;
      alertas.push({
        prioridad: dias > 60 ? 'urgente' : 'atencion',
        icon: '⏰',
        titulo: `${v.marca} ${v.modelo} (${v.placa}) lleva ${dias}d en stock`,
        descripcion: sugerencia ? `Sugerencia: bajar precio a ${money(sugerencia)} (-5%)` : 'Considera publicarlo o ajustar precio',
        tab: 'inventario'
      });
    }
  });

  // 2. SOAT / Rev Técnica por vencer (<15 días)
  enStock.forEach(v => {
    if (v.soat) {
      const d = diffDays(hoy, v.soat);
      if (d >= 0 && d <= 15) alertas.push({
        prioridad: d <= 7 ? 'urgente' : 'atencion', icon:'📄',
        titulo: `SOAT del ${v.marca} ${v.modelo} (${v.placa}) vence en ${d}d`,
        descripcion: `Fecha: ${fmt(v.soat)}. Renovar antes de publicar.`, tab:'inventario'
      });
    }
    if (v.revTecnica) {
      const d = diffDays(hoy, v.revTecnica);
      if (d >= 0 && d <= 15) alertas.push({
        prioridad: d <= 7 ? 'urgente' : 'atencion', icon:'🔧',
        titulo: `Rev. Técnica del ${v.marca} ${v.modelo} (${v.placa}) vence en ${d}d`,
        descripcion: `Fecha: ${fmt(v.revTecnica)}`, tab:'inventario'
      });
    }
  });

  // 3. Clientes activos sin contacto >7 días
  clis.filter(c => ["Caliente","Tibio"].includes(c.status) && c.fechaUltimoContacto).forEach(c => {
    const dias = diffDays(c.fechaUltimoContacto, hoy);
    if (dias >= 7) alertas.push({
      prioridad: c.status === 'Caliente' ? 'urgente' : 'atencion', icon:'📱',
      titulo: `${c.nombre} (${c.status}) sin contacto hace ${dias}d`,
      descripcion: `Buscando ${c.marcaBusca} ${c.modeloBusca || ''} · 💰 ${money(c.presupuesto)}`, tab:'crm'
    });
  });

  // 4. Matches calientes sin atender (oportunidades)
  enStock.forEach(v => {
    const matches = findMatchesForVeh(v);
    matches.filter(m => m.cliente.status === 'Caliente').forEach(m => {
      alertas.push({
        prioridad: 'oportunidad', icon:'🎯',
        titulo: `${m.cliente.nombre} (Caliente) compatible con ${v.marca} ${v.modelo}`,
        descripcion: `Match ${m.score}/100 · Precio ${money(v.precioPublicacion)} dentro de su presupuesto ${money(m.cliente.presupuesto)}`,
        tab:'matches'
      });
    });
  });

  const prio = { urgente:0, atencion:1, oportunidad:2 };
  return alertas.sort((a,b) => (prio[a.prioridad]||9) - (prio[b.prioridad]||9)).slice(0, 8);
}

// ─── SMART PRICING: sugiere precio basado en vehículos similares vendidos ───
function calcularPrecioSugerido(c) {
  const TOL_KM = 25000;
  const marcaIn  = String(c.marca  ||'').toUpperCase().trim();
  const modeloIn = String(c.modelo ||'').toUpperCase().trim();
  const anioIn   = parseInt(c.anio) || 0;
  const kmIn     = parseInt(c.km)   || 0;

  // Los tres campos son obligatorios — sin ellos el promedio no tiene sentido
  if (!marcaIn)  return { confianza:'sin_datos', mensaje:'Indica la marca', matches:[] };
  if (!modeloIn) return { confianza:'sin_datos', mensaje:'Indica el modelo', matches:[] };
  if (!anioIn)   return { confianza:'sin_datos', mensaje:'Indica el año', matches:[] };

  // Match estricto: Marca + Modelo + Año exactos (sin fallback)
  let matches = vehs.filter(v =>
    v.estado === 'Vendido' &&
    String(v.marca ).toUpperCase().trim() === marcaIn  &&
    String(v.modelo).toUpperCase().trim() === modeloIn &&
    parseInt(v.anio) === anioIn
  );

  if (matches.length === 0)
    return { confianza:'sin_datos', mensaje:`Sin ventas de ${marcaIn} ${modeloIn} ${anioIn} en tu histórico`, matches:[] };

  // Refinamiento opcional por km dentro del conjunto exacto
  if (kmIn > 0) {
    const filtKm = matches.filter(v => Math.abs(parseInt(v.kilometraje) - kmIn) <= TOL_KM);
    if (filtKm.length > 0) matches = filtKm;
  }

  const precios = matches.map(v => parseFloat(v.precioVenta)||0).filter(p => p > 0);
  if (precios.length === 0) return { confianza:'sin_datos', mensaje:'Sin precios válidos en histórico', matches:[] };

  const margenes = matches.map(v => calcUtilidad(v)?.val || 0).filter(m => m !== 0);
  const dias = matches.map(v => calcDiasStock(v)).filter(d => d !== null && d >= 0);

  const precioAvg = precios.reduce((s,p) => s+p, 0) / precios.length;
  const margenAvg = margenes.length > 0 ? margenes.reduce((s,m) => s+m, 0) / margenes.length : 0;
  const diasAvg   = dias.length > 0 ? dias.reduce((s,d) => s+d, 0) / dias.length : 0;

  // Confianza por cantidad de matches
  let confianza, color;
  if (matches.length >= 5)      { confianza='alta';  color='#22c55e'; }
  else if (matches.length >= 2) { confianza='media'; color='#f59e0b'; }
  else                          { confianza='baja';  color='#ef4444'; }

  return {
    confianza, color,
    precioSugerido: Math.round(precioAvg),
    precioMin: Math.round(Math.min(...precios)),
    precioMax: Math.round(Math.max(...precios)),
    margenEsperado: Math.round(margenAvg),
    diasEsperados: Math.round(diasAvg),
    basadoEn: matches.length,
    matches: matches.slice(0, 5) // top 5 para mostrar
  };
}

// ─── HEATMAP: demanda (clientes) vs stock por carrocería + transmisión ───
function calcularDemandaVsStock() {
  // Normalizar transmisión a M / A
  const normTrans = t => {
    const s = String(t||'').toUpperCase();
    if (s.includes('CVT') || s.includes('AUTO') || s === 'AT') return 'Automático';
    if (s.includes('MANUAL') || s === 'MT') return 'Manual';
    return 'Cualquiera';
  };

  // Agrupar demanda (clientes Caliente + Tibio)
  const demanda = {};
  clis.filter(c => ["Caliente","Tibio"].includes(c.status)).forEach(c => {
    const carr = c.carroceria === 'Indiferente' ? 'CUALQUIERA' : c.carroceria;
    const trans = c.transmisionDesea === 'Indiferente' ? 'Cualquiera' : c.transmisionDesea;
    const key = `${carr}|${trans}`;
    demanda[key] = demanda[key] || { carr, trans, count:0, items:[] };
    demanda[key].count++;
    demanda[key].items.push(c);
  });

  // Agrupar stock disponible
  const stock = {};
  vehs.filter(v => ["Disponible","Publicado"].includes(v.estado)).forEach(v => {
    const carr = getCarroceriaSafe(v);  // Fix #10: case-insensitive
    const trans = normTrans(v.transmision);
    const key = `${carr}|${trans}`;
    stock[key] = stock[key] || { carr, trans, count:0, items:[] };
    stock[key].count++;
    stock[key].items.push(v);
  });

  // Combinar
  const allKeys = new Set([...Object.keys(demanda), ...Object.keys(stock)]);
  const result = [];
  allKeys.forEach(key => {
    const [carr, trans] = key.split('|');
    const d = demanda[key]?.count || 0;
    const s = stock[key]?.count || 0;
    let estado, sugerencia;
    if (d > 0 && s === 0) {
      estado = 'oportunidad';
      sugerencia = `Comprar ${d} ${carr} ${trans} — ${d} cliente${d>1?'s':''} buscando, 0 en stock`;
    } else if (d > s) {
      estado = 'subStock';
      sugerencia = `Considerar más ${carr} — demanda ${d} > stock ${s}`;
    } else if (s > Math.max(d * 2, 2)) {
      estado = 'sobreStock';
      sugerencia = `Sobre-stock de ${carr} — bajar precio o pausar compra`;
    } else {
      estado = 'equilibrado';
      sugerencia = `Balanceado: ${d} demanda vs ${s} stock`;
    }
    result.push({ carr, trans, demanda:d, stock:s, estado, sugerencia });
  });

  return result.sort((a,b) => {
    const prio = { oportunidad:0, subStock:1, sobreStock:2, equilibrado:3 };
    return (prio[a.estado]||9) - (prio[b.estado]||9);
  });
}

function calcularPerformanceMarcas() {
  const grupos = {};

  vehs.forEach(v => {
    const m = String(v.marca || 'SIN MARCA').toUpperCase().trim();
    if (!grupos[m]) {
      grupos[m] = {
        marca: m,
        total: 0, vendidos: 0, enStock: 0,
        margenRealTotal: 0, margenProyTotal: 0,
        diasStockTotal: 0, diasStockCount: 0,
        inversionTotal: 0, ventasTotal: 0,
        modelos: new Set()
      };
    }

    const g = grupos[m];
    g.total++;
    g.modelos.add(v.modelo);
    const ct = calcCostoTotal(v);
    g.inversionTotal += ct;

    if (v.estado === 'Vendido') {
      g.vendidos++;
      const venta = parseFloat(v.precioVenta) || 0;
      g.ventasTotal += venta;
      g.margenRealTotal += (venta - ct);
      if (v.fechaCompra && v.fechaVenta) {
        const dias = diffDays(v.fechaCompra, v.fechaVenta);
        if (dias >= 0) {
          g.diasStockTotal += dias;
          g.diasStockCount++;
        }
      }
    } else if (["Disponible","Publicado","Reservado"].includes(v.estado)) {
      g.enStock++;
      const u = calcUtilidad(v);
      if (u) g.margenProyTotal += u.val;
    }
  });

  return Object.values(grupos).map(g => {
    const margenAvg = g.vendidos > 0 ? g.margenRealTotal / g.vendidos : 0;
    const diasAvg   = g.diasStockCount > 0 ? g.diasStockTotal / g.diasStockCount : 0;
    const tasaExito = g.total > 0 ? (g.vendidos / g.total) * 100 : 0;
    const roi       = g.inversionTotal > 0 ? (g.margenRealTotal / g.inversionTotal) * 100 : 0;
    return {
      ...g,
      modelosCount: g.modelos.size,
      margenAvg,
      diasAvg,
      tasaExito,
      roi
    };
  }).sort((a,b) => b.margenRealTotal - a.margenRealTotal);
}

function generarInsightsPerformance(data) {
  const insights = [];
  if (data.length === 0) return insights;

  // Mejor margen total
  const top = data[0];
  if (top.vendidos > 0 && top.margenRealTotal > 0) {
    insights.push({
      tipo: 'success', icon: '🏆', marca: top.marca,
      texto: `<b>${top.marca}</b> es tu marca más rentable: ${money(top.margenRealTotal)} de margen total en ${top.vendidos} venta${top.vendidos>1?'s':''}.`,
      accion: 'Click para ver el detalle de esta marca →'
    });
  }

  // Marca más rápida en vender
  const rapidas = data.filter(m => m.vendidos > 0 && m.diasAvg > 0).sort((a,b) => a.diasAvg - b.diasAvg);
  if (rapidas.length > 0 && rapidas[0].diasAvg <= 15) {
    insights.push({
      tipo: 'success', icon: '⚡', marca: rapidas[0].marca,
      texto: `<b>${rapidas[0].marca}</b> rota muy rápido: ${Math.round(rapidas[0].diasAvg)} días promedio de stock.`,
      accion: 'Click para ver el detalle →'
    });
  }

  // Marcas con pérdida
  data.filter(m => m.vendidos > 0 && m.margenRealTotal < 0).forEach(p => {
    insights.push({
      tipo: 'danger', icon: '🔴', marca: p.marca,
      texto: `<b>${p.marca}</b> generó pérdida: ${money(p.margenRealTotal)} en ${p.vendidos} venta${p.vendidos>1?'s':''}.`,
      accion: 'Click para revisar esta marca →'
    });
  });

  // Marcas con stock lento
  data.filter(m => m.vendidos > 0 && m.diasAvg > 60).forEach(l => {
    insights.push({
      tipo: 'warning', icon: '🐌', marca: l.marca,
      texto: `<b>${l.marca}</b> demora ${Math.round(l.diasAvg)} días promedio en venderse.`,
      accion: 'Click para ver el detalle →'
    });
  });

  return insights;
}

// Modal de confirmación profesional (reemplaza window.confirm)
// Uso: confirmAccion({ title, message, confirmText, danger }).then(ok => ...)
// ═══════════════════════════════════════════════════════════════
function confirmAccion(opts) {
  opts = opts || {};
  const isDanger    = !!opts.danger;
  const title       = opts.title       || 'Confirmar';
  const message     = opts.message     || '¿Estás seguro?';
  const confirmText = opts.confirmText || (isDanger ? 'Eliminar' : 'Confirmar');
  const cancelText  = opts.cancelText  || 'Cancelar';
  const icon        = opts.icon        || (isDanger ? '⚠️' : '❓');

  return new Promise(resolve => {
    // Quitar cualquier confirm anterior
    document.getElementById('confirmModalRoot')?.remove();

    const div = document.createElement('div');
    div.id = 'confirmModalRoot';
    div.className = 'fixed inset-0 bg-slate-950/85 backdrop-blur-sm z-[6000] flex items-center justify-center p-4 anim-fadeIn';
    div.innerHTML = `
      <div class="bg-slate-900 border ${isDanger ? 'border-red-500/50' : 'border-slate-700'} rounded-2xl p-6 max-w-md w-full shadow-2xl ${isDanger ? 'shadow-red-500/20' : 'shadow-slate-900'} anim-scaleIn">
        <div class="text-center mb-5">
          <div class="text-5xl mb-3">${icon}</div>
          <h2 class="text-lg font-extrabold ${isDanger ? 'text-red-400' : 'text-slate-100'} mb-2">${escHtml(title)}</h2>
          <p class="text-slate-400 text-sm leading-relaxed">${escHtml(message)}</p>
        </div>
        <div class="grid grid-cols-2 gap-3">
          <button id="confirmCancel" class="border border-slate-700 text-slate-300 rounded-lg py-3 text-sm font-bold hover:bg-slate-800 active:bg-slate-700 transition">
            ${escHtml(cancelText)}
          </button>
          <button id="confirmOk" class="${isDanger ? 'bg-red-600 hover:bg-red-500 active:bg-red-700' : 'bg-blue-600 hover:bg-blue-500 active:bg-blue-700'} text-white rounded-lg py-3 text-sm font-extrabold transition shadow-lg ${isDanger ? 'shadow-red-500/30' : 'shadow-blue-500/30'}">
            ${escHtml(confirmText)}
          </button>
        </div>
      </div>
    `;
    document.body.appendChild(div);

    const close = (result) => {
      div.classList.remove('anim-fadeIn');
      div.classList.add('anim-fadeOut');
      setTimeout(() => { div.remove(); resolve(result); }, 200);
    };

    document.getElementById('confirmOk').onclick     = () => close(true);
    document.getElementById('confirmCancel').onclick = () => close(false);
    div.onclick = (e) => { if (e.target === div) close(false); };
    setTimeout(() => document.getElementById('confirmCancel')?.focus(), 50);
  });
}

// Helper para input uppercase que PRESERVA la posición del cursor
function onUpperInput(el, callback) {
  const start = el.selectionStart;
  const end   = el.selectionEnd;
  const upper = el.value.toUpperCase();
  if (upper !== el.value) {
    el.value = upper;
    try { el.setSelectionRange(start, end); } catch(e) {}
  }
  callback(upper);
}

// Escape para evitar XSS al renderizar texto en HTML
function escHtml(s) {
  if (s === null || s === undefined) return '';
  return String(s)
    .replace(/&/g, '&amp;')
    .replace(/</g, '&lt;')
    .replace(/>/g, '&gt;')
    .replace(/"/g, '&quot;')
    .replace(/'/g, '&#39;');
}

// Escape para usar dentro de atributos HTML con comilla simple
function escAttr(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/[&<>"']/g, c => ({
    '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'\\\''
  })[c]);
}

// Parsea un número manejando formatos LATAM (12,500.00) y NaN
function parseMoney(v) {
  if (typeof v === 'number') return isNaN(v) ? 0 : v;
  if (!v) return 0;
  // Quita espacios y separadores de miles
  const cleaned = String(v).replace(/\s/g, '').replace(/,/g, '');
  const n = parseFloat(cleaned);
  return isNaN(n) ? 0 : n;
}

// Defensa contra NaN en formato
function safeNum(v, fallback = 0) {
  const n = parseFloat(v);
  return isNaN(n) ? fallback : n;
}

// TIMEOUT wrapper para google.script.run
function gsCallWithTimeout(fnName, payload, opts = {}) {
  const timeoutMs = opts.timeout || 30000;
  return new Promise((resolve, reject) => {
    if (typeof google === "undefined" || !google.script || !google.script.run) {
      return reject(new Error('Backend no disponible'));
    }
    let done = false;
    const timer = setTimeout(() => {
      if (done) return;
      done = true;
      reject(new Error('Timeout ' + (timeoutMs/1000) + 's · servidor no responde'));
    }, timeoutMs);
    const runner = google.script.run
      .withSuccessHandler(r => { if (done) return; done = true; clearTimeout(timer); resolve(r); })
      .withFailureHandler(e => { if (done) return; done = true; clearTimeout(timer); reject(e); });
    if (payload === undefined) runner[fnName](); else runner[fnName](payload);
  });
}

function scoreEstado(valor) {
  if(!valor) return null;
  const v = valor.toLowerCase();
  if(v.includes("original") || v.includes("conforme") || v.includes("operativo") || v.includes("excelente")) return 10;
  if(v.includes("repintado") || v.includes("desgaste normal") || v.includes("leve")) return 7;
  if(v.includes("desgaste") || v.includes("mantenimiento")) return 5;
  if(v.includes("requiere") || v.includes("roto") || v.includes("retapizar")) return 4;
  if(v.includes("crítica") || v.includes("critica")) return 1;
  return null;
}

function emojiPorScore(score) {
  if(score === null) return "⚪ Sin evaluar";
  if(score >= 8.5) return "🟢 Conforme";
  if(score >= 5) return "🟡 Atención";
  return "🔴 Crítico";
}

function calcularScoreSeccion(seccionId) {
  const sec = INSPECCION_SECCIONES.find(s => s.id === seccionId);
  if(!sec) return { score: null, resumen: "⚪ Sin evaluar", evaluados: 0, totales: 0 };

  let suma = 0;
  let count = 0;
  sec.campos.forEach(c => {
    if(["estructural","mecanico","operativo","estetica"].includes(c.t)) {
      const s = scoreEstado(inspeccionData[c.k]);
      if(s !== null) {
        suma += s;
        count++;
      }
    }
  });
  if(count === 0) return { score: null, resumen: "⚪ Sin evaluar", evaluados: 0, totales: sec.campos.filter(c=>["estructural","mecanico","operativo","estetica"].includes(c.t)).length };
  const promedio = suma / count;
  return {
    score: Math.round(promedio * 10) / 10,
    resumen: emojiPorScore(promedio),
    evaluados: count,
    totales: sec.campos.filter(c=>["estructural","mecanico","operativo","estetica"].includes(c.t)).length
  };
}

function calcularScoreGlobal() {
  const carroceria = calcularScoreSeccion("s2");
  const motor = calcularScoreSeccion("s3");
  const tren = calcularScoreSeccion("s4");
  const electronica = calcularScoreSeccion("s5");

  const scores = [
    { val: motor.score, peso: 0.35 },
    { val: tren.score, peso: 0.25 },
    { val: carroceria.score, peso: 0.25 },
    { val: electronica.score, peso: 0.15 }
  ].filter(s => s.val !== null);

  if(scores.length === 0) return null;
  const pesoTotal = scores.reduce((s, x) => s + x.peso, 0);
  const promedio = scores.reduce((s, x) => s + (x.val * x.peso), 0) / pesoTotal;
  return Math.round(promedio * 10);
}

function guardarInspeccion() {
  const faltantes = [];
  INSPECCION_SECCIONES.forEach(sec => {
    sec.campos.forEach(c => {
      if(c.req && (!inspeccionData[c.k] || String(inspeccionData[c.k]).trim() === "")) {
        faltantes.push(c.l);
      }
    });
  });
  if(faltantes.length > 0) {
    toast("⚠️ Faltan campos obligatorios: " + faltantes.join(", "), "error");
    return;
  }

  // Aviso si inspección está muy incompleta (<50%)
  const _totalCampos = INSPECCION_SECCIONES.reduce((s,sec)=>s+sec.campos.length, 0);
  const _llenados = INSPECCION_SECCIONES.reduce((s,sec) => s + sec.campos.filter(c=>inspeccionData[c.k]&&String(inspeccionData[c.k]).trim()!=="").length, 0);
  const _porcentaje = Math.round((_llenados/_totalCampos)*100);
  if (_porcentaje < 50) {
    confirmAccion({
      title: 'Inspección incompleta',
      message: `Solo has llenado ${_porcentaje}% de los campos (${_llenados}/${_totalCampos}). ¿Generar el PDF de todos modos? El informe se verá con muchos espacios "—".`,
      confirmText: 'Generar igual',
      icon: '📋'
    }).then(ok => { if (ok) _doGuardarInspeccion(); });
    return;
  }
  _doGuardarInspeccion();
}

function exitoInspeccion(result) {
  showInspLoader(false);
  const btn = document.getElementById("btnGuardarInsp");
  if(btn) { btn.disabled = false; btn.innerHTML = "💾 Guardar Inspección y Generar PDF"; }

  const esError = typeof result === "string" && result.toLowerCase().includes("error");

  if(esError) {
    toast("⚠️ " + result, "error");
    return;
  }

  toast(typeof result === "string" ? result : "✅ Inspección guardada", "success");

  modal("✅ Informe Generado", `
    <div class="text-center py-4">
      <div class="text-5xl mb-3">📄</div>

    </div>
  `);
}

function showInspLoader(show) {
  let el = document.getElementById("inspLoader");
  if(show) {
    if(!el) {
      el = document.createElement("div");
      el.id = "inspLoader";
      el.className = "fixed inset-0 bg-slate-950/90 z-[1500] flex flex-col items-center justify-center";
      el.innerHTML = `
        <div class="spinner mb-5"></div>
        <div class="text-sky-400 font-bold text-lg">Generando Informe PDF...</div>

      `;
      document.body.appendChild(el);
    }
  } else {

  }
}

// Auto: si llenas precio_venta o fecha_venta, marca Estado = "Vendido"
function onVentaInput() {
  const form = document.getElementById("vehForm");
  if (!form) return;
  const precio = parseFloat(form.querySelector('[data-k="precioVenta"]')?.value) || 0;
  const fecha  = form.querySelector('[data-k="fechaVenta"]')?.value || '';
  const estadoSel = form.querySelector('[data-k="estado"]');
  if (!estadoSel) return;
  if (precio > 0 || (fecha && fecha.trim() !== '')) {
    if (estadoSel.value !== 'Vendido') {
      estadoSel.value = 'Vendido';
      estadoSel.style.boxShadow = '0 0 0 2px rgba(34,197,94,.5)';
      setTimeout(() => estadoSel.style.boxShadow = '', 1500);
    }
  }
}

function saveVeh(id) {
  const form = document.getElementById("vehForm");
  const data = id ? {...vehs.find(x=>String(x.id)===String(id))} : {...EMPTY_VEH};
  form.querySelectorAll("[data-k]").forEach(el=>{
    const k = el.dataset.k;
    let v = el.value;
    if(el.type === "number") v = parseFloat(v)||0;
    data[k] = v;
  });
  if(id) data.id = id;

  const formData = vehToBackend(data);

  const btn = document.getElementById("btnSaveVeh");
  if(btn) { btn.disabled = true; btn.textContent = "Guardando..."; }

  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler((res)=>{
        if (res && res.exito === false) {
          if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
          errorGuardar({ message: res.error || 'El servidor no pudo guardar el vehículo.' });
          return;
        }
        closeModal(); recargarApp();
      })
      .withFailureHandler(err=>{
        if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
        errorGuardar(err);
      })
      .guardarVehiculo(formData);
  } else {
    if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
    toast("⚠️ Modo preview: google.script.run no disponible", "error");
  }
}

// Wrapper promesa sobre google.script.run (funciona con el shim y en Apps Script)
function gsCall(fn, arg) {
  return new Promise((resolve, reject) => {
    google.script.run.withSuccessHandler(resolve).withFailureHandler(reject)[fn](arg || {});
  });
}

let __fotosRef = {};   // clave → File seleccionado

function fotoSeleccionada(input, clave) {
  const file = input.files && input.files[0];
  if (!file) return;
  const esPdf = file.type === "application/pdf";
  if (esPdf && file.size > 8 * 1024 * 1024) {
    toast("⚠️ El PDF pesa más de 8 MB. Usa uno más liviano.", "error");
    input.value = "";
    return;
  }
  __fotosRef[clave] = file;
  const prev = document.getElementById("prev-" + clave);
  const ico  = document.getElementById("ico-" + clave);
  const slot = document.getElementById("slot-" + clave);
  if (esPdf) {
    if (ico) { ico.textContent = "📄"; ico.classList.remove("hidden"); }
    if (prev) prev.classList.add("hidden");
  } else {
    if (prev) { prev.src = URL.createObjectURL(file); prev.classList.remove("hidden"); }
    if (ico)  ico.classList.add("hidden");
  }
  if (slot) slot.style.border = "1px solid rgba(16,185,129,.6)";
}

// Lee un archivo tal cual (para PDFs — sin compresión) y devuelve solo el base64
function leerArchivoBase64(file) {
  return new Promise((resolve, reject) => {
    const fr = new FileReader();
    fr.onload = () => resolve(String(fr.result).split(",")[1]);
    fr.onerror = () => reject(new Error("No se pudo leer el archivo"));
    fr.readAsDataURL(file);
  });
}

// Reduce la foto (max 1280px, JPEG 72%) y devuelve solo el base64
function comprimirFoto(file, maxDim = 1280, calidad = 0.72) {
  return new Promise((resolve, reject) => {
    const img = new Image();
    const url = URL.createObjectURL(file);
    img.onload = () => {
      const esc = Math.min(1, maxDim / Math.max(img.width, img.height));
      const w = Math.max(1, Math.round(img.width * esc)), h = Math.max(1, Math.round(img.height * esc));
      const cv = document.createElement("canvas"); cv.width = w; cv.height = h;
      cv.getContext("2d").drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      resolve(cv.toDataURL("image/jpeg", calidad).split(",")[1]);
    };
    img.onerror = () => { URL.revokeObjectURL(url); reject(new Error("No se pudo leer la foto")); };
    img.src = url;
  });
}

// Fotos del referido → miniaturas etiquetadas ("Etiqueta|URL" por línea).
// Acepta también URLs sueltas (formato antiguo) como botones.
function fotosLinksHTML(str) {
  const items = [];
  String(str || "").split(/\n+/).map(s => s.trim()).filter(Boolean).forEach(l => {
    const p = l.split("|");
    if (p.length === 2 && /^https?:\/\//i.test(p[1])) items.push({ et: p[0], url: p[1] });
    else l.split(/[\s,]+/).forEach(u => { if (/^https?:\/\//i.test(u)) items.push({ et: "Foto " + (items.length + 1), url: u }); });
  });
  if (!items.length) return "";
  return `<div class="flex flex-wrap gap-2 mt-2">` + items.map(it => {
    const esPdf = /\/file\/d\//.test(it.url) || /\.pdf($|\?)/i.test(it.url);
    const visual = esPdf
      ? `<span class="w-16 h-16 flex items-center justify-center rounded-lg text-2xl" style="border:1px solid #334155;background:rgba(239,68,68,.08)">📄</span>`
      : `<img src="${escAttr(it.url)}" loading="lazy" class="w-16 h-16 object-cover rounded-lg" style="border:1px solid #334155"
             onerror="this.outerHTML='<span class=&quot;text-lg&quot;>📷</span>'">`;
    return `
    <a href="${escAttr(it.url)}" target="_blank" rel="noopener" class="block text-center" title="${escAttr(it.et)}">
      ${visual}
      <div class="text-[9px] text-slate-500 mt-0.5 max-w-[64px] leading-tight mx-auto">${escAttr(it.et)}${esPdf ? " (PDF)" : ""}</div>
    </a>`;
  }).join("") + `</div>`;
}

async function enviarReferido(form) {
  const data = {};
  new FormData(form).forEach((v, k) => data[k] = v);

  // Las 6 fotos son obligatorias para el asesor (el backend también lo valida)
  const faltan = FOTOS_REF.filter(f => !__fotosRef[f[0]]);
  if (usuarioActual?.rol === "asesor" && faltan.length) {
    toast("⚠️ Faltan fotos: " + faltan.map(f => f[1]).join(", "), "error");
    return;
  }

  const btn = form.querySelector('button[type="submit"]');
  const restaurar = () => { if (btn) { btn.disabled = false; btn.textContent = "📤 Enviar al tasador"; } };
  if (btn) btn.disabled = true;

  try {
    // Comprimir y adjuntar las fotos seleccionadas
    const seleccionadas = FOTOS_REF.filter(f => __fotosRef[f[0]]);
    if (seleccionadas.length) {
      data.Fotos = [];
      for (let i = 0; i < seleccionadas.length; i++) {
        if (btn) btn.textContent = `📷 Procesando ${i + 1}/${seleccionadas.length}…`;
        const file = __fotosRef[seleccionadas[i][0]];
        if (file.type === "application/pdf") {
          // PDF (ej. tarjeta de propiedad electrónica): se sube tal cual
          const b64 = await leerArchivoBase64(file);
          data.Fotos.push({ etiqueta: seleccionadas[i][1], base64: b64, mime: "application/pdf" });
        } else {
          const b64 = await comprimirFoto(file);
          data.Fotos.push({ etiqueta: seleccionadas[i][1], base64: b64, mime: "image/jpeg" });
        }
      }
    }
    if (btn) btn.textContent = "📤 Enviando…";
    const r = await gsCall("registrarReferido", data);
    if (r && r.exito) { toast(r.mensaje || "✅ Registrado"); closeModal(); initRed(); }
    else { restaurar(); toast("⚠️ " + ((r && r.error) || "No se pudo registrar"), "error"); }
  } catch (e) {
    restaurar();
    toast("⚠️ " + (e.message || e), "error");
  }
}

          <div class="text-2xl font-black" style="color:${c}">${v}</div><div class="text-[10px] text-slate-500 uppercase tracking-wider mt-1">${l}</div></div>`).join("")}
    </div>`;
  const chip = (v, label) => `<button onclick="redVista='${v}';pintarRed()"
      class="text-xs font-bold px-3 py-1.5 rounded-lg ${redVista === v ? "text-white" : "text-slate-400 hover:text-slate-200"}"
      style="${redVista === v ? "background:rgba(56,189,248,.2);border:1px solid rgba(56,189,248,.5)" : "border:1px solid var(--c-border)"}">${label}</button>`;
  const barra = `
    <div class="flex items-center gap-2 mb-4 flex-wrap">
      ${chip("activos", "🟢 Activos (" + nAct + ")")}
      ${chip("historial", "📚 Historial (" + nHist + ")")}
      <input id="redBuscarInput" placeholder="🔍 Marca, modelo, placa, concesionario…" value="${escAttr(redBusqueda)}"
             oninput="redBusqueda=this.value;_redFiltrarLive()" class="flex-1 min-w-[200px] text-sm">
    </div>`;
  return kpis + barra + `<div id="redTabla">${_redTablaHTML(_redListaFiltrada())}</div>`;
}

function _redTablaHTML(lista) {

  }
  const filas = lista.map(r => `
    <tr class="border-b border-slate-800/60 hover:bg-white/[.015] cursor-pointer" onclick="abrirDetalleReferido('${escAttr(r.id)}')">
      <td class="py-2.5 px-3 text-slate-500 text-xs whitespace-nowrap">${escAttr(r.fecha)}</td>
      <td class="py-2.5 pr-3 text-xs">${escAttr(r.concesionario || "—")}<div class="text-[10px] text-slate-500">${escAttr(r.asesorNombre || "")}</div></td>
      <td class="py-2.5 pr-3"><div class="font-semibold text-slate-200 text-[13px]">${escAttr(redVehTitulo(r))}</div>
        <div class="text-[11px] text-slate-500">${escAttr(r.placa || "s/placa")} · ${r.km ? Number(r.km).toLocaleString("en-US") + " km" : "km s/d"}</div></td>
      <td class="py-2.5 pr-3 text-xs text-slate-300">${escAttr(r.clienteNombre || "")}</td>
      <td class="py-2.5 pr-3">${redChip(r.estado)}</td>
      <td class="py-2.5 pr-3 text-center text-xs">${esHist
        ? `${r.precioAprobado ? `Aprob: <b class="text-emerald-400">${money(r.precioAprobado)}</b>${r.revendedorAprobadoNombre ? `<div class="text-[10px] text-slate-500">${escAttr(r.revendedorAprobadoNombre)}</div>` : ""}` : '<span class="text-slate-600">—</span>'}
           ${r.precioFinal ? `<div>Final: <b class="text-sky-400">${money(r.precioFinal)}</b></div>` : ""}`
        : (r.numPropuestas ? `<b class="text-slate-200">${r.numPropuestas}</b> · max <b class="text-emerald-400">${money(r.mejorMonto)}</b>` : '<span class="text-slate-600">—</span>')}</td>
      <td class="py-2.5 pr-3 text-right" onclick="event.stopPropagation()">
        ${r.estado === "Nuevo" ? `<button onclick="derivarUI('${escAttr(r.id)}')" class="bg-amber-600/90 hover:bg-amber-500 text-white rounded px-2.5 py-1 text-[11px] font-bold">📢 Derivar</button>` : ""}
        <button onclick="abrirDetalleReferido('${escAttr(r.id)}')" class="border border-slate-700 text-slate-300 hover:text-white rounded px-2.5 py-1 text-[11px] font-semibold">${esHist ? "Ver" : "Gestionar"}</button>
      </td>

  return `
    <div class="rounded-xl overflow-x-auto" style="background:var(--c-surface);border:1px solid var(--c-border);">
      <table class="min-w-[860px]">
        <thead><tr class="text-left text-[11px] uppercase tracking-wider text-slate-500 border-b border-slate-800">
          <th class="py-2.5 px-3">Fecha</th><th class="py-2.5 pr-3">Origen</th><th class="py-2.5 pr-3">Vehículo</th>
          <th class="py-2.5 pr-3">Cliente</th><th class="py-2.5 pr-3">Estado</th><th class="py-2.5 pr-3 text-center">${esHist ? "Precios referenciales" : "Propuestas"}</th><th class="py-2.5 pr-3 text-right">Acciones</th>
        </tr></thead>
        <tbody>${filas}</tbody>
      </table>
    </div>`;
}

      <div><span class="text-slate-500">Color:</span> ${escAttr(r.color || "—")}</div>

    <div class="mb-4"></div>

function cargarPropuestasDetalle(refId, estadoRef) {
  gsCall("listarPropuestas", { referidoId: refId })
    .then(res => {
      const el = document.getElementById("detPropuestas");
      if (!el) return;
      if (!res || res.exito === false) { el.innerHTML = `⚠️ ${escAttr((res && res.error) || "Error")}`; return; }
      const props = res.propuestas || [];
      if (!props.length) { el.innerHTML = `<span class="text-slate-600">Sin propuestas todavía${estadoRef === "Nuevo" ? " — deriva el vehículo para recibirlas" : ""}.</span>`; return; }
      el.innerHTML = props.map((p, i) => `
        <div class="flex items-center justify-between gap-2 py-1.5 ${i > 0 ? "border-t border-slate-800/60" : ""}">
          <div><b class="text-slate-200">${escAttr(p.revendedorNombre)}</b>
            <span class="text-slate-500 ml-1">${escAttr(p.fecha)}</span>
            ${p.comentario ? `<div class="text-[10px] text-slate-500">${escAttr(p.comentario)}</div>` : ""}</div>
          <div class="flex items-center gap-2 whitespace-nowrap">
            <b class="${i === 0 ? "text-emerald-400" : "text-slate-300"}">${money(p.monto)}</b>
            ${p.estado === "Aprobada" ? `<span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="${RED_CHIP["Comprado"]}">✅ Aprobada</span>`
              : p.estado === "Descartada" ? `<span class="text-[10px] px-2 py-0.5 rounded-full text-slate-500" style="border:1px solid #334155">Descartada</span>`
              : `<button onclick="aprobarUI('${escAttr(p.id)}','${escAttr(p.revendedorNombre)}',${p.monto},'${escAttr(refId)}')" class="bg-emerald-600 hover:bg-emerald-500 text-white rounded px-2.5 py-1 text-[11px] font-bold">✔ Aprobar</button>`}
          </div>
        </div>`).join("");
    })
    .catch(e => { const el = document.getElementById("detPropuestas"); if (el) el.innerHTML = `⚠️ ${escAttr(e.message || e)}`; });
}

function aprobarUI(propId, revNombre, monto, refId) {
  confirmAccion({
    title: "Aprobar propuesta",
    message: `Aprobar la propuesta de ${revNombre} por ${money(monto)}. Se le notificará que es el precio de trabajo (sujeto a inspección en taller) y las demás propuestas quedarán descartadas. ¿Confirmar?`,
    confirmText: "✔ Aprobar", icon: "✅"
  }).then(ok => {
    if (!ok) return;
    gsCall("aprobarPropuesta", { propuestaId: propId })
      .then(r => {
        if (r && r.exito) { toast(r.mensaje); closeModal(); initRed(); }
        else toast("⚠️ " + ((r && r.error) || "Error"), "error");
      })
      .catch(e => toast("⚠️ " + (e.message || e), "error"));
  });
}

function guardarDetalleReferido(refId) {
  const data = {
    id: refId,
    estado: document.getElementById("detEstado")?.value,
    precioCalculadora: document.getElementById("detPrecioCalc")?.value,
    precioFinal: document.getElementById("detPrecioFinal")?.value,
    notasTasador: document.getElementById("detNotas")?.value
  };
  gsCall("actualizarReferido", data)
    .then(r => {
      if (r && r.exito) { toast(r.mensaje || "✅ Guardado"); closeModal(); initRed(); }
      else toast("⚠️ " + ((r && r.error) || "Error al guardar"), "error");
    })
    .catch(e => toast("⚠️ " + (e.message || e), "error"));
}

// ───── FASE 4 · Precio de mercado (NeoAuto) ─────

// Botón del formulario del asesor: lee marca/modelo/año/km del propio form
function consultarMercadoDesdeForm(btn) {
  const form = btn.closest("form");
  if (!form) return;
  const marca  = form.querySelector('[name="Marca"]')?.value || "";
  const modelo = form.querySelector('[name="Modelo"]')?.value || "";
  const anio   = Number(form.querySelector('[name="Anio"]')?.value) || 0;
  const km     = Number(form.querySelector('[name="KM"]')?.value) || 0;
  if (!marca || !modelo || !anio) {
    toast("⚠️ Completa marca, modelo y año antes de consultar", "error");
    return;
  }
  consultarMercadoUI(btn, marca, modelo, anio, km, "mercadoResForm");
}

// Consulta al backend y pinta la tarjeta en el contenedor indicado
function consultarMercadoUI(btn, marca, modelo, anio, km, targetId) {
  const el = document.getElementById(targetId);
  if (!el) return;
  const txtOriginal = btn ? btn.textContent : "";
  if (btn) { btn.disabled = true; btn.textContent = "🔍 Consultando…"; }
  el.innerHTML = `<div class="spinner mx-auto my-3" style="width:20px;height:20px;"></div>`;
  gsCall("consultarMercado", { marca, modelo, anio, km })
    .then(r => { el.innerHTML = _mercadoCardHTML(r, km); })
    .catch(e => { el.innerHTML = `<div class="text-[11px] mt-1" style="color:#f87171">⚠️ ${escAttr(e.message || e)}</div>`; })
    .finally(() => { if (btn) { btn.disabled = false; btn.textContent = txtOriginal; } });
}

// Tarjeta de resultados (compacta, funciona bien en móvil)
function _mercadoCardHTML(r, kmConsultado) {
  if (!r) return `<div class="text-[11px]" style="color:#f87171">⚠️ Sin respuesta del servidor</div>`;
  if (r.exito === false) return `<div class="text-[11px]" style="color:#f87171">⚠️ ${escAttr(r.error || "Error")}</div>`;
  if (r.sin_datos) return `<div class="text-[11px] text-slate-400 mt-1">ℹ️ ${escAttr(r.mensaje || "Sin datos de mercado para este vehículo.")}</div>`;

  const compsHTML = (r.comparables || []).map(c => `
    <a href="${escAttr(c.url)}" target="_blank" rel="noopener"
       class="flex justify-between gap-2 text-[11px] py-1 border-b border-slate-800/40 text-slate-300 hover:text-violet-300">
      <span class="text-slate-500">${c.anio}${c.km ? " · " + Number(c.km).toLocaleString("en-US") + " km" : ""}</span>
      <span class="font-bold whitespace-nowrap">${money(c.precio)} ↗</span>
    </a>`).join("");

  return `
    <div class="mt-2 text-[11px]">
      <div class="grid grid-cols-3 gap-1 text-center mb-2">
        <div class="rounded-lg py-1.5" style="background:rgba(255,255,255,.03)">
          <div class="text-slate-500 text-[10px]">Mínimo</div>
          <div class="font-bold text-slate-300">${money(r.minimo)}</div>
        </div>
        <div class="rounded-lg py-1.5" style="background:rgba(139,92,246,.12);border:1px solid rgba(139,92,246,.3)">
          <div class="text-[10px]" style="color:#a78bfa">Mediana</div>
          <div class="font-bold" style="color:#c4b5fd">${money(r.mediana)}</div>
        </div>
        <div class="rounded-lg py-1.5" style="background:rgba(255,255,255,.03)">
          <div class="text-slate-500 text-[10px]">Máximo</div>
          <div class="font-bold text-slate-300">${money(r.maximo)}</div>
        </div>
      </div>
      <div class="rounded-lg p-2 mb-2 flex items-center justify-between" style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.3)">
        <span style="color:#34d399">💡 Precio sugerido${kmConsultado > 0 && r.km_promedio > 0 ? " (ajustado por km)" : ""}</span>
        <b class="text-sm" style="color:#34d399">${money(r.precio_sugerido)}</b>
      </div>
      <div class="flex flex-wrap gap-x-3 gap-y-0.5 text-[10px] text-slate-500 mb-1.5">
        <span>📊 ${r.cantidad} anuncio(s) comparable(s)</span>
        ${r.rango_ampliado ? `<span style="color:#fbbf24">⚠️ rango ampliado a ±2 años</span>` : ""}
        ${r.km_promedio ? `<span>km prom. del grupo: ${Number(r.km_promedio).toLocaleString("en-US")}</span>` : ""}
        ${r.antiguedad_datos ? `<span>datos al ${escAttr(r.antiguedad_datos)}</span>` : ""}
      </div>
      ${compsHTML ? `<div class="text-[10px] text-slate-500 mb-0.5">Anuncios más comparables (NeoAuto):</div>${compsHTML}` : ""}
      <p class="text-[9px] text-slate-600 mt-1.5">Referencial: precios de venta publicados (no de compra). Fuente: anuncios públicos de NeoAuto.</p>
    </div>`;
}

// Propone un nombre de usuario a partir del nombre completo ("Juan Pérez" →
// "juan.perez"). Solo mientras el admin no lo haya escrito a mano.
function sugerirUsuario(inputNombre) {
  const form = inputNombre.closest("form");
  const campo = form?.querySelector('[name="usuario"]');
  if (!campo || campo.dataset.editado === "1") return;
  campo.value = (inputNombre.value || "").toLowerCase().trim()
    .normalize("NFD").replace(/[̀-ͯ]/g, "")   // quita tildes
    .replace(/[^a-z0-9]+/g, ".").replace(/^\.|\.$/g, "");
  if (!campo._listo) {   // si el admin lo toca, dejamos de sobrescribirlo
    campo.addEventListener("input", () => { campo.dataset.editado = "1"; });
    campo._listo = true;
  }
}

// Muestra la contraseña temporal con botón de copiar (se ve UNA sola vez)

  const el = document.getElementById("avisoPassword");
  if (!el) return;

    <div class="rounded-lg p-3 mb-3" style="background:rgba(16,185,129,.08);border:1px solid rgba(16,185,129,.35)">
      <div class="text-[11px] mb-1.5" style="color:#6ee7b7">
        ✅ Usuario <b>${escAttr(usuario)}</b> listo. Pásale estos datos por WhatsApp:
      </div>
      <div class="flex items-center gap-2 flex-wrap">
        <code class="text-sm font-bold px-2 py-1 rounded" style="background:rgba(0,0,0,.35);color:#a7f3d0">${escAttr(password)}</code>
        <button onclick="copiarTexto('Usuario: ${escAttr(usuario)}\\nContraseña: ${escAttr(password)}')"
          class="text-[11px] font-bold rounded px-2.5 py-1 text-emerald-400 border border-emerald-900/60 hover:bg-emerald-950/40">📋 Copiar</button>

function copiarTexto(txt) {
  navigator.clipboard?.writeText(txt)
    .then(() => toast("📋 Copiado"))
    .catch(() => toast("⚠️ No se pudo copiar, anótala a mano", "error"));
}

function cargarUsuariosRed() {
  gsCall("listarUsuariosRed")
    .then(r => {
      const el = document.getElementById("usuariosLista");
      if (!el) return;
      if (!r || r.exito === false) { el.innerHTML = `⚠️ ${escAttr((r && r.error) || "Error")}`; return; }
      el.innerHTML = (r.usuarios || []).map(u => `
        <div class="flex items-center justify-between gap-2 py-1.5 border-b border-slate-800/60 flex-wrap">
          <div class="min-w-0">
            <b style="color:${escAttr(u.color || "#e2e8f0")}">${ICONO_ROL[u.rol] || "👤"} ${escAttr(u.nombre)}</b>
            ${u.bloqueado ? `<span class="text-[10px] font-bold px-1.5 py-0.5 rounded ml-1" style="background:rgba(248,113,113,.15);color:#fca5a5">🔒 BLOQUEADO</span>` : ""}
            ${!u.tienePassword ? `<span class="text-[10px] px-1.5 py-0.5 rounded ml-1" style="background:rgba(251,191,36,.12);color:#fcd34d">sin contraseña</span>` : ""}
            <div class="text-slate-500 text-[11px]">
              ${u.usuario ? `<span class="text-slate-400">${escAttr(u.usuario)}</span> · ` : ""}${escAttr(u.rol)}${u.concesionario ? " · " + escAttr(u.concesionario) : ""}${u.email ? " · " + escAttr(u.email) : ""}
            </div>
          </div>
          <div class="flex gap-1.5 shrink-0">
            ${u.usuario ? `<button onclick="resetearPasswordUI('${escAttr(u.usuario)}','${escAttr(u.nombre)}')"
              class="text-[11px] font-bold rounded px-2.5 py-1 text-sky-400 border border-sky-900/60 hover:bg-sky-950/40"
              title="${u.bloqueado ? "Genera una contraseña nueva y desbloquea la cuenta" : "Genera una contraseña nueva"}">🔑 ${u.bloqueado ? "Desbloquear" : "Resetear"}</button>` : ""}
            <button onclick="toggleUsuarioUI('${escAttr(u.id)}',${u.activo ? "false" : "true"})"
              class="text-[11px] font-bold rounded px-2.5 py-1 ${u.activo ? "text-red-400 border border-red-900/60 hover:bg-red-950/40" : "text-emerald-400 border border-emerald-900/60 hover:bg-emerald-950/40"}">
              ${u.activo ? "Desactivar" : "Activar"}</button>
          </div>
        </div>`).join("") || '<span class="text-slate-600">Sin usuarios.</span>';
    })
    .catch(e => { const el = document.getElementById("usuariosLista"); if (el) el.innerHTML = `⚠️ ${escAttr(e.message || e)}`; });
}

function crearUsuarioUI(form) {
  const data = {};
  new FormData(form).forEach((v, k) => data[k] = v);
  data.usuario = String(data.usuario || "").toLowerCase().trim();

  const btn = form.querySelector('button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "Creando…"; }
  const restaurar = () => { if (btn) { btn.disabled = false; btn.textContent = "Crear usuario"; } };

  gsCall("crearUsuarioApp", data)
    .then(r => {
      restaurar();
      if (r && r.exito) {
        toast("✅ Usuario creado");
        mostrarPasswordTemporal(r.usuario, r.passwordTemporal);
        form.reset();
        const campo = form.querySelector('[name="usuario"]');
        if (campo) delete campo.dataset.editado;   // vuelve a sugerir en el siguiente
        cargarUsuariosRed();
      } else toast("⚠️ " + ((r && r.error) || "Error"), "error");
    })
    .catch(e => { restaurar(); toast("⚠️ " + (e.message || e), "error"); });
}

function resetearPasswordUI(usuario, nombre) {
  confirmAccion({
    title: "Resetear contraseña",
    message: `Se generará una contraseña nueva para ${nombre} (${usuario}) y se desbloqueará su cuenta si estaba bloqueada. La contraseña anterior dejará de funcionar. ¿Continuar?`,
    confirmText: "🔑 Generar nueva", icon: "🔑"
  }).then(ok => {
    if (!ok) return;
    gsCall("resetearPasswordApp", { usuario: usuario })
      .then(r => {
        if (r && r.exito) {
          toast("✅ Contraseña reseteada");
          mostrarPasswordTemporal(r.usuario, r.passwordTemporal);
          cargarUsuariosRed();
        } else toast("⚠️ " + ((r && r.error) || "Error"), "error");
      })
      .catch(e => toast("⚠️ " + (e.message || e), "error"));
  });
}

function toggleUsuarioUI(id, activo) {
  gsCall("desactivarUsuario", { id, activo })
    .then(r => {
      if (r && r.exito) { toast(r.mensaje); cargarUsuariosRed(); }
      else toast("⚠️ " + ((r && r.error) || "Error"), "error");
    })
    .catch(e => toast("⚠️ " + (e.message || e), "error"));
}

// ───── NOTIFICACIONES · campana con polling ─────
let notifTimer = null;
let notifCache = [];

function iniciarNotifPolling() {
  detenerNotifPolling();
  cargarNotificaciones();
  notifTimer = setInterval(cargarNotificaciones, 60000);
}
function detenerNotifPolling() {
  if (notifTimer) { clearInterval(notifTimer); notifTimer = null; }
  document.getElementById("notifPanel")?.classList.add("hidden");
}

function cargarNotificaciones() {
  if (!sessionToken) return;
  gsCall("misNotificaciones")
    .then(r => {
      if (!r || r.exito === false) return;
      notifCache = r.notificaciones || [];
      const badge = document.getElementById("notifBadge");
      if (badge) {
        badge.textContent = r.noLeidas > 99 ? "99+" : r.noLeidas;
        badge.classList.toggle("hidden", !r.noLeidas);
      }
      // si el panel está abierto, refrescarlo
      if (!document.getElementById("notifPanel")?.classList.contains("hidden")) renderNotifLista();
    })
    .catch(() => {}); // polling silencioso: no molestar con toasts
}

function toggleNotifPanel() {
  const panel = document.getElementById("notifPanel");
  if (!panel) return;
  panel.classList.toggle("hidden");
  if (!panel.classList.contains("hidden")) renderNotifLista();
}

function renderNotifLista() {
  const el = document.getElementById("notifLista");
  if (!el) return;
  if (!notifCache.length) { el.innerHTML = '<div class="px-3 py-6 text-center text-xs text-slate-600">Sin notificaciones.</div>'; return; }
  const iconos = { nuevo_referido: "🚘", vehiculo_en_consulta: "📢", nueva_propuesta: "💰", propuesta_aprobada: "🎉", tasacion_final: "📋" };
  el.innerHTML = notifCache.map(n => `
    <div onclick="clickNotif('${escAttr(n.id)}')" class="px-3 py-2.5 cursor-pointer hover:bg-white/[.03] ${n.leida ? "opacity-50" : ""}">
      <div class="flex gap-2 items-start">
        <span class="text-base leading-none mt-0.5">${iconos[n.tipo] || "🔔"}</span>
        <div class="min-w-0">
          <div class="text-[11.5px] text-slate-300 leading-snug">${escAttr(n.mensaje)}</div>
          <div class="text-[9.5px] text-slate-600 mt-0.5">${escAttr(n.fecha)} ${escAttr(n.hora)}</div>
        </div>
        ${!n.leida ? '<span class="ml-auto mt-1 w-2 h-2 rounded-full bg-sky-400 shrink-0"></span>' : ""}
      </div>
    </div>`).join("");
}

function clickNotif(id) {
  const n = notifCache.find(x => x.id === id);
  if (n && !n.leida) {
    n.leida = true;
    gsCall("marcarNotifLeida", { id }).then(cargarNotificaciones).catch(() => {});
  }
  document.getElementById("notifPanel")?.classList.add("hidden");
  if (tabPermitido("red")) { currentTab = "red"; render(); }
}

function marcarTodasLeidas() {
  gsCall("marcarNotifLeida", { todas: true }).then(() => cargarNotificaciones()).catch(() => {});
}

// Cerrar el panel de notificaciones al hacer click fuera
document.addEventListener("click", ev => {
  const panel = document.getElementById("notifPanel");
  if (!panel || panel.classList.contains("hidden")) return;
  if (!panel.contains(ev.target) && !document.getElementById("btnNotif")?.contains(ev.target)) {
    panel.classList.add("hidden");
  }
});

function initNomina() {
  Promise.all([
    gsCall("listarTrabajadores"),
    gsCall("listarPagosNomina", { periodo: nominaPeriodo }),
    gsCall("listarComprobantes")
  ]).then(([rt, rp, rc]) => {
    if (rt && rt.exito === false) {
      const el = document.getElementById("nominaContent");
      if (el) el.innerHTML = `<div class="text-center py-14 text-red-400 text-sm">⚠️ ${escAttr(rt.error || "Error")}</div>`;
      return;
    }
    nomTrabajadores = (rt && rt.trabajadores) || [];
    nomPagos = (rp && rp.pagos) || [];
    nomTotalNeto = (rp && rp.totalNeto) || 0;
    nomComprobantes = (rc && rc.comprobantes) || [];
    pintarNomina();
  }).catch(e => {
    const el = document.getElementById("nominaContent");
    if (el) el.innerHTML = `<div class="text-center py-14 text-red-400 text-sm">⚠️ ${escAttr(e.message || e)}</div>`;
  });
}

function cargarPagosPeriodo() {
  gsCall("listarPagosNomina", { periodo: nominaPeriodo })
    .then(rp => {
      nomPagos = (rp && rp.pagos) || [];
      nomTotalNeto = (rp && rp.totalNeto) || 0;
      pintarNomina();
    }).catch(() => {});
}

function pintarNomina() {
  const el = document.getElementById("nominaContent");
  if (!el) return;
  const activos = nomTrabajadores.filter(t => t.estado === "Activo");

  const filasTrab = nomTrabajadores.map(t => `
    <tr class="border-b border-slate-800/60">

      <td class="py-2 pr-3 text-right font-semibold text-slate-200">${soles(t.sueldoBase)}</td>
      <td class="py-2 pr-3 text-center"><span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="${t.estado === "Activo" ? RED_CHIP["Comprado"] : RED_CHIP["Rechazado"]}">${escAttr(t.estado)}</span></td>
      <td class="py-2 pr-3 text-right"><button onclick="abrirFormTrabajador('${escAttr(t.id)}')" class="text-slate-500 hover:text-slate-200 text-sm px-2">✏️</button></td>

      <td class="py-2 pr-3 text-right">${c.pdf ? `<a href="${escAttr(c.pdf)}" target="_blank" rel="noopener" class="text-sky-400 text-xs font-bold hover:underline">📄 PDF</a>` : ""}</td>

      ${nomPagos.length ? `<table class="min-w-[680px] mt-2">

          <th class="py-2 px-3">Trabajador</th><th class="py-2 pr-3 text-right">Base</th><th class="py-2 pr-3 text-right">Bonos/HE</th><th class="py-2 pr-3 text-right">Dsctos/Adel.</th><th class="py-2 pr-3 text-right">Neto</th><th class="py-2 pr-3">Pago</th>

// ────────────── INIT ──────────────
// NOTA: La autenticación va 100% por backend (verificarPin + token).
// El objeto USUARIOS hardcoded fue eliminado por seguridad — antes permitía
// bypass del login con PINs públicos visibles en este HTML.
let usuarioActual = null;

// ====================================================
// SESSION MANAGER — ID + idle timeout + auto-logout
// ====================================================
const SESSION_IDLE_MINUTES = 120;         // 2h — técnico hace inspección física desde el celular y vuelve
const SESSION_WARNING_SECONDS = 60;       // aviso ampliado a 60s para dar tiempo a responder
let sessionId = null;
let idleTimer = null;
let warningTimer = null;
let countdownInterval = null;
let sessionStartTime = null;

function generarSessionId() {
  const fecha = new Date();
  const yyyymmdd = fecha.getFullYear().toString().slice(2) +
                   String(fecha.getMonth()+1).padStart(2,'0') +
                   String(fecha.getDate()).padStart(2,'0');
  const random = Math.random().toString(36).substring(2, 7).toUpperCase();
  return `SES-${yyyymmdd}-${random}`;
}

let _sessionBadgeInterval = null;
function iniciarSession() {
  sessionId = generarSessionId();
  sessionStartTime = Date.now();
  // Eventos que resetean el timer de inactividad
  ['mousemove','keydown','touchstart','click','scroll'].forEach(ev =>
    document.addEventListener(ev, onUserActivity, { passive: true })
  );
  // Detectar cambio de tab/ventana oculta para no contar tiempo en background
  document.addEventListener('visibilitychange', onVisibilityChange);
  resetIdleTimer();
  // Limpia interval previo si existía (evita leaks en logout/login)
  if (_sessionBadgeInterval) clearInterval(_sessionBadgeInterval);
  _sessionBadgeInterval = setInterval(updateSessionBadge, 60000);
}

let _lastHiddenAt = null;
function onVisibilityChange() {
  if (!usuarioActual) return;
  if (document.hidden) {
    // Pausar timers cuando la tab se oculta
    _lastHiddenAt = Date.now();
    if (idleTimer) clearTimeout(idleTimer);
    if (warningTimer) clearTimeout(warningTimer);
  } else if (_lastHiddenAt) {
    // Al volver, verificar cuánto pasó
    const elapsedMs = Date.now() - _lastHiddenAt;
    const idleMs = SESSION_IDLE_MINUTES * 60 * 1000;
    _lastHiddenAt = null;
    if (elapsedMs >= idleMs) {
      autoCerrarSesion();
    } else {
      resetIdleTimer();
    }
  }
}

function onUserActivity() {
  // Si el modal de advertencia está visible, ciérralo
  const w = document.getElementById('idleWarning');
  if (w) {
    w.remove();
    if (countdownInterval) { clearInterval(countdownInterval); countdownInterval = null; }
  }
  resetIdleTimer();
}

function resetIdleTimer() {
  if (idleTimer) clearTimeout(idleTimer);
  if (warningTimer) clearTimeout(warningTimer);
  if (!usuarioActual) return;
  const idleMs = SESSION_IDLE_MINUTES * 60 * 1000;
  const warnMs = SESSION_WARNING_SECONDS * 1000;
  warningTimer = setTimeout(mostrarAvisoInactividad, idleMs - warnMs);
  idleTimer = setTimeout(autoCerrarSesion, idleMs);
}

function mostrarAvisoInactividad() {
  let segundos = SESSION_WARNING_SECONDS;
  const div = document.createElement('div');
  div.id = 'idleWarning';
  div.className = 'fixed inset-0 bg-slate-950/95 z-[5000] flex items-center justify-center p-4';
  div.innerHTML = `
    <div class="bg-slate-900 border-2 border-amber-500 rounded-2xl p-6 max-w-sm w-full text-center shadow-2xl shadow-amber-500/30">
      <div class="text-6xl mb-3">⏱</div>
      <h2 class="text-xl font-extrabold text-amber-400 mb-1">Sesión por cerrar</h2>
      <p class="text-slate-400 text-xs mb-4">Detectamos inactividad. Por seguridad cerraremos tu sesión en:</p>
      <div id="idleCountdown" class="text-6xl font-black text-amber-400 mb-4">${segundos}</div>
      <button onclick="onUserActivity()" class="w-full bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg py-3 text-sm font-bold">
        SEGUIR USANDO
      </button>
      <div class="text-slate-600 text-[10px] mt-3">Cualquier clic o tecla mantiene la sesión abierta</div>
    </div>
  `;
  document.body.appendChild(div);
  countdownInterval = setInterval(() => {
    segundos--;
    const el = document.getElementById('idleCountdown');
    if (el) el.textContent = segundos;
    if (segundos <= 0) clearInterval(countdownInterval);
  }, 1000);
}

function autoCerrarSesion() {
  const w = document.getElementById('idleWarning');
  if (w) w.remove();
  if (countdownInterval) clearInterval(countdownInterval);
  toast('🔒 Sesión cerrada por inactividad', 'error');
  setTimeout(() => cerrarSesionForzado(), 800);
}

function cerrarSesionForzado() {
  if (idleTimer) clearTimeout(idleTimer);
  if (warningTimer) clearTimeout(warningTimer);
  if (_sessionBadgeInterval) { clearInterval(_sessionBadgeInterval); _sessionBadgeInterval = null; }  // Fix memory leak
  if (typeof invalidarMemos === 'function') invalidarMemos();  // Cache no debe persistir entre sesiones

  // Fase 1 · Invalida el token en backend (fire and forget)
  if (sessionToken && typeof google !== "undefined" && google.script && google.script.run) {
    try { google.script.run.cerrarSesionBackend(sessionToken); } catch(e) {}
  }
  sessionToken = null;
  _guardarTokenLocal(null);   // que un F5 no reviva una sesión ya cerrada

  detenerNotifPolling();   // Fase 2: apagar campana
  usuarioActual = null;
  sessionId = null;
  sessionStartTime = null;
  vehs = []; clis = []; inspeccionData = {};
  document.getElementById("appWrapper").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("pinInput").value = "";
  const inpUser = document.getElementById("userInput");
  if (inpUser) inpUser.value = "";
  document.getElementById("loginError").classList.add("hidden");
  document.getElementById("userBadge")?.classList.add("hidden");
  document.getElementById("sessionBadge")?.classList.add("hidden");
  setTimeout(() => (inpUser || document.getElementById("pinInput"))?.focus(), 100);
}

function updateSessionBadge() {
  const badge = document.getElementById("sessionBadge");
  if (!badge || !sessionId || !sessionStartTime) return;
  const minutos = Math.floor((Date.now() - sessionStartTime) / 60000);
  badge.textContent = `🆔 ${sessionId} · ${minutos}m`;
}

// Fase 1 · Token de sesión del backend (vacío hasta autenticar)
let sessionToken = null;

function _completarLogin(usuario, token) {
  usuarioActual = usuario;
  sessionToken = token || null;
  _guardarTokenLocal(sessionToken);   // sobrevive al F5 mientras la pestaña siga abierta
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appWrapper").classList.remove("hidden");
  aplicarRBAC();
  iniciarSession();
  updateSessionBadge();
  iniciarNotifPolling();   // Fase 2: campana de notificaciones
  currentTab = usuario.tabInicial || "red";
  // Solo los roles con acceso al inventario/CRM sincronizan datos completos.
  // Asesores y revendedores usan únicamente la Red (carga sus propios datos).
  if (usuario.rol === "admin" || usuario.rol === "tasador") {
    sincronizar();
  } else {
    cargando = false;
    showLoader(false);
    render();
  }
}

function intentarLogin() {
  const usuario = (document.getElementById("userInput")?.value || "").trim().toLowerCase();
  const clave   = document.getElementById("pinInput").value.trim();
  const err     = document.getElementById("loginError");
  if (!clave) {
    err.textContent = usuario ? "Ingresa tu contraseña." : "Ingresa tu usuario y contraseña.";
    err.classList.remove("hidden");
    return;
  }

  // Botón disable + spinner
  const btn = document.querySelector('#loginScreen button[type="submit"]');
  if (btn) { btn.disabled = true; btn.textContent = "Verificando..."; }

  const limpiar = () => {
    if (btn) { btn.disabled = false; btn.textContent = "Ingresar →"; }
    document.getElementById("pinInput").value = "";
  };

  const alRecibir = r => {
    if (r && r.exito && r.token) {
      err.classList.add("hidden");
      limpiar();
      document.getElementById("userInput").value = "";
      _completarLogin({
        rol: r.rol, nombre: r.nombre, color: r.color, tabInicial: r.tabInicial,
        userId: r.userId, concesionario: r.concesionario || ""
      }, r.token);
    } else {
      err.textContent = (r && r.error) || "Usuario o contraseña incorrectos.";
      err.classList.remove("hidden");
      limpiar();
    }
  };

  const alFallar = e => {
    limpiar();
    err.textContent = "⚠️ Backend no disponible. Verifica tu conexión e intenta de nuevo.";
    err.classList.remove("hidden");
    console.warn('Login error de red:', e && (e.message || e));
  };

  // El BACKEND es source of truth. Sin usuario → login por PIN (modo de
  // transición, se apaga con desactivarLoginPorPin()).
  const req = google.script.run.withSuccessHandler(alRecibir).withFailureHandler(alFallar);
  if (usuario) req.login({ usuario: usuario, password: clave });
  else         req.verificarPin(clave);
}

// ───── Persistencia de sesión (sessionStorage, NO localStorage) ─────
// sessionStorage se borra al cerrar la pestaña; localStorage sobreviviría
// en equipos compartidos, que es justo lo que no queremos.
const SESSION_KEY = "lcd_session_token";

function _guardarTokenLocal(token) {
  try { token ? sessionStorage.setItem(SESSION_KEY, token) : sessionStorage.removeItem(SESSION_KEY); }
  catch (e) { /* modo privado o storage bloqueado → la sesión simplemente no persiste */ }
}

function _leerTokenLocal() {
  try { return sessionStorage.getItem(SESSION_KEY); } catch (e) { return null; }
}

// Al cargar la página: si hay token guardado, pregunta al backend si sigue
// vigente. Si sí, entra directo; si no, muestra el login.
function restaurarSesion() {
  const token = _leerTokenLocal();
  if (!token) return;

  const loader = document.getElementById("loader");
  if (loader) loader.classList.remove("hidden");

  google.script.run
    .withSuccessHandler(r => {
      if (r && r.exito && r.valida) {
        _completarLogin({
          rol: r.rol, nombre: r.nombre, color: r.color, tabInicial: r.tabInicial,
          userId: r.userId, concesionario: r.concesionario || ""
        }, token);
      } else {
        _guardarTokenLocal(null);
        showLoader(false);
      }
    })
    .withFailureHandler(() => { _guardarTokenLocal(null); showLoader(false); })
    .validarSesion({ token: token });
}

// ───── RBAC · Fase 2: pestañas permitidas por rol ─────
// null = todas las pestañas (admin)
const TABS_POR_ROL = {
  admin      : null,
  tecnico    : ["inspeccion"],
  // El tasador también publica: ve el Stock (unidades disponibles, solo precio
  // sugerido — sin costos/utilidad) y genera flyers del carro comprado.
  tasador    : ["red", "inventario", "tasadora", "cotizaciones", "inspeccion", "flyer"],
  asesor     : ["red"],
  revendedor : ["red"],
  contador   : ["nomina"]
};
// Solo el admin ve la información financiera (costos, gastos, utilidad)
function verFinanzas() { return usuarioActual?.rol === "admin"; }
const ICONO_ROL = { admin: "👑", tecnico: "🔧", tasador: "📊", asesor: "🤝", revendedor: "💰", contador: "🧾" };

function tabsPermitidos() {
  if (!usuarioActual) return [];
  const t = TABS_POR_ROL[usuarioActual.rol];
  if (t === null || t === undefined && usuarioActual.rol === "admin") return null; // admin: todas
  return t || ["inspeccion"]; // rol desconocido → mínimo
}

function tabPermitido(tab) {
  const t = tabsPermitidos();
  return t === null || (Array.isArray(t) && t.includes(tab));
}

function aplicarRBAC() {
  if(!usuarioActual) return;
  const permitidas = tabsPermitidos();
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const visible = permitidas === null || permitidas.includes(btn.dataset.tab);
    btn.classList.toggle("hidden", !visible);
  });
  // Sincronizar (lee inventario/CRM) solo para roles internos con acceso a datos
  const puedeSync = ["admin", "tasador"].includes(usuarioActual.rol);
  document.getElementById("btnSync").style.display = puedeSync ? "" : "none";
  // Mostrar "Cambiar PIN" solo si tenemos token del backend (no en modo legacy)
  const btnPin = document.getElementById("btnCambiarPin");
  if (btnPin) btnPin.classList.toggle("hidden", !sessionToken);
  // Campana de notificaciones: para todos los usuarios logueados
  document.getElementById("btnNotif")?.classList.toggle("hidden", !sessionToken);
  const badge = document.getElementById("userBadge");
  badge.textContent = `${ICONO_ROL[usuarioActual.rol] || "👤"} ${usuarioActual.nombre}`;
  badge.style.background = usuarioActual.color + "22";
  badge.style.color = usuarioActual.color;
  badge.style.border = `1px solid ${usuarioActual.color}55`;
  badge.classList.remove("hidden");
  // Mostrar también el badge de sesión
  document.getElementById("sessionBadge")?.classList.remove("hidden");
}

function cerrarSesion() {
  confirmAccion({
    title: 'Cerrar sesión',
    message: usuarioActual ? `Adiós ${usuarioActual.nombre}. ¿Confirmar cierre de sesión?` : '¿Cerrar la sesión actual?',
    confirmText: '🚪 Salir',
    icon: '👋'
  }).then(ok => { if (ok) cerrarSesionForzado(); });
}

// Fase 1 · Modal para cambiar PIN
function abrirCambiarPin() {
  if (!sessionToken) {
    toast("⚠️ Esta función requiere auth con backend", "error");
    return;
  }
  modal("🔑 Cambiar mi contraseña", `
    <form id="cambiarPinForm" onsubmit="event.preventDefault();confirmarCambiarPin()">
      <div class="mb-3">
        <label>Contraseña actual</label>
        <input type="password" id="pinActualInput" autocomplete="current-password" placeholder="••••••••" maxlength="64" autofocus>
      </div>
      <div class="mb-3">
        <label>Contraseña nueva (mín. 8 caracteres)</label>
        <input type="password" id="pinNuevoInput" autocomplete="new-password" placeholder="••••••••" maxlength="64">
      </div>
      <div class="mb-3">
        <label>Confirmar contraseña nueva</label>
        <input type="password" id="pinConfirmInput" autocomplete="new-password" placeholder="••••••••" maxlength="64">
      </div>
      <div id="cambiarPinError" class="hidden text-red-400 text-xs mb-2"></div>
      <div class="flex gap-2 justify-end">
        <button type="button" onclick="closeModal()" class="border border-slate-700 text-slate-400 rounded px-4 py-2 text-sm">Cancelar</button>
        <button type="submit" id="btnConfirmarPin" class="bg-amber-600 hover:bg-amber-500 text-white rounded px-4 py-2 text-sm font-semibold">Cambiar contraseña</button>
      </div>
    </form>
  `);
}

function confirmarCambiarPin() {
  const pinActual  = document.getElementById("pinActualInput").value;
  const pinNuevo   = document.getElementById("pinNuevoInput").value;
  const pinConfirm = document.getElementById("pinConfirmInput").value;
  const errEl      = document.getElementById("cambiarPinError");

  if (pinNuevo.length < 8) {
    errEl.textContent = "La contraseña nueva debe tener al menos 8 caracteres";
    errEl.classList.remove("hidden");
    return;
  }
  if (pinNuevo !== pinConfirm) {
    errEl.textContent = "Las contraseñas nuevas no coinciden";
    errEl.classList.remove("hidden");
    return;
  }

  const btn = document.getElementById("btnConfirmarPin");
  const restaurar = () => { if (btn) { btn.disabled = false; btn.textContent = "Cambiar contraseña"; } };
  if (btn) { btn.disabled = true; btn.textContent = "Cambiando..."; }

  google.script.run
    .withSuccessHandler(r => {
      restaurar();
      if (r && r.exito) {
        toast("✅ Contraseña actualizada · úsala en el próximo ingreso", "success");
        closeModal();
      } else {
        errEl.textContent = "⚠️ " + (r ? r.error : 'Error desconocido');
        errEl.classList.remove("hidden");
      }
    })
    .withFailureHandler(e => {
      restaurar();
      errEl.textContent = "⚠️ " + (e.message || e);
      errEl.classList.remove("hidden");
    })
    // Auth segura: valida contra la contraseña (Pass_Hash), no contra el PIN.
    // Los PIN ya no existen, por eso `cambiarPin` siempre fallaba aquí.
    .cambiarPassword({ _token: sessionToken, passwordActual: pinActual, passwordNueva: pinNuevo });
}

// ─────────── Barra de pestañas en celular ───────────
// En pantalla chica las pestañas viven en una sola fila deslizable. Los
// nombres largos obligarían a arrastrar de más, así que se acortan; en
// escritorio se muestran completos.
const TAB_CORTO = {
  dashboard    : "📊 Panel",
  cotizaciones : "📋 Ventas",
  red          : "🌐 Red",
  performance  : "💰 Margen"
};

function ajustarEtiquetasTabs() {
  const movil = window.matchMedia("(max-width: 767px)").matches;
  document.querySelectorAll(".tab-btn").forEach(b => {
    if (!b.dataset.labelLargo) b.dataset.labelLargo = b.textContent.trim();
    const corto = TAB_CORTO[b.dataset.tab];
    b.textContent = (movil && corto) ? corto : b.dataset.labelLargo;
  });
}

// Deja la pestaña activa centrada. Mueve SOLO la tira horizontal —nunca la
// página— para que al cambiar de pestaña no se pierda el scroll vertical.
function centrarTabActiva() {
  const tira = document.querySelector(".tabs-scroll");
  const act  = tira && tira.querySelector(".tab-btn.active");
  if (!tira || !act) return;
  if (tira.scrollWidth <= tira.clientWidth + 4) return;   // en escritorio no hay nada que deslizar
  tira.scrollTo({
    left: Math.max(0, act.offsetLeft - (tira.clientWidth - act.offsetWidth) / 2),
    behavior: "smooth"
  });
}

ajustarEtiquetasTabs();
window.addEventListener("resize", ajustarEtiquetasTabs);

document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click", ()=>{ currentTab = b.dataset.tab; render(); });
});

setTimeout(()=>document.getElementById("userInput")?.focus(), 100);

// Si quedó una sesión válida de antes del F5, entra directo sin re-loguear.
restaurarSesion();

</script>
