<style>
  /* ============================================================
     SISTEMA VISUAL · AutoCRM LCD Group
     Paleta: slate (base) · sky/emerald/indigo/amber (acentos)
     ============================================================ */
  :root {
    --c-bg:           #020617;
    --c-surface-1:    #0b1220;   /* cards primarias */
    --c-surface-2:    #111c30;   /* cards secundarias / hover */
    --c-surface-3:    #1a2740;   /* inputs */
    --c-border:       #1e293b;
    --c-border-soft:  #243047;
    --c-border-focus: #3b82f6;
    --c-text:         #e2e8f0;
    --c-text-mute:    #94a3b8;
    --c-text-faint:   #64748b;
    --c-accent:       #38bdf8;
    --c-accent-soft:  rgba(56,189,248,.14);
    --shadow-soft:    0 1px 0 rgba(255,255,255,.03), 0 4px 14px rgba(0,0,0,.35);
    --shadow-pop:     0 1px 0 rgba(255,255,255,.04), 0 12px 32px rgba(0,0,0,.55);
  }

  body {
    font-family: 'Inter', system-ui, -apple-system, sans-serif;
    background:
      radial-gradient(1100px 540px at 80% -10%, rgba(56,189,248,.07), transparent 60%),
      radial-gradient(900px 480px at -10% 100%, rgba(99,102,241,.06), transparent 60%),
      var(--c-bg);
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  /* ───────── Scrollbar dark ───────── */
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #1e293b; border-radius: 8px; border: 2px solid transparent; background-clip: padding-box; }
  ::-webkit-scrollbar-thumb:hover { background: #334155; background-clip: padding-box; border: 2px solid transparent; }

  /* ───────── Tabs estilo pill ───────── */
  .tab-btn {
    position: relative;
    border-radius: 8px;
    margin: 6px 2px;
    padding: 7px 12px !important;
    transition: color .15s ease, background .15s ease;
  }
  .tab-btn:hover { color: #cbd5e1; background: rgba(255,255,255,.03); }
  .tab-btn.active {
    color: #fff !important;
    background: linear-gradient(180deg, rgba(56,189,248,.18), rgba(56,189,248,.08));
    box-shadow: inset 0 0 0 1px rgba(56,189,248,.35), 0 0 24px -8px rgba(56,189,248,.55);
    border-bottom: none !important;
  }

  /* ───────── Celular ─────────
     En escritorio la barra se queda igual: .tabs-scroll usa `display:contents`,
     así que los botones siguen siendo hijos directos del flex del navbar.
     En pantallas chicas se convierte en UNA fila que se desliza con el dedo.
     Antes las 11 pestañas se apilaban en 7 filas: ~540 px de los 812 de un
     teléfono se iban en el menú antes de mostrar nada. */
  .tabs-scroll { display: contents; }

  @media (max-width: 767px) {
    .navbar-row { gap: 0 !important; padding-left: 10px !important; padding-right: 10px !important; }

    .tabs-scroll {
      display: flex;
      flex: 0 0 100%;          /* fila propia, debajo del logo */
      order: 3;
      overflow-x: auto;
      overflow-y: hidden;
      gap: 2px;
      padding-bottom: 4px;
      scroll-snap-type: x proximity;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
    }
    .tabs-scroll::-webkit-scrollbar { display: none; }
    .tabs-scroll .tab-btn {
      flex: 0 0 auto;
      white-space: nowrap;
      scroll-snap-align: center;
      margin: 0;
      padding: 9px 13px !important;   /* dedo, no puntero */
      min-height: 40px;
    }

    /* El logo se queda; el texto "AutoCRM / LCD Group" cede su ancho */
    .brand-text { display: none !important; }
    .navbar-row .brand-block { margin-right: 8px !important; padding: 8px 0 !important; }

    /* Diagnóstico, no información de trabajo: estorba en la cabecera */
    #sessionBadge { display: none !important; }

    /* El logo (58px) y el grupo de la derecha caben en la misma fila si el
       grupo adelgaza ~10px; sin esto se pasa por 8px y salta de línea,
       gastando 44px de alto en todas las pantallas. */
    .navbar-row > .ml-auto { gap: 4px !important; }
    #tcBadge   { font-size: 10px !important; padding: 3px 7px !important; }
    #userBadge { font-size: 10px !important; padding: 3px 9px !important; }

    .app-main { padding: 14px 12px !important; }
  }

  /* ───────── Forms ───────── */
  input, select, textarea {
    background: var(--c-surface-3);
    border: 1px solid var(--c-border-soft);
    color: var(--c-text);
    border-radius: 8px;
    padding: 8px 11px;
    font-size: 13px;
    outline: none;
    width: 100%;
    transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
  }
  input:hover:not(:focus), select:hover:not(:focus), textarea:hover:not(:focus) { border-color: #2f3e5e; }
  input:focus, select:focus, textarea:focus {
    border-color: var(--c-border-focus);
    box-shadow: 0 0 0 3px rgba(59,130,246,.18);
    background: #1d2a44;
  }
  input[readonly] { background:#0a1424; color: var(--c-text-faint); }
  input::placeholder, textarea::placeholder { color: #475569; }
  label {
    font-size: 10.5px;
    color: var(--c-text-mute);
    text-transform: uppercase;
    letter-spacing: 1.1px;
    font-weight: 600;
  }

  /* ───────── Badges ───────── */
  .badge {
    border-radius: 20px;
    padding: 3px 10px;
    font-size: 10.5px;
    font-weight: 700;
    display: inline-block;
    letter-spacing: .3px;
  }

  /* ───────── Tablas ───────── */
  table { border-collapse: collapse; width: 100%; font-size: 12.5px; }
  th {
    text-align: left;
    padding: 9px 12px;
    color: var(--c-text-faint);
    font-weight: 600;
    border-bottom: 1px solid var(--c-border);
    white-space: nowrap;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: .6px;
  }
  td { padding: 10px 12px; border-bottom: 1px solid #0a1322; }
  tr.clickable { cursor: pointer; transition: background .12s ease; }
  tr.clickable:hover td { background: rgba(56,189,248,.04); }
  tr.clickable:hover td:first-child { box-shadow: inset 3px 0 0 var(--c-accent); }

  /* ───────── Modales ───────── */
  .modal-overlay {
    position: fixed; inset: 0;
    background: rgba(2,6,23,.78);
    backdrop-filter: blur(6px);
    z-index: 1000;
    display: flex; align-items: center; justify-content: center;
    padding: 16px;
  }
  .modal-box {
    background: linear-gradient(180deg, #0f1a2e 0%, #0b1220 100%);
    border: 1px solid var(--c-border-soft);
    border-radius: 14px;
    width: 100%; max-width: 860px; max-height: 90vh;
    overflow-y: auto; padding: 26px;
    box-shadow: var(--shadow-pop);
  }
  .section-title {
    font-size: 11px;
    color: var(--c-accent);
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 1.3px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 1px solid var(--c-border);
    display: flex; align-items: center; gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 3px; height: 12px;
    background: var(--c-accent);
    border-radius: 2px;
  }

  /* ───────── Cards ───────── */
  .card-elevated {
    background: linear-gradient(180deg, var(--c-surface-1) 0%, var(--c-surface-2) 100%);
    border: 1px solid var(--c-border-soft);
    border-radius: 14px;
    box-shadow: var(--shadow-soft);
    transition: transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease;
  }
  .card-elevated:hover { border-color: #2c3a55; box-shadow: var(--shadow-pop); }
  .card-flat {
    background: var(--c-surface-1);
    border: 1px solid var(--c-border);
    border-radius: 12px;
  }

  /* ───────── Spinner ───────── */
  .spinner {
    width: 44px; height: 44px;
    border: 3px solid #1e293b;
    border-top: 3px solid var(--c-accent);
    border-right: 3px solid var(--c-accent);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto;
    box-shadow: 0 0 30px -10px rgba(56,189,248,.6);
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  @keyframes highlightPulse { 0%,100% { background: transparent; } 30% { background: rgba(56,189,248,.28); } 60% { background: rgba(56,189,248,.12); } }
  tr.highlight-row td { animation: highlightPulse 2.5s ease-out; }

  /* ───────── Hover de cards genéricas ───────── */
  .clickable-card { cursor: pointer; transition: transform .18s cubic-bezier(.16,1,.3,1), border-color .18s ease, box-shadow .18s ease; }
  .clickable-card:hover { transform: translateY(-1px); border-color: rgba(56,189,248,.45); box-shadow: 0 8px 28px -10px rgba(56,189,248,.35); }

  /* ───────── Page heading ───────── */
  .page-heading {
    font-size: 22px;
    font-weight: 800;
    letter-spacing: -.5px;
    background: linear-gradient(180deg, #f1f5f9 0%, #cbd5e1 100%);
    -webkit-background-clip: text;
    background-clip: text;
    -webkit-text-fill-color: transparent;
    color: #f1f5f9;
  }

  /* ───────── Buttons primarios ───────── */
  .btn-primary {
    background: linear-gradient(180deg, #2563eb 0%, #1d4ed8 100%);
    color: #fff;
    border-radius: 8px;
    padding: 8px 14px;
    font-size: 13px;
    font-weight: 600;
    border: 1px solid rgba(255,255,255,.08);
    box-shadow: 0 1px 0 rgba(255,255,255,.15) inset, 0 4px 14px -4px rgba(37,99,235,.5);
    transition: filter .15s ease, transform .1s ease;
  }
  .btn-primary:hover { filter: brightness(1.1); }
  .btn-primary:active { transform: translateY(1px); }

  /* Animaciones profesionales para modales y toasts */
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes fadeOut { from { opacity: 1; } to { opacity: 0; } }
  @keyframes scaleIn { from { transform: scale(.94); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  @keyframes slideInRight { from { transform: translateX(120%); opacity: 0; } to { transform: translateX(0); opacity: 1; } }
  @keyframes slideOutRight { from { transform: translateX(0); opacity: 1; } to { transform: translateX(120%); opacity: 0; } }
  .anim-fadeIn { animation: fadeIn .2s ease-out; }
  .anim-fadeOut { animation: fadeOut .2s ease-out forwards; }
  .anim-scaleIn { animation: scaleIn .25s cubic-bezier(.16,1,.3,1); }
  .modal-overlay { animation: fadeIn .2s ease-out; }
  .modal-box { animation: scaleIn .25s cubic-bezier(.16,1,.3,1); }
  .toast { animation: slideInRight .3s cubic-bezier(.16,1,.3,1); }
  .toast { position:fixed; bottom:20px; right:20px; background:#0f172a; border:1px solid #334155; border-radius:8px; padding:12px 18px; z-index:2000; font-size:13px; transition:all 0.3s; }
  .toast.success { border-color:#22c55e; color:#4ade80; }
  .toast.error { border-color:#ef4444; color:#ef4444; }
</style>
</head>

<!-- ============================================================
     SHIM google.script.run para GitHub Pages
     Detecta entorno y usa fetch() si no estamos en Apps Script.
     ============================================================ -->
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwxWAZUqGJnQ0eOT0jVDTXg4T5Hrlp2s_TzY9RmcB0V47DafUj8reKTdxQhTPy9nwh1/exec';

// Versión del backend que este HTML necesita. Si el deployment de Apps Script
// tiene otra versión (o es tan viejo que no responde), la app muestra un banner
// rojo con las instrucciones — se acabó el misterio del "Acción no reconocida".
const BACKEND_VERSION_ESPERADA = 'FASE3-R8';

// URL del endpoint de Vercel que renderiza el flyer con Chrome headless real.
const FLYER_RENDER_URL = 'https://lcd-catalogo-publico.vercel.app/api/generar-flyer';

(function() {
  // Si estamos dentro de Apps Script Web App, google.script.run ya existe → no hacer nada
  if (typeof google !== "undefined" && google.script && google.script.run) return;

  // Mapeo: nombre de función → { action en doGet/doPost, isGet, argName }
  const API_MAP = {
    'obtenerDatos':                       { action: 'datos',             isGet: true, ignoreArg: true },
    'listarOperaciones':                  { action: 'operaciones',       isGet: true },
    'obtenerFotosVehiculo':               { action: 'fotosVehiculo',     isGet: true, argName: 'placa' },
    'obtenerLogoLCD':                     { action: 'logoLCD',           isGet: true },
    'obtenerFotoComoBase64':              { action: 'fotoBase64',        isGet: true, argName: 'url' },
    'obtenerAuditoria':                   { action: 'auditoria',         isGet: true, argName: 'limit' },
    'guardarVehiculo':                    { action: 'guardarVehiculo' },
    'guardarCliente':                     { action: 'guardarCliente' },
    'guardarTasacion':                    { action: 'guardarTasacion' },
    'actualizarTasacion':                 { action: 'actualizarTasacion' },
    'confirmarCompra':                    { action: 'confirmarCompra' },
    'guardarInspeccionYGenerarDocumento': { action: 'guardarInspeccion' },
    'eliminarTasacion':                   { action: 'eliminarTasacion' },
    'guardarFotosVehiculo':               { action: 'guardarFotosVehiculo' },
    'guardarFotosExtras':                 { action: 'guardarFotosExtras' },
    'guardarFlyerGenerado':               { action: 'guardarFlyerGenerado' },
    // Fase 1 · Auth segura
    'verificarPin':                       { action: 'verificarPin' },
    'cerrarSesionBackend':                { action: 'cerrarSesionBackend' },
    'cambiarPin':                         { action: 'cambiarPin' },
    // Fase 2 · Red de Tasaciones (todas POST → protegidas por token + rol)
    'registrarReferido':                  { action: 'registrarReferido' },
    'listarReferidos':                    { action: 'listarReferidos' },
    'derivarARevendedores':               { action: 'derivarARevendedores' },
    'enviarPropuesta':                    { action: 'enviarPropuesta' },
    'listarPropuestas':                   { action: 'listarPropuestas' },
    'aprobarPropuesta':                   { action: 'aprobarPropuesta' },
    'actualizarReferido':                 { action: 'actualizarReferido' },
    'misNotificaciones':                  { action: 'misNotificaciones' },
    'marcarNotifLeida':                   { action: 'marcarNotifLeida' },
    'crearUsuarioRed':                    { action: 'crearUsuarioRed' },
    'crearUsuarioApp':                    { action: 'crearUsuarioApp' },
    'resetearPasswordApp':                { action: 'resetearPasswordApp' },
    'listarUsuariosRed':                  { action: 'listarUsuariosRed' },
    'desactivarUsuario':                  { action: 'desactivarUsuario' },
    // Fase 3 · Nómina + Facturación + RENIEC (todas POST → token + rol)
    'listarTrabajadores':                 { action: 'listarTrabajadores' },
    'guardarTrabajador':                  { action: 'guardarTrabajador' },
    'listarPagosNomina':                  { action: 'listarPagosNomina' },
    'registrarPagoNomina':                { action: 'registrarPagoNomina' },
    'consultarDNI':                       { action: 'consultarDNI' },
    'emitirComprobante':                  { action: 'emitirComprobante' },
    'listarComprobantes':                 { action: 'listarComprobantes' },
    // Fase 4 · Precios de mercado (NeoAuto)
    'consultarMercado':                   { action: 'consultarMercado' },
    // Auth segura · usuario + contraseña
    'login':                              { action: 'login' },
    'validarSesion':                      { action: 'validarSesion' },
    'cambiarPassword':                    { action: 'cambiarPassword' },
    'crearUsuarioConPassword':            { action: 'crearUsuarioPassword' }
  };

  function fireRequest(fnName, arg, onSuccess, onFailure) {
    const cfg = API_MAP[fnName];
    if (!cfg) {
      console.warn('[gsRun shim] Función desconocida:', fnName);
      if (onFailure) onFailure({ message: 'Función desconocida: ' + fnName });
      return;
    }

    // Adjuntar sessionToken automáticamente en todos los POST (writes)
    // Backend rechaza writes sin token válido (excepto verificarPin/cerrarSesion)
    const _tk = (typeof sessionToken !== 'undefined') ? sessionToken : null;

    let req;
    if (cfg.isGet) {
      const params = new URLSearchParams();
      params.set('action', cfg.action);
      if (!cfg.ignoreArg && arg !== undefined && arg !== null) {
        params.set(cfg.argName || 'arg', String(arg));
      }
      params.set('_t', Date.now());  // cache-buster: evita leer datos viejos tras guardar
      if (_tk) params.set('_tk', _tk);  // token de sesión: los GET de datos ya no son públicos
      req = fetch(APPS_SCRIPT_URL + '?' + params.toString(), { method: 'GET', redirect: 'follow', cache: 'no-store' });
    } else {
      const body = { action: cfg.action, payload: arg };
      if (_tk) body._token = _tk;  // ← guardia de auth
      req = fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify(body)
      });
    }

    req
      .then(function(r) { return r.json(); })
      .then(function(result) {
        // Si el backend dice que el token expiró → cerrar sesión automático
        if (result && result.authRequired) {
          try {
            toast && toast('🔒 Tu sesión expiró. Inicia sesión de nuevo.', 'error');
          } catch(e) {}
          setTimeout(function(){
            if (typeof cerrarSesionForzado === 'function') cerrarSesionForzado();
          }, 1500);
          if (onFailure) onFailure({ message: 'Sesión expirada' });
          return;
        }
        if (onSuccess) onSuccess(result);
      })
      .catch(function(err) {
        console.error('[gsRun shim] Error:', err);
        if (onFailure) onFailure(err);
      });
  }

  function createChain() {
    const ctx = { onSuccess: null, onFailure: null };
    const chain = {
      withSuccessHandler: function(fn) { ctx.onSuccess = fn; return proxy; },
      withFailureHandler: function(fn) { ctx.onFailure = fn; return proxy; }
    };
    const proxy = new Proxy(chain, {
      get: function(target, prop) {
        if (prop in target) return target[prop];
        if (typeof prop === 'symbol') return undefined;
        return function(arg) {
          fireRequest(prop, arg, ctx.onSuccess, ctx.onFailure);
        };
      }
    });
    return proxy;
  }

  window.google = {
    script: {
      get run() { return createChain(); }
    }
  };

})();

// ─────────────────────────────────────────────────────────────
// Chequeo de versión del backend — SOLO en la consola (F12),
// sin elementos visibles para el usuario.
// ─────────────────────────────────────────────────────────────
function verificarVersionBackend() {
  fetch(APPS_SCRIPT_URL + '?action=version&_t=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
    .then(r => r.json())
    .then(r => {
      const activa = (r && r.version) || 'versión antigua (sin marcador)';
      if (activa === BACKEND_VERSION_ESPERADA) console.log('✅ Backend actualizado:', activa);
      else console.warn('⚠️ Backend DESACTUALIZADO. Esperado:', BACKEND_VERSION_ESPERADA,
        '· Activo:', activa, '→ Apps Script: Implementar → Administrar implementaciones → ✏️ → Nueva versión');
    })
    .catch(() => {});
}

verificarVersionBackend();

// ─────────────────────────────────────────────────────────────
// TIPO DE CAMBIO DEL DÍA (SUNAT) — visible para TODOS los usuarios
// al abrir la app: en la pantalla de login y en la barra superior.
// El backend lo cachea 6 h (una sola consulta al proveedor por día).

function cargarTipoCambio() {
  fetch(APPS_SCRIPT_URL + '?action=tipoCambio&_t=' + Date.now(), { redirect: 'follow', cache: 'no-store' })
    .then(r => r.json())
    .then(r => {
      if (!r || r.exito === false || !r.venta) return;
      const compra = Number(r.compra).toFixed(3);
      const venta  = Number(r.venta).toFixed(3);
      const badge = document.getElementById('tcBadge');
      if (badge) {
        badge.textContent = `💱 $1 = S/ ${venta}`;
        badge.title = `Tipo de cambio ${r.fuente || 'SUNAT'} · ${r.fecha || 'hoy'} · Compra S/ ${compra} · Venta S/ ${venta}`;
        badge.classList.remove('hidden');
      }
      const login = document.getElementById('tcLogin');
      if (login) {
        login.innerHTML = `💱 <b>Dólar hoy (${r.fuente || 'SUNAT'})</b> · Compra S/ ${compra} · Venta S/ ${venta}`;
        login.classList.remove('hidden');
      }
    })
    .catch(() => {});
}

cargarTipoCambio();
setInterval(cargarTipoCambio, 6 * 60 * 60 * 1000);  // refresca cada 6 h si dejan la app abierta
</script>

<script>
const FLYER_DEFAULT_PHONE = "+51 999 999 999";
const FLYER_DEFAULT_INSTAGRAM = "@lcdgroup.automotriz";

const FLYER_PHOTO_LABELS = ['📍 Foto Principal', '🖼 Foto 2', '🖼 Foto 3', '🖼 Foto 4'];

const FLYER_STATE = {
  vehSeleccionado: null,
  marca: "", modelo: "", version: "", anio: "", km: "",
  transmision: "", traccion: "", motor: "", placa: "",
  precio: "", tagOferta: "OFERTA",
  // 4 fotos del FLYER: [0]=principal, [1..3]=galería
  fotos: ["", "", "", ""],
  fotosBytes: ["", "", "", ""],
  fotosDesdeDrive: [false, false, false, false],
  // 8 fotos EXTRAS solo para el CATÁLOGO público (no van al flyer)
  fotosExtras: ["", "", "", "", "", "", "", ""],
  fotosExtrasBytes: ["", "", "", "", "", "", "", ""],
  fotosExtrasDesdeDrive: [false, false, false, false, false, false, false, false],
  phone: FLYER_DEFAULT_PHONE,
  instagram: FLYER_DEFAULT_INSTAGRAM,
  logoDataUri: ""
};

function renderFlyer() {
  return `
  <div class="max-w-7xl mx-auto">
    <div class="mb-5">
      <h1 class="page-heading">🎨 Generador de Flyer · Stories</h1>
      <p class="text-slate-500 text-sm mt-1">Formato vertical 1080×1920. Click sobre el <span class="text-emerald-400">precio</span> o etiqueta <span class="text-red-400">OFERTA</span> en la vista previa para editarlos directamente.</p>
    </div>
    <div class="grid lg:grid-cols-[380px_1fr] gap-5">
      <div class="space-y-4">
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">📋 Vehículo del stock</div>
          <select id="flyerVehSelect" onchange="flyerSelectVehiculo(this.value)">
            <option value="">— Elegir vehículo —</option>
            ${flyerVehOptions()}
          </select>
          <div class="text-xs text-slate-500 mt-2">${vehs.filter(v=>["Disponible","Publicado"].includes(v.estado)).length} vehículos disponibles</div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">🚗 Datos del vehículo</div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="flyer-input-label">Marca</label><input type="text" class="uppercase" value="${FLYER_STATE.marca}" oninput="FLYER_STATE.marca=this.value.toUpperCase();flyerUpdate()"></div>
            <div><label class="flyer-input-label">Año</label><input type="text" value="${FLYER_STATE.anio}" oninput="FLYER_STATE.anio=this.value;flyerUpdate()"></div>
            <div class="col-span-2"><label class="flyer-input-label">Modelo</label><input type="text" class="uppercase" value="${FLYER_STATE.modelo}" oninput="FLYER_STATE.modelo=this.value.toUpperCase();flyerUpdate()"></div>
            <div class="col-span-2"><label class="flyer-input-label">Versión</label><input type="text" class="uppercase" value="${FLYER_STATE.version}" oninput="FLYER_STATE.version=this.value.toUpperCase();flyerUpdate()"></div>
          </div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">💰 Precio &amp; Etiqueta</div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="flyer-input-label">Precio (USD)</label><input type="number" value="${FLYER_STATE.precio}" oninput="FLYER_STATE.precio=this.value;flyerUpdate()" placeholder="15500"></div>
            <div><label class="flyer-input-label">Etiqueta destacada</label><input type="text" class="uppercase" value="${FLYER_STATE.tagOferta}" oninput="FLYER_STATE.tagOferta=this.value.toUpperCase();flyerUpdate()" placeholder="OFERTA"></div>
          </div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">⚙️ Especificaciones (tags)</div>
          <div class="grid grid-cols-2 gap-2">
            <div><label class="flyer-input-label">Kilometraje</label><input type="text" value="${FLYER_STATE.km}" oninput="FLYER_STATE.km=this.value;flyerUpdate()"></div>
            <div><label class="flyer-input-label">Motor</label><input type="text" value="${FLYER_STATE.motor}" oninput="FLYER_STATE.motor=this.value;flyerUpdate()" placeholder="2.0L"></div>
            <div><label class="flyer-input-label">Transmisión</label><input type="text" class="uppercase" value="${FLYER_STATE.transmision}" oninput="FLYER_STATE.transmision=this.value.toUpperCase();flyerUpdate()" placeholder="AUTOMÁTICA"></div>
            <div><label class="flyer-input-label">Tracción</label><input type="text" class="uppercase" value="${FLYER_STATE.traccion}" oninput="FLYER_STATE.traccion=this.value.toUpperCase();flyerUpdate()" placeholder="4X4"></div>
          </div>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">📸 Fotos del flyer (4)</div>
          ${flyerPhotoSlotHTML(0)}
          <div class="grid grid-cols-3 gap-2 mt-2">
            ${flyerPhotoSlotHTML(1)}
            ${flyerPhotoSlotHTML(2)}
            ${flyerPhotoSlotHTML(3)}
          </div>
          <button onclick="flyerSavePhotosToDrive()" id="flyerSavePhotosBtn"
            class="w-full mt-3 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg py-2 text-xs font-semibold border border-slate-700">
            💾 Guardar fotos del flyer en Drive
          </button>
          <div class="text-xs text-slate-500 mt-2">Estas 4 fotos se usan en el flyer. Si el vehículo ya tiene fotos en Drive, se cargan automáticamente.</div>
        </div>

        <div class="bg-slate-900 border border-sky-500/30 rounded-xl p-4">
          <div class="flyer-section-title" style="color:#38bdf8">📷 Galería del Catálogo Público (+8 extras)</div>
          <div class="text-xs text-slate-400 mb-3">
            Estas fotos aparecen <b>solo en el catálogo público</b> (no en el flyer). Súbelas con interior, motor, llantas, papeles, detalles. <b>Mientras más fotos, más confianza generas.</b>
          </div>
          <div class="grid grid-cols-4 gap-2">
            ${flyerExtraSlotHTML(0)}
            ${flyerExtraSlotHTML(1)}
            ${flyerExtraSlotHTML(2)}
            ${flyerExtraSlotHTML(3)}
            ${flyerExtraSlotHTML(4)}
            ${flyerExtraSlotHTML(5)}
            ${flyerExtraSlotHTML(6)}
            ${flyerExtraSlotHTML(7)}
          </div>
          <button onclick="flyerSaveExtrasToDrive()" id="flyerSaveExtrasBtn"
            class="w-full mt-3 bg-sky-600 hover:bg-sky-500 text-white rounded-lg py-2 text-xs font-semibold">
            💾 Guardar fotos extras del catálogo en Drive
          </button>
        </div>
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="flyer-section-title">📞 Contacto</div>
          <div class="space-y-2">
            <div><label class="flyer-input-label">WhatsApp</label><input type="text" value="${FLYER_STATE.phone}" oninput="FLYER_STATE.phone=this.value;flyerUpdate()"></div>
            <div><label class="flyer-input-label">Instagram</label><input type="text" value="${FLYER_STATE.instagram}" oninput="FLYER_STATE.instagram=this.value;flyerUpdate()" placeholder="@lcdgroup.automotriz"></div>
          </div>
        </div>
        <div class="grid grid-cols-2 gap-2">
          <button onclick="flyerDownloadOnly()" id="flyerBtnDownload" class="bg-slate-700 hover:bg-slate-600 text-white rounded-lg py-3 text-sm font-bold">⬇ Solo descargar</button>
          <button onclick="flyerGenerateAndSave()" id="flyerBtnSave" class="bg-gradient-to-br from-green-600 to-green-700 hover:from-green-500 hover:to-green-600 text-white rounded-lg py-3 text-sm font-bold shadow-lg shadow-green-500/20">💾 Generar + Guardar</button>
        </div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <div class="flex justify-between items-center mb-3">
          <div class="text-xs text-slate-500 uppercase tracking-wider font-semibold">Vista previa · click para editar inline</div>
          <div class="text-xs text-slate-600">1080 × 1920 px</div>
        </div>
        <div class="overflow-hidden rounded-lg bg-slate-950 p-3" style="min-height:600px;">
          <div id="flyerScaleWrap">${flyerCanvasHTML()}</div>
        </div>
      </div>
    </div>
  </div>`;
}

function initFlyer() {
  if (!FLYER_STATE.logoDataUri && typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(r){
      if (r && r.exito) { FLYER_STATE.logoDataUri = r.dataUri; flyerUpdate(); }
    }).obtenerLogoLCD();
  }
  flyerBindEditableElements();
  setTimeout(flyerScalePreview, 100);
  window.addEventListener('resize', flyerScalePreview);
}

function flyerScalePreview() {
  const wrap = document.getElementById('flyerScaleWrap');
  if (!wrap) return;
  const parent = wrap.parentElement;
  if (!parent) return;
  const panelW = parent.clientWidth - 24;
  const scale  = Math.min(panelW / 1080, 0.45);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.width  = '1080px';
  wrap.style.height = `${1920 * scale}px`;
  parent.style.height = `${1920 * scale + 24}px`;
}

function flyerBindEditableElements() {
  const tag = document.getElementById('fl-tag-oferta');
  if (tag) tag.addEventListener('input', () => { FLYER_STATE.tagOferta = tag.textContent || ''; });
  const precio = document.getElementById('fl-precio');
  if (precio) {
    precio.addEventListener('input', () => {
      const clean = (precio.textContent || '').replace(/[^\d]/g, '');
      FLYER_STATE.precio = clean;
    });
    precio.addEventListener('blur', () => { precio.textContent = flyerFormatPrecio(FLYER_STATE.precio); });
  }
}

function flyerVehOptions() {
  const stock = vehs.filter(v => ["Disponible","Publicado"].includes(v.estado));
  if (stock.length === 0) return '<option disabled>Sin vehículos en stock</option>';
  return stock.map(v => `<option value="${v.placa}">${v.marca} ${v.modelo} ${v.version||''} · ${v.anio} · ${v.placa}</option>`).join('');
}

function flyerSelectVehiculo(placa) {
  if (!placa) return;
  const v = vehs.find(x => String(x.placa).toUpperCase() === String(placa).toUpperCase());
  if (!v) return;

  FLYER_STATE.vehSeleccionado = v;
  FLYER_STATE.marca       = String(v.marca||'').toUpperCase();
  FLYER_STATE.modelo      = String(v.modelo||'').toUpperCase();
  FLYER_STATE.version     = String(v.version||'').toUpperCase();
  FLYER_STATE.anio        = String(v.anio||'');
  FLYER_STATE.km          = v.kilometraje ? Number(v.kilometraje).toLocaleString('en-US') + ' KM' : '';
  FLYER_STATE.motor       = flyerFormatMotor(v.motor);
  FLYER_STATE.placa       = v.placa || '';
  FLYER_STATE.transmision = flyerMapTransmision(v.transmision);
  FLYER_STATE.traccion    = flyerMapTraccion(v.traccion);
  FLYER_STATE.precio      = v.precioPublicacion ? String(v.precioPublicacion) : '';
  FLYER_STATE.fotos = ["", "", "", ""];
  FLYER_STATE.fotosBytes = ["", "", "", ""];
  FLYER_STATE.fotosDesdeDrive = [false, false, false, false];

  content.innerHTML = renderFlyer();
  initFlyer();
  document.getElementById('flyerVehSelect').value = placa;
  flyerCargarFotosDeDrive(placa);
}

function flyerFormatMotor(m) {
  if (!m) return '';
  const s = String(m).trim();
  if (/L|LITRO/i.test(s)) return s.toUpperCase();
  if (/^\d+(\.\d+)?$/.test(s)) return s + 'L';
  return s.toUpperCase();
}
function flyerMapTransmision(t) {
  if (!t) return '';
  const s = String(t).toUpperCase().trim();
  if (s === 'MT' || s === 'MANUAL') return 'MANUAL';
  if (s === 'AT' || s.includes('AUTO')) return 'AUTOMÁTICA';
  if (s === 'CVT') return 'CVT';
  return s;
}
function flyerMapTraccion(t) {
  if (!t) return '';
  const s = String(t).toUpperCase().trim();
  if (s === '4X2' || s === 'FWD') return '4X2';
  if (s === '4X4' || s === 'AWD') return '4X4';
  return s;
}
function flyerFormatPrecio(p) {
  const n = Number(String(p).replace(/[^\d]/g, ''));
  if (!n) return '___';
  return n.toLocaleString('en-US');
}

// ============================================================
// SLOTS DE FOTOS (formulario)
// ============================================================

function flyerPhotoSlotHTML(i) {
  const url = FLYER_STATE.fotos[i];
  const fromDrive = FLYER_STATE.fotosDesdeDrive[i];
  const label = FLYER_PHOTO_LABELS[i];
  const isMain = i === 0;
  const style = isMain
    ? 'aspect-ratio:9/16;min-height:240px;'
    : 'aspect-ratio:1/1;min-height:90px;';

  return `
    <div class="flyer-photo-slot" style="${style}">
      <input type="file" id="flyerPhotoInput${i}" accept="image/*" onchange="flyerHandlePhotoUpload(event, ${i})">
      ${url
        ? `<img src="${url}" />${fromDrive?'<span class="flyer-photo-from-drive">DRIVE</span>':''}<button class="flyer-photo-remove" onclick="flyerRemovePhoto(event, ${i})">✕</button>`
        : `<div class="flyer-photo-slot-label">${label}${isMain?'<br><span style="font-size:9px;opacity:.6;">9:16 ideal</span>':''}</div>`
      }
    </div>`;
}

function flyerHandlePhotoUpload(event, i) {
  const file = event.target.files[0];
  if (!file) return;
  // Validar tamaño máximo: 8 MB
  const MAX_SIZE = 8 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    toast(`⚠️ La foto pesa ${(file.size/1024/1024).toFixed(1)} MB · máximo 8 MB`, "error");
    event.target.value = '';
    return;
  }
  // Validar tipo
  if (!file.type.startsWith('image/')) {
    toast('⚠️ Solo se permiten imágenes', "error");
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    FLYER_STATE.fotos[i] = e.target.result;
    FLYER_STATE.fotosBytes[i] = (e.target.result.split(',')[1]) || '';
    FLYER_STATE.fotosDesdeDrive[i] = false;
    flyerRefreshPhotoSlot(i);
    flyerUpdate();
  };
  reader.readAsDataURL(file);
}

function flyerRemovePhoto(event, i) {
  event.stopPropagation();
  FLYER_STATE.fotos[i] = '';
  FLYER_STATE.fotosBytes[i] = '';
  FLYER_STATE.fotosDesdeDrive[i] = false;
  flyerRefreshPhotoSlot(i);
  flyerUpdate();
}

function flyerRefreshPhotoSlot(i) {
  const input = document.getElementById('flyerPhotoInput' + i);
  if (!input) return;
  const slot = input.parentElement;
  slot.outerHTML = flyerPhotoSlotHTML(i);
}

// ============================================================
// SLOTS EXTRAS (8 fotos solo para el CATÁLOGO público, no flyer)
// ============================================================

function flyerExtraSlotHTML(i) {
  const url = FLYER_STATE.fotosExtras[i] || '';
  const fromDrive = !!FLYER_STATE.fotosExtrasDesdeDrive[i];
  return `
    <div class="flyer-photo-slot" style="aspect-ratio:1/1;min-height:90px;">
      <input type="file" id="flyerExtraInput${i}" accept="image/*" onchange="flyerHandleExtraUpload(event, ${i})">
      ${url
        ? `<img src="${url}" />${fromDrive?'<span class="flyer-photo-from-drive">DRIVE</span>':''}<button class="flyer-photo-remove" onclick="flyerRemoveExtra(event, ${i})">✕</button>`
        : `<div class="flyer-photo-slot-label">Extra ${i+1}</div>`
      }
    </div>`;
}

function flyerHandleExtraUpload(event, i) {
  const file = event.target.files[0];
  if (!file) return;
  const MAX_SIZE = 8 * 1024 * 1024;
  if (file.size > MAX_SIZE) {
    toast(`⚠️ La foto pesa ${(file.size/1024/1024).toFixed(1)} MB · máximo 8 MB`, "error");
    event.target.value = '';
    return;
  }
  if (!file.type.startsWith('image/')) {
    toast('⚠️ Solo se permiten imágenes', "error");
    event.target.value = '';
    return;
  }
  const reader = new FileReader();
  reader.onload = function(e) {
    FLYER_STATE.fotosExtras[i] = e.target.result;
    FLYER_STATE.fotosExtrasBytes[i] = (e.target.result.split(',')[1]) || '';
    FLYER_STATE.fotosExtrasDesdeDrive[i] = false;
    flyerRefreshExtraSlot(i);
  };
  reader.readAsDataURL(file);
}

function flyerRemoveExtra(event, i) {
  event.stopPropagation();
  FLYER_STATE.fotosExtras[i] = '';
  FLYER_STATE.fotosExtrasBytes[i] = '';
  FLYER_STATE.fotosExtrasDesdeDrive[i] = false;
  flyerRefreshExtraSlot(i);
}

function flyerRefreshExtraSlot(i) {
  const input = document.getElementById('flyerExtraInput' + i);
  if (!input) return;
  const slot = input.parentElement;
  slot.outerHTML = flyerExtraSlotHTML(i);
}

function flyerSaveExtrasToDrive() {
  if (!FLYER_STATE.placa) { toast("⚠️ Selecciona primero un vehículo del stock", "error"); return; }
  const hayNuevas = FLYER_STATE.fotosExtrasBytes.some(b => b && b.length > 0);
  if (!hayNuevas) { toast("⚠️ No hay fotos extras nuevas para subir", "error"); return; }

  const btn = document.getElementById('flyerSaveExtrasBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Subiendo fotos extras...'; }

  const fotosPayload = FLYER_STATE.fotosExtrasBytes.map(function(b, i){
    if (!b) return null;
    return { nombre: `${FLYER_STATE.placa}_extra_${i+1}.jpg`, tipo: 'image/jpeg', bytes: b };
  });

  google.script.run
    .withSuccessHandler(function(r){
      if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar fotos extras del catálogo en Drive'; }
      if (r && r.exito) {
        // Marcar las que ahora están en Drive
        FLYER_STATE.fotosExtrasBytes.forEach(function(b, i){
          if (b) {
            FLYER_STATE.fotosExtrasDesdeDrive[i] = true;
            FLYER_STATE.fotosExtrasBytes[i] = '';
            flyerRefreshExtraSlot(i);
          }
        });
        toast("✅ Fotos extras guardadas en Drive y catálogo", "success");
      } else {
        toast("⚠️ Error: " + (r && r.error || 'desconocido'), "error");
      }
    })
    .withFailureHandler(function(err){
      if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar fotos extras del catálogo en Drive'; }
      toast("⚠️ Error: " + (err.message || err), "error");
    })
    .guardarFotosExtras({
      placa:  FLYER_STATE.placa,
      marca:  FLYER_STATE.marca,
      modelo: FLYER_STATE.modelo,
      fotos:  fotosPayload
    });
}

// ============================================================
// CARGA DE FOTOS DESDE DRIVE (con proxy base64 para CORS)
// ============================================================

function flyerCargarFotosDeDrive(placa) {
  if (!google?.script?.run) return;
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.exito) return;

    // 4 fotos del FLYER
    (r.fotos || []).forEach(function(url, i){
      if (!url || i > 3) return;
      google.script.run.withSuccessHandler(function(r2){
        if (r2 && r2.exito) {
          FLYER_STATE.fotos[i] = r2.dataUri;
          FLYER_STATE.fotosDesdeDrive[i] = true;
          FLYER_STATE.fotosBytes[i] = '';
          flyerRefreshPhotoSlot(i);
          flyerUpdate();
        }
      }).obtenerFotoComoBase64(url);
    });

    // 8 fotos EXTRAS del catálogo
    (r.fotosExtras || []).forEach(function(url, i){
      if (!url || i > 7) return;
      google.script.run.withSuccessHandler(function(r2){
        if (r2 && r2.exito) {
          FLYER_STATE.fotosExtras[i] = r2.dataUri;
          FLYER_STATE.fotosExtrasDesdeDrive[i] = true;
          FLYER_STATE.fotosExtrasBytes[i] = '';
          flyerRefreshExtraSlot(i);
        }
      }).obtenerFotoComoBase64(url);
    });

    const cuantas = (r.fotos || []).filter(Boolean).length + (r.fotosExtras || []).filter(Boolean).length;
    if (cuantas > 0) toast(`✅ ${cuantas} foto${cuantas>1?'s':''} cargada${cuantas>1?'s':''} desde Drive`, "success");
  }).obtenerFotosVehiculo(placa);
}

// ============================================================
// GUARDAR FOTOS EN DRIVE (botón explícito)
// ============================================================

function flyerSavePhotosToDrive() {
  if (!FLYER_STATE.placa) { toast("⚠️ Selecciona primero un vehículo del stock", "error"); return; }
  const hayNuevas = FLYER_STATE.fotosBytes.some(b => b && b.length > 0);
  if (!hayNuevas) { toast("⚠️ No hay fotos nuevas para subir", "error"); return; }

  const btn = document.getElementById('flyerSavePhotosBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Subiendo fotos a Drive...'; }

  const fotosPayload = FLYER_STATE.fotosBytes.map(function(b, i){
    if (!b) return null;
    return { nombre: `${FLYER_STATE.placa}_slot${i}.jpg`, tipo: 'image/jpeg', bytes: b };
  });

  google.script.run
    .withSuccessHandler(function(r){
      if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar fotos en Drive (por placa)'; }
      if (r && r.exito) {
        r.fotos.forEach(function(url, i){
          if (url) {
            FLYER_STATE.fotosDesdeDrive[i] = true;
            FLYER_STATE.fotosBytes[i] = '';
            flyerRefreshPhotoSlot(i);
          }
        });
        toast("✅ Fotos guardadas en Drive", "success");

async function flyerCapturarCanvas() {
  const node = document.getElementById('flyerCanvas');
  if (!node) throw new Error('No se encontró el canvas');

  // Esperar a que la fuente Montserrat esté cargada
  if (document.fonts && document.fonts.ready) {
    try {
      await document.fonts.ready;
      await Promise.all([
        document.fonts.load('900 78px Montserrat'),
        document.fonts.load('900 82px Montserrat'),
        document.fonts.load('700 17px Montserrat'),
        document.fonts.load('700 14px Montserrat')
      ]).catch(() => {});
    } catch(e) {}
  }

  const wrap = document.getElementById('flyerScaleWrap');
  const originalTransform = wrap.style.transform;
  const originalOrigin    = wrap.style.transformOrigin;

  wrap.style.transform       = 'none';
  wrap.style.transformOrigin = 'top left';

  // Forzar reflow
  void node.offsetWidth;
  void node.offsetHeight;
  await new Promise(r => requestAnimationFrame(r));
  await new Promise(r => requestAnimationFrame(r));
  await new Promise(r => setTimeout(r, 250));

  try {
    // ════════════════════════════════════════════════════════════
    // ESTRATEGIA NUEVA: html-to-image (renderer via SVG foreignObject)
    // Es MUCHO más fiel al navegador que html2canvas porque embeve el
    // HTML/CSS real dentro de un SVG. No re-implementa CSS manualmente.
    // Si falla → fallback a html2canvas (peor pero funcional).
    // ════════════════════════════════════════════════════════════
    let dataUrl = null;
    let usedFallback = false;

    if (typeof htmlToImage !== 'undefined' && htmlToImage.toPng) {
      try {
        dataUrl = await htmlToImage.toPng(node, {
          width:           1080,
          height:          1920,
          pixelRatio:      2,
          backgroundColor: '#0a0a0a',
          cacheBust:       true,
          fontEmbedCSS:    '',   // las fuentes ya están en el documento
          skipAutoScale:   true,
          style: {
            // garantizar dimensiones exactas durante captura
            transform:       'none',
            transformOrigin: 'top left',
            width:           '1080px',
            height:          '1920px'
          }
        });
      } catch (errHTI) {
        console.warn('html-to-image falló, usando fallback html2canvas:', errHTI);
        usedFallback = true;
      }
    } else {
      usedFallback = true;
    }

    // Convertir el dataUrl a un canvas (para mantener la API existente)
    if (dataUrl && !usedFallback) {
      const img = new Image();
      img.src = dataUrl;
      await new Promise((resolve, reject) => {
        img.onload  = resolve;
        img.onerror = reject;
      });
      const canvas = document.createElement('canvas');
      canvas.width  = img.naturalWidth;
      canvas.height = img.naturalHeight;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(img, 0, 0);
      return canvas;
    }

    // Fallback: html2canvas
    return await html2canvas(node, {
      width:        1080,
      height:       1920,
      scale:        2,
      useCORS:      true,
      allowTaint:   false,
      backgroundColor: '#0a0a0a',
      logging:      false,
      imageTimeout: 0,
      x:            0,
      y:            0,
      scrollX:      0,
      scrollY:      -window.scrollY,
      windowWidth:  1080,
      windowHeight: 1920
    });

  } finally {
    wrap.style.transform       = originalTransform;
    wrap.style.transformOrigin = originalOrigin;
  }
}

// ════════════════════════════════════════════════════════════════
// flyerBuildServerPayload — construye el JSON que enviamos al endpoint
// de Vercel (Puppeteer renderiza con Chrome real).
// Para fotos: si hay bytes en base64 (recién subidas), las convertimos a
// data URI; si solo hay URL de Drive, mandamos la URL.
// ════════════════════════════════════════════════════════════════
function flyerBuildServerPayload() {
  const s = FLYER_STATE;

  function fotoToSrc(i) {
    if (s.fotosBytes && s.fotosBytes[i]) {
      // base64 sin prefijo → construir data URI
      const b = s.fotosBytes[i];
      return b.startsWith('data:') ? b : ('data:image/jpeg;base64,' + b);
    }
    return s.fotos && s.fotos[i] ? s.fotos[i] : '';
  }

  return {
    marca:         s.marca || '',
    modelo:        s.modelo || '',
    version:       s.version || '',
    anio:          s.anio || '',
    km:            s.km || '',
    transmision:   s.transmision || '',
    motor:         s.motor || '',
    traccion:      s.traccion || '',
    combustible:   s.combustible || '',
    pasajeros:     s.pasajeros || '',
    precio:        s.precio || '',
    placa:         s.placa || '',
    tagOferta:     s.tagOferta || 'OFERTA',
    fotoPrincipal: fotoToSrc(0),
    galeria:       [fotoToSrc(1), fotoToSrc(2), fotoToSrc(3)].filter(x => x),
    whatsapp:      s.phone || FLYER_DEFAULT_PHONE,
    email:         'lcdgroupsac@gmail.com',
    instagram:     s.instagram || FLYER_DEFAULT_INSTAGRAM,
    brandName:     'LCD GROUP',
    brandTagline:  'AUTOMOTRIZ',
    logoUrl:       'https://drive.google.com/thumbnail?id=19FylJ0QVp0DwCqmMVgrjKcBP-VkRE0Jc&sz=w400'
  };
}

// ════════════════════════════════════════════════════════════════
// flyerRenderServerSide — llama al endpoint de Vercel y devuelve un
// Blob con el PNG renderizado por Chrome headless real.
// ════════════════════════════════════════════════════════════════
async function flyerRenderServerSide() {
  if (!FLYER_RENDER_URL || FLYER_RENDER_URL.indexOf('TU-PROYECTO') !== -1) {
    throw new Error('FLYER_RENDER_URL no configurada');
  }
  const payload = flyerBuildServerPayload();
  const res = await fetch(FLYER_RENDER_URL, {
    method:  'POST',
    headers: { 'Content-Type': 'application/json' },
    body:    JSON.stringify(payload)
  });
  if (!res.ok) {
    let msg = 'HTTP ' + res.status;
    try {
      const j = await res.json();
      if (j && j.error) msg += ': ' + j.error;
    } catch(e) {}
    throw new Error(msg);
  }
  return await res.blob();
}

async function flyerDownloadOnly() {
  const btn = document.getElementById('flyerBtnDownload');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Generando...'; }
  try {
    // ESTRATEGIA 1 (preferida): renderizar en servidor con Chrome real
    let downloaded = false;
    try {
      const blob = await flyerRenderServerSide();
      const url  = URL.createObjectURL(blob);
      const link = document.createElement('a');
      link.download = `flyer_${FLYER_STATE.placa||'auto'}_${new Date().toISOString().slice(0,10)}.png`;
      link.href = url;
      link.click();
      setTimeout(() => URL.revokeObjectURL(url), 5000);
      toast("✅ Flyer descargado (renderizado en servidor)", "success");
      downloaded = true;
    } catch (errServer) {
      console.warn('Render servidor falló, usando cliente:', errServer);
      toast("⚠️ Render servidor falló, usando cliente...", "error");
    }

    // ESTRATEGIA 2 (fallback): renderizar en el cliente con html-to-image
    if (!downloaded) {
      const canvas = await flyerCapturarCanvas();
      const link = document.createElement('a');
      link.download = `flyer_${FLYER_STATE.placa||'auto'}_${new Date().toISOString().slice(0,10)}.png`;
      link.href = canvas.toDataURL('image/png');
      link.click();
      toast("✅ Flyer descargado (cliente)", "success");
    }
  } catch(err) {
    toast("⚠️ Error: " + (err.message||err), "error");
    console.error(err);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '⬇ Solo descargar'; }
  }
}

async function flyerGenerateAndSave() {
  if (!FLYER_STATE.placa) { toast("⚠️ Selecciona un vehículo primero", "error"); return; }
  const btn = document.getElementById('flyerBtnSave');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Generando...'; }
  try {
    const canvas = await flyerCapturarCanvas();
    const dataUri = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `flyer_${FLYER_STATE.placa}_${new Date().toISOString().slice(0,10)}.png`;
    link.href = dataUri;
    link.click();
    if (btn) btn.innerHTML = '⏳ Subiendo a Drive...';
    google.script.run
      .withSuccessHandler(function(r){
        if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
        if (r && r.exito) toast("✅ Flyer descargado y guardado en Drive", "success");
        else toast("⚠️ Descargado pero error en Drive: " + (r && r.error || ''), "error");
      })
      .withFailureHandler(function(err){
        if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
        toast("⚠️ Descargado pero error en Drive: " + (err.message||err), "error");
      })
      .guardarFlyerGenerado({
        placa: FLYER_STATE.placa,
        marca: FLYER_STATE.marca,
        modelo: FLYER_STATE.modelo,
        imageBase64: dataUri
      });
  } catch(err) {
    if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
    toast("⚠️ Error: " + (err.message||err), "error");
    console.error(err);
  }
}

  if (_syncInFlight) {

    return;
  }
  _syncInFlight = true;
  cargando = true;
  showLoader(true);
  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(d => { _syncInFlight = false; procesarDatos(d); })
      .withFailureHandler(e => { _syncInFlight = false; errorCarga(e); })
      .obtenerDatos("Inventario_Stock");
  } else {
    setTimeout(()=>{
      _syncInFlight = false;
      errorCarga({message:"google.script.run no disponible (modo preview). La app funcionará al desplegarla en Google Apps Script."});
    }, 800);
  }
}

function procesarDatos(data) {
  try {
    if(!data) data = {};
    if(Array.isArray(data)) {
      vehs = data.map(normalizarVehiculo);
      clis = [];
    } else {
      vehs = (data.vehiculos || data.inventario || []).map(normalizarVehiculo);
      clis = (data.clientes || data.crm || []).map(normalizarCliente);
    }
    if (typeof invalidarMemos === 'function') invalidarMemos();  // Pack B: cache bust
    cargando = false;
    showLoader(false);
    render();
    toast(`✅ ${vehs.length} vehículos · ${clis.length} clientes`, "success");
    // Callback de un solo uso (ej. tras confirmar compra → mostrar compradores compatibles)
    if (typeof _postSyncCallback === 'function') {
      const cb = _postSyncCallback;
      _postSyncCallback = null;
      try { cb(); } catch(e) { console.warn('postSync cb error', e); }
    }
  } catch(err) {
    errorCarga(err);
  }
}
let _postSyncCallback = null;

function errorCarga(err) {
  cargando = false;
  showLoader(false);
  console.error("Error de carga:", err);
  vehs = [];
  clis = [];
  render();
  toast("⚠️ " + (err.message || "Error al conectar con Google Sheets"), "error");
}

function parseFecha(v) {
  if(!v) return "";
  if(typeof v === "string") {
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.split("T")[0];
    const p = v.split("/");
    if(p.length === 3) {
      let [d,m,y] = p;
      if(y.length === 2) y = "20"+y;
      return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    }
    return "";
  }
  try {
    return new Date(v).toISOString().split("T")[0];
  } catch { return ""; }
}

    Pasajeros: v.pasajeros || 5,
    Pantalla: v.pantalla || "",
    Descripcion_Publica: v.descripcionPublica || ""
  };
  // Si el usuario NO ve finanzas (tasador), sus datos vienen sin costos y la
  // normalización los convirtió en 0. NO se envían: al omitirlos, el backend
  // PRESERVA los costos/utilidad reales del Sheet (nunca los pisa con 0).
  if (typeof verFinanzas === "function" && !verFinanzas()) {
    ["Comision", "Costo_Inspeccion", "Gastos_Notaria", "Gasto_Firma",
     "Costo_Compra", "Retoques", "Gasto_Combustible", "Gasto_Lavado",
     "Gastos_Cochera", "Otros_Gastos", "Descripcion_de_Gastos"
    ].forEach(k => delete out[k]);
  }
  return out;
}

function toast(msg, type="success") {

const today = () => new Date().toISOString().split("T")[0];
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("es-PE") : "—";
const diffDays = (a,b) => Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
const money = n => "$ " + parseFloat(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const calcCostoTotal = v => [v.costoCompra,v.comision,v.costoInspeccion,v.gastosNotaria,v.gastoFirma,v.retoques,v.gastoCombustible,v.gastoLavado,v.gastosCochera,v.otrosGastos].reduce((s,x)=>s+(parseFloat(x)||0),0);

const calcDiasStock = v => {
  if(!v.fechaPublicacion) return null;
  const fin = v.estado==="Vendido"&&v.fechaVenta ? v.fechaVenta : today();
  return diffDays(v.fechaPublicacion, fin);
};

const calcUtilidad = v => {
  const ct = calcCostoTotal(v);
  if(parseFloat(v.precioVenta)>0) return {val:parseFloat(v.precioVenta)-ct,tipo:"real"};
  if(parseFloat(v.precioPublicacion)>0) return {val:parseFloat(v.precioPublicacion)-ct,tipo:"proyectada"};
  return null;
};

const getCarroceria = v => CARROCERIA_MAP[v.modelo] || "Sedán";

function matchScore(cli, veh) {
  if(parseFloat(veh.precioPublicacion) > parseFloat(cli.presupuesto)) return null;
  if(parseInt(cli.ranioMin) > parseInt(veh.anio) || parseInt(cli.ranioMax) < parseInt(veh.anio)) return null;
  let score = 0;
  const flags = [];
  if(cli.marcaBusca === veh.marca || cli.marcaBusca === "Indiferente") { score += 30; flags.push("✅ Marca"); }
  if(!cli.modeloBusca || cli.modeloBusca.toLowerCase() === veh.modelo.toLowerCase()) { score += 20; flags.push("✅ Modelo"); }
  if(cli.transmisionDesea === veh.transmision || cli.transmisionDesea === "Indiferente") { score += 20; flags.push("✅ Transmisión"); }
  if(cli.carroceria === getCarroceria(veh) || cli.carroceria === "Indiferente") { score += 15; flags.push("✅ Carrocería"); }
  if(parseFloat(veh.precioPublicacion) <= parseFloat(cli.presupuesto)*0.95) { score += 15; flags.push("✅ Precio ok"); }
  return score >= 50 ? {score, flags} : null;
}

function findMatchesForVeh(veh) {
  if(!["Disponible","Publicado"].includes(veh.estado)) return [];
  return clis
    .filter(c => ["Caliente","Tibio"].includes(c.status))
    .map(c => {
      const r = matchScore(c, veh);
      return r ? {cliente:c, score:r.score, flags:r.flags} : null;
    })
    .filter(Boolean)
    .sort((a,b) => {
      const o = {Caliente:0, Tibio:1};
      return (o[a.cliente.status]??2) - (o[b.cliente.status]??2) || b.score - a.score;
    });
}

function findMatchesForCli(cli) {
  if(!["Caliente","Tibio"].includes(cli.status)) return [];
  return vehs
    .filter(v => ["Disponible","Publicado"].includes(v.estado))
    .map(v => {
      const r = matchScore(cli, v);
      return r ? {vehiculo:v, score:r.score, flags:r.flags} : null;
    })
    .filter(Boolean)
    .sort((a,b) => b.score - a.score);
}

// ────────────── RENDER PRINCIPAL ──────────────
function render() {
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === currentTab);
  });
  if (typeof centrarTabActiva === "function") centrarTabActiva();

  const alertasSOAT = vehs.filter(v=>v.soat && diffDays(today(),v.soat)>=0 && diffDays(today(),v.soat)<=30);
  const alertasRev = vehs.filter(v=>v.revTecnica && diffDays(today(),v.revTecnica)>=0 && diffDays(today(),v.revTecnica)<=30);
  const alertasCli = clis.filter(c=>["Caliente","Tibio"].includes(c.status) && c.fechaUltimoContacto && diffDays(c.fechaUltimoContacto,today())>=7);
  const totalAlertas = alertasSOAT.length + alertasRev.length + alertasCli.length;
  const ab = document.getElementById("alertBadge");
  if(totalAlertas > 0) {
    ab.classList.remove("hidden");
    ab.textContent = `🔔 ${totalAlertas}`;
    ab.onclick = () => { currentTab = "dashboard"; render(); };
  } else {
    ab.classList.add("hidden");
  }

  const content = window.content = document.getElementById("content");
  // RBAC: si la pestaña actual no está permitida para el rol → forzar la primera permitida
  if(usuarioActual && !tabPermitido(currentTab)) {
    const t = tabsPermitidos();
    currentTab = (Array.isArray(t) && t.length) ? t[0] : "inspeccion";
  }
  // Técnico: su única pestaña es inspección (atajo para no evaluar el resto)
  if(usuarioActual && usuarioActual.rol === "tecnico") {
    currentTab = "inspeccion";
    content.innerHTML = renderInspeccion();
    initInspeccion();
    return;
  }
  if(vehs.length === 0 && clis.length === 0 && !cargando && currentTab !== "tasadora" && currentTab !== "cotizaciones" && currentTab !== "inspeccion" && currentTab !== "flyer" && currentTab !== "performance" && currentTab !== "auditoria" && currentTab !== "red" && currentTab !== "nomina") {
    content.innerHTML = renderEmpty();
    return;
  }
  if(currentTab === "dashboard") content.innerHTML = renderDashboard(alertasSOAT, alertasRev, alertasCli);
  else if(currentTab === "inventario") content.innerHTML = renderInventario();
  else if(currentTab === "crm") content.innerHTML = renderCRM();
  else if(currentTab === "matches") content.innerHTML = renderMatches();
  else if(currentTab === "tasadora") content.innerHTML = renderTasadora();
  else if(currentTab === "cotizaciones") {
    content.innerHTML = renderCotizaciones();
    // CRITICAL: NO llamar cargarCotizaciones() acá. Genera recursión infinita
    // porque cargarCotizaciones() hace render() que vuelve a este branch.
    // La carga inicial se hace UNA vez al cambiar de tab (setTab) o con el botón Recargar.
  }
  else if(currentTab === "performance") content.innerHTML = renderPerformance();
  else if(currentTab === "auditoria")  content.innerHTML = renderAuditoria();
  else if(currentTab === "inspeccion") { content.innerHTML = renderInspeccion(); initInspeccion(); }
  else if(currentTab === "flyer")      { content.innerHTML = renderFlyer();      initFlyer();      }
  else if(currentTab === "red")        { content.innerHTML = renderRed();        initRed();        }
  else if(currentTab === "nomina")     { content.innerHTML = renderNomina();     initNomina();     }
}

function calcularOferta(d) {
  const valorComercial = parseFloat(d.valorComercial) || 0;
  const reacond = parseFloat(d.costoReacondicionamiento) || 0;
  const cargas = parseFloat(d.cargasLegales) || 0;
  const margen = parseFloat(d.margenGanancia) || 0;

  const totalDeducciones = reacond + cargas;
  const utilidadNeta = valorComercial * (margen / 100);
  const precioMaxOferta = valorComercial - totalDeducciones - utilidadNeta;
  const inversionTotal = precioMaxOferta + totalDeducciones;

  return { valorComercial, reacond, cargas, totalDeducciones, utilidadNeta, precioMaxOferta, inversionTotal, margen };
}

// Actualización en tiempo real sin re-renderizar todo (no pierde foco en inputs)
function actualizarResultados() {
  const r = calcularOferta(tasadoraData);
  const ofertaInvalida = r.precioMaxOferta <= 0 && r.valorComercial > 0;

  const hero = document.getElementById("heroOferta");
  const display = document.getElementById("precioMaxDisplay");
  const subtext = document.getElementById("ofertaSubtext");
  if(!hero || !display) return;

  hero.className = `bg-gradient-to-br ${ofertaInvalida?'from-red-900/60 to-red-950/40 border-red-500/60':'from-emerald-900/60 to-blue-900/40 border-emerald-500/60'} border-2 rounded-2xl p-6 shadow-2xl shadow-emerald-500/10`;
  display.className = `text-5xl md:text-6xl font-black ${ofertaInvalida?'text-red-300':'text-white'} tracking-tight`;
  display.style.textShadow = `0 0 30px ${ofertaInvalida?'rgba(239,68,68,0.4)':'rgba(16,185,129,0.4)'}`;
  display.textContent = money(r.precioMaxOferta);
  subtext.className = `text-xs mt-3 ${ofertaInvalida?'text-red-400':'text-emerald-200/80'}`;
  subtext.textContent = ofertaInvalida ? '⚠️ La operación no es rentable con estos parámetros' : 'Este es el máximo que puedes pagar por el vehículo.';

  document.getElementById("desgValorComercial").textContent = money(r.valorComercial);
  document.getElementById("desgReacond").textContent = "−"+money(r.reacond);
  document.getElementById("desgCargas").textContent = "−"+money(r.cargas);
  document.getElementById("desgDeducciones").textContent = "−"+money(r.totalDeducciones);
  document.getElementById("desgUtilidad").textContent = money(r.utilidadNeta);
  document.getElementById("desgMargen").textContent = r.margen;
  document.getElementById("desgInversion").textContent = money(r.inversionTotal);
}

// Guarda la tasación en el pipeline con el estado inicial elegido
function guardarEnPipeline(estadoInicial) {
  const r = calcularOferta(tasadoraData);
  if(!tasadoraData.placa) { toast("⚠️ Ingresa la placa del vehículo", "error"); return; }
  if(r.valorComercial <= 0) { toast("⚠️ Ingresa el valor comercial", "error"); return; }
  if (estadoInicial === 'En Inspección') {
    confirmAccion({
      title: 'Pasar a inspección',
      message: `El cliente aceptó. ${tasadoraData.placa} entra a inspección de taller. Podrás fijar el precio final desde el Flujo de Ventas.`,
      confirmText: '🔧 Sí, a inspección',
      icon: '🔧'
    }).then(ok => { if (ok) enviarTasacion(r, estadoInicial); });
  } else {
    enviarTasacion(r, estadoInicial);
  }
}

let _tasacionEnVuelo = false;
function enviarTasacion(r, estado) {
  if (_tasacionEnVuelo) return;  // Evita doble-click
  _tasacionEnVuelo = true;
  document.querySelectorAll('[onclick*="guardarEnPipeline"]').forEach(b => b.disabled = true);

  const payload = {
    placa: tasadoraData.placa,
    marca: tasadoraData.marca,
    modelo: tasadoraData.modelo,
    version: tasadoraData.version,
    anio: tasadoraData.anio,
    km: tasadoraData.km,
    transmision: tasadoraData.transmision,
    traccion: tasadoraData.traccion,
    motor: tasadoraData.motor,
    cliNombre: tasadoraData.cliNombre,
    cliCelular: tasadoraData.cliCelular,
    cliNotas: tasadoraData.cliNotas,
    valorComercial: tasadoraData.valorComercial,
    costoReacondicionamiento: tasadoraData.costoReacondicionamiento,
    cargasLegales: tasadoraData.cargasLegales,
    margenGanancia: tasadoraData.margenGanancia,
    totalDeducciones: r.totalDeducciones,
    utilidadNeta: r.utilidadNeta,
    precioMaxOferta: r.precioMaxOferta,
    inversionTotal: r.inversionTotal,
    estado: estado,
    usuario: usuarioActual ? usuarioActual.nombre : ""
  };

  const unlock = () => {
    _tasacionEnVuelo = false;
    document.querySelectorAll('[onclick*="guardarEnPipeline"]').forEach(b => b.disabled = false);
  };

  if(typeof google !== "undefined" && google.script && google.script.run) {
    toast("Guardando en Google Sheets...", "success");
    google.script.run
      .withSuccessHandler(result => {
        unlock();
        toast(`✅ ${estado} guardada: ${tasadoraData.placa}`, "success");
        tasadoraData = {placa:"",marca:"",modelo:"",version:"",anio:"",km:0,transmision:'',traccion:'',motor:'',cliNombre:'',cliCelular:'',cliNotas:'',valorComercial:0,costoReacondicionamiento:0,cargasLegales:0,margenGanancia:15};
        render();
      })
      .withFailureHandler(err => {
        unlock();
        toast("⚠️ Error: " + (err.message || err), "error");
      })
      .guardarTasacion(payload);
  } else {
    unlock();
    toast("⚠️ Modo preview", "error");
  }
}

// ────────────── MÓDULO PIPELINE DE COMPRAS (EMBUDO) ──────────────
let cotizaciones = [];
let cotizacionesCargando = false;
let filtroCotizaciones = "Todas";

// Definición del embudo: orden, label, color, icono
const EMBUDO_ESTADOS = [
  { key: 'Cotización',     label: 'Cotización',     icon: '🆕', color: '#38bdf8' },
  { key: 'En Seguimiento', label: 'En Seguimiento', icon: '⏰', color: '#f59e0b' },
  { key: 'En Inspección',  label: 'En Inspección',  icon: '🔧', color: '#a855f7' },
  { key: 'Precio Final',   label: 'Precio Final',   icon: '💰', color: '#eab308' },
  { key: 'Comprada',       label: 'Comprada',       icon: '✅', color: '#22c55e' },
  { key: 'Descartada',     label: 'Descartada',     icon: '❌', color: '#ef4444' }
];

// Normaliza estados viejos ("Aprobada") al nuevo vocabulario
function _normalizarEstadoEmbudo(estado) {
  const e = String(estado || '').trim();
  if (e === 'Aprobada') return 'Comprada';
  if (!e) return 'Cotización';
  // Si ya es uno de los 6, respetarlo
  if (EMBUDO_ESTADOS.some(s => s.key === e)) return e;
  return 'Cotización';  // default para valores desconocidos
}

function renderCotizaciones() {
  let html = `<div class="max-w-full mx-auto">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <div>
        <h1 class="page-heading">📋 Flujo de Ventas</h1>
        <p class="text-slate-500 text-sm mt-1">Embudo de operaciones de compra. Haz clic en una tarjeta para avanzarla de etapa.</p>
      </div>
      <button onclick="cargarCotizaciones()" class="text-slate-400 hover:text-sky-400 text-xs font-semibold px-3 py-1.5 rounded-lg" style="background:rgba(255,255,255,.03);border:1px solid var(--c-border);">🔄 Recargar</button>
    </div>`;

  if (cotizacionesCargando) {
    html += `<div class="text-center py-12"><div class="spinner mx-auto mb-3"></div><div class="text-slate-500 text-sm">Cargando flujo de ventas...</div></div></div>`;
    return html;
  }

  if (cotizaciones.length === 0) {
    html += `<div class="card-flat py-12 px-6 text-center">
      <div class="text-5xl mb-3 opacity-50">📭</div>
      <div class="text-slate-300 font-semibold mb-1">Sin operaciones en el flujo de ventas</div>
      <div class="text-slate-500 text-sm mb-4">Ve a <b>💵 Compras</b> para registrar la primera tasación.</div>
      <button onclick="setTab('tasadora')" class="btn-primary">💵 Ir a Compras</button>
    </div></div>`;
    return html;
  }

  // Agrupar por estado normalizado
  const porEstado = {};
  EMBUDO_ESTADOS.forEach(s => porEstado[s.key] = []);
  cotizaciones.forEach(c => {
    const est = _normalizarEstadoEmbudo(c.Estado);
    if (!porEstado[est]) porEstado[est] = [];
    porEstado[est].push(c);
  });

  // Resumen (KPIs de las columnas activas)
  const activos = porEstado['Cotización'].length + porEstado['En Seguimiento'].length +
                  porEstado['En Inspección'].length + porEstado['Precio Final'].length;
  html += `<div class="flex gap-3 mb-4 flex-wrap text-xs">
    <span class="text-slate-400">🔥 <b class="text-sky-400">${activos}</b> operaciones activas</span>
    <span class="text-slate-400">✅ <b class="text-emerald-400">${porEstado['Comprada'].length}</b> compradas</span>
    <span class="text-slate-400">❌ <b class="text-red-400">${porEstado['Descartada'].length}</b> descartadas</span>
  </div>`;

  // Tablero Kanban con scroll horizontal
  html += `<div class="overflow-x-auto pb-3"><div class="flex gap-3" style="min-width:max-content;">`;
  EMBUDO_ESTADOS.forEach(s => {
    const cards = porEstado[s.key] || [];
    html += `<div class="flex-shrink-0" style="width:260px;">
      <div class="flex items-center justify-between mb-2 px-1">
        <span class="text-xs font-bold" style="color:${s.color}">${s.icon} ${s.label}</span>
        <span class="text-[10px] font-bold px-2 py-0.5 rounded-full" style="background:${s.color}22;color:${s.color}">${cards.length}</span>
      </div>
      <div class="space-y-2" style="min-height:60px;">
        ${cards.length === 0
          ? `<div class="text-center text-slate-600 text-[11px] py-4 rounded-lg" style="border:1px dashed var(--c-border);">vacío</div>`
          : cards.map(c => _embudoCardHTML(c, s)).join('')}
      </div>
    </div>`;
  });
  html += `</div></div></div>`;
  return html;
}

function _embudoCardHTML(c, estadoDef) {
  const cliNombre  = c.Cli_Nombre  || '';
  const cliCelular = c.Cli_Celular || '';
  const km         = c.KM || 0;
  const idOp       = c.ID_Operacion || c._rowIndex || '';
  const oferta     = Number(c.Precio_Maximo_Oferta) || 0;
  const precioFinal = Number(c.Precio_Final_Compra) || 0;
  const veh = `${escHtml(c.Marca||'')} ${escHtml(c.Modelo||'')}`.trim() || '(sin vehículo)';

  return `<div onclick="abrirEmbudoCard('${escAttr(idOp)}')" class="card-elevated p-3 cursor-pointer" style="border-left:3px solid ${estadoDef.color};">
    <div class="font-bold text-sm text-slate-100 truncate">${veh}</div>
    <div class="text-slate-500 text-[11px] mb-1.5">${escHtml(c.Anio||'')} ${c.Placa?'· '+escHtml(c.Placa):''} ${km?'· '+parseInt(km).toLocaleString()+'km':''}</div>
    ${cliNombre
      ? `<div class="text-[11px] text-slate-300 truncate">👤 ${escHtml(cliNombre)}</div>`
      : `<div class="text-[11px] text-slate-600 italic">sin cliente</div>`}
    <div class="flex items-center justify-between mt-2">
      <span class="text-[10px] text-slate-500">${estadoDef.key==='Comprada'&&precioFinal>0?'Compra:':'Oferta máx:'}</span>
      <span class="text-xs font-bold" style="color:${estadoDef.color}">${money(estadoDef.key==='Comprada'&&precioFinal>0?precioFinal:oferta)}</span>
    </div>
  </div>`;
}

let _cotInFlight = false;  // Mutex que previene re-entrar si ya hay un fetch en curso
function cargarCotizaciones() {
  if (_cotInFlight) return;  // ya hay uno cargando → no dispares otro
  if(typeof google === "undefined" || !google.script || !google.script.run) {
    cotizaciones = [];
    cotizacionesCargando = false;
    return;
  }
  _cotInFlight = true;
  cotizacionesCargando = true;
  render();
  google.script.run
    .withSuccessHandler(data => {
      _cotInFlight = false;
      cotizaciones = data || [];
      cotizacionesCargando = false;
      render();
    })
    .withFailureHandler(err => {
      _cotInFlight = false;
      cotizacionesCargando = false;
      cotizaciones = [];
      toast("⚠️ No se pudieron cargar cotizaciones: " + (err.message||err), "error");
      render();
    })
    .listarOperaciones();
}

function eliminarCotizacion(idOrRow, placa) {
  confirmAccion({
    title: 'Eliminar cotización',
    message: `¿Eliminar la cotización de ${placa}? Esta acción no se puede deshacer.`,
    confirmText: '🗑 Eliminar',
    danger: true
  }).then(ok => {
    if (!ok) return;
    if(typeof google !== "undefined" && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(r => {
          if (r && r.exito === false) { toast("⚠️ " + r.error, "error"); return; }
          toast("✅ Cotización eliminada", "success");
          cargarCotizaciones();
        })
        .withFailureHandler(err=>toast("⚠️ Error: "+err, "error"))
        .eliminarTasacion(idOrRow);
    }
  });
}

const EMBUDO_TRANSICIONES = {
