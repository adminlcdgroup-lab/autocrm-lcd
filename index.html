<!-- ============================================================
     SHIM google.script.run para GitHub Pages
     Detecta entorno y usa fetch() si no estamos en Apps Script.
     ============================================================ -->
<script>
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbwwQl-hTnYJfLVGGXnkMtGWgdWe_5REXg8EWi252c6fdN1CijStRjQEMyxL2sIqggoE/exec';

(function() {
  // Si estamos dentro de Apps Script Web App, google.script.run ya existe → no hacer nada
  if (typeof google !== "undefined" && google.script && google.script.run) return;

  // Mapeo: nombre de función → { action en doGet/doPost, isGet, argName }
  const API_MAP = {
    'obtenerDatos':                       { action: 'datos',             isGet: true, ignoreArg: true },
    'listarOperaciones':                  { action: 'operaciones',       isGet: true },
    'obtenerFotosVehiculo':               { action: 'fotosVehiculo',     isGet: true, argName: 'placa' },
    'obtenerLogoLCD':                     { action: 'logoLCD',           isGet: true },
    'obtenerFotoComoBase64':              { action: 'fotoBase64',        isGet: true, argName: 'url' },
    'guardarVehiculo':                    { action: 'guardarVehiculo' },
    'guardarCliente':                     { action: 'guardarCliente' },
    'guardarTasacion':                    { action: 'guardarTasacion' },
    'guardarInspeccionYGenerarDocumento': { action: 'guardarInspeccion' },
    'eliminarTasacion':                   { action: 'eliminarTasacion' },
    'guardarFotosVehiculo':               { action: 'guardarFotosVehiculo' },
    'guardarFlyerGenerado':               { action: 'guardarFlyerGenerado' }
  };

  function fireRequest(fnName, arg, onSuccess, onFailure) {
    const cfg = API_MAP[fnName];
    if (!cfg) {
      console.warn('[gsRun shim] Función desconocida:', fnName);
      if (onFailure) onFailure({ message: 'Función desconocida: ' + fnName });
      return;
    }

    let req;
    if (cfg.isGet) {
      const params = new URLSearchParams();
      params.set('action', cfg.action);
      if (!cfg.ignoreArg && arg !== undefined && arg !== null) {
        params.set(cfg.argName || 'arg', String(arg));
      }
      req = fetch(APPS_SCRIPT_URL + '?' + params.toString(), { method: 'GET', redirect: 'follow' });
    } else {
      req = fetch(APPS_SCRIPT_URL, {
        method: 'POST',
        redirect: 'follow',
        body: JSON.stringify({ action: cfg.action, payload: arg })
      });
    }

    req
      .then(function(r) { return r.json(); })
      .then(function(result) {
        if (onSuccess) onSuccess(result);
      })
      .catch(function(err) {
        console.error('[gsRun shim] Error:', err);
        if (onFailure) onFailure(err);
      });
  }

  function createChain() {
    const ctx = { onSuccess: null, onFailure: null };
    const chain = {
      withSuccessHandler: function(fn) { ctx.onSuccess = fn; return chain; },
      withFailureHandler: function(fn) { ctx.onFailure = fn; return chain; }
    };
    return new Proxy(chain, {
      get: function(target, prop) {
        if (prop in target) return target[prop];
        if (typeof prop === 'symbol') return undefined;
        return function(arg) {
          fireRequest(prop, arg, ctx.onSuccess, ctx.onFailure);
        };
      }
    });
  }

  window.google = {
    script: {
      get run() { return createChain(); }
    }
  };

  console.log('[gsRun shim] Activo · usando fetch() → ' + APPS_SCRIPT_URL);
})();
</script>

            <div><label class="flyer-input-label">Tracción</label><input type="text" value="${FLYER_STATE.traccion}" oninput="FLYER_STATE.traccion=this.value.toUpperCase();this.value=FLYER_STATE.traccion;flyerUpdate()" placeholder="4X4"></div>

        <div class="overflow-hidden rounded-lg bg-slate-950 p-3" style="min-height:600px;">

}

function initFlyer() {
  if (!FLYER_STATE.logoDataUri && typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run.withSuccessHandler(function(r){
      if (r && r.exito) { FLYER_STATE.logoDataUri = r.dataUri; flyerUpdate(); }
    }).obtenerLogoLCD();
  }
  flyerBindEditableElements();
  setTimeout(flyerScalePreview, 100);
  window.addEventListener('resize', flyerScalePreview);
}

function flyerScalePreview() {
  const wrap = document.getElementById('flyerScaleWrap');
  if (!wrap) return;
  const parent = wrap.parentElement;
  if (!parent) return;
  const panelW = parent.clientWidth - 24;
  const scale  = Math.min(panelW / 1080, 0.45);
  wrap.style.transform = `scale(${scale})`;
  wrap.style.width  = '1080px';
  wrap.style.height = `${1920 * scale}px`;
  parent.style.height = `${1920 * scale + 24}px`;
}

function flyerBindEditableElements() {
  const tag = document.getElementById('fl-tag-oferta');
  if (tag) tag.addEventListener('input', () => { FLYER_STATE.tagOferta = tag.textContent || ''; });
  const precio = document.getElementById('fl-precio');
  if (precio) {
    precio.addEventListener('input', () => {
      const clean = (precio.textContent || '').replace(/[^\d]/g, '');
      FLYER_STATE.precio = clean;
    });
    precio.addEventListener('blur', () => { precio.textContent = flyerFormatPrecio(FLYER_STATE.precio); });
  }
}

function flyerVehOptions() {
  const stock = vehs.filter(v => ["Disponible","Publicado"].includes(v.estado));
  if (stock.length === 0) return '<option disabled>Sin vehículos en stock</option>';
  return stock.map(v => `<option value="${v.placa}">${v.marca} ${v.modelo} ${v.version||''} · ${v.anio} · ${v.placa}</option>`).join('');
}

function flyerSelectVehiculo(placa) {
  if (!placa) return;
  const v = vehs.find(x => String(x.placa).toUpperCase() === String(placa).toUpperCase());
  if (!v) return;

  FLYER_STATE.vehSeleccionado = v;
  FLYER_STATE.marca       = String(v.marca||'').toUpperCase();
  FLYER_STATE.modelo      = String(v.modelo||'').toUpperCase();
  FLYER_STATE.version     = String(v.version||'').toUpperCase();
  FLYER_STATE.anio        = String(v.anio||'');
  FLYER_STATE.km          = v.kilometraje ? Number(v.kilometraje).toLocaleString('en-US') + ' KM' : '';
  FLYER_STATE.motor       = flyerFormatMotor(v.motor);
  FLYER_STATE.placa       = v.placa || '';
  FLYER_STATE.transmision = flyerMapTransmision(v.transmision);
  FLYER_STATE.traccion    = flyerMapTraccion(v.traccion);
  FLYER_STATE.precio      = v.precioPublicacion ? String(v.precioPublicacion) : '';
  FLYER_STATE.fotos = ["", "", "", ""];
  FLYER_STATE.fotosBytes = ["", "", "", ""];
  FLYER_STATE.fotosDesdeDrive = [false, false, false, false];

  content.innerHTML = renderFlyer();
  initFlyer();
  document.getElementById('flyerVehSelect').value = placa;
  flyerCargarFotosDeDrive(placa);
}

function flyerFormatMotor(m) {
  if (!m) return '';
  const s = String(m).trim();
  if (/L|LITRO/i.test(s)) return s.toUpperCase();
  if (/^\d+(\.\d+)?$/.test(s)) return s + 'L';
  return s.toUpperCase();
}
function flyerMapTransmision(t) {
  if (!t) return '';
  const s = String(t).toUpperCase().trim();
  if (s === 'MT' || s === 'MANUAL') return 'MANUAL';
  if (s === 'AT' || s.includes('AUTO')) return 'AUTOMÁTICA';
  if (s === 'CVT') return 'CVT';
  return s;
}
function flyerMapTraccion(t) {
  if (!t) return '';
  const s = String(t).toUpperCase().trim();
  if (s === '4X2' || s === 'FWD') return '4X2';
  if (s === '4X4' || s === 'AWD') return '4X4';
  return s;
}
function flyerFormatPrecio(p) {
  const n = Number(String(p).replace(/[^\d]/g, ''));
  if (!n) return '___';
  return n.toLocaleString('en-US');
}

// ============================================================
// SLOTS DE FOTOS (formulario)
// ============================================================

function flyerPhotoSlotHTML(i) {
  const url = FLYER_STATE.fotos[i];
  const fromDrive = FLYER_STATE.fotosDesdeDrive[i];
  const label = FLYER_PHOTO_LABELS[i];
  const isMain = i === 0;
  const style = isMain
    ? 'aspect-ratio:9/16;min-height:240px;'
    : 'aspect-ratio:1/1;min-height:90px;';

  return `
    <div class="flyer-photo-slot" style="${style}" onclick="document.getElementById('flyerPhotoInput${i}').click()">
      <input type="file" id="flyerPhotoInput${i}" accept="image/*" onchange="flyerHandlePhotoUpload(event, ${i})">
      ${url
        ? `<img src="${url}" />${fromDrive?'<span class="flyer-photo-from-drive">DRIVE</span>':''}<button class="flyer-photo-remove" onclick="flyerRemovePhoto(event, ${i})">✕</button>`
        : `<div class="flyer-photo-slot-label">${label}${isMain?'<br><span style="font-size:9px;opacity:.6;">9:16 ideal</span>':''}</div>`
      }
    </div>`;
}

function flyerHandlePhotoUpload(event, i) {
  const file = event.target.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = function(e) {
    FLYER_STATE.fotos[i] = e.target.result;
    FLYER_STATE.fotosBytes[i] = (e.target.result.split(',')[1]) || '';
    FLYER_STATE.fotosDesdeDrive[i] = false;
    flyerRefreshPhotoSlot(i);
    flyerUpdate();
  };
  reader.readAsDataURL(file);
}

function flyerRemovePhoto(event, i) {
  event.stopPropagation();
  FLYER_STATE.fotos[i] = '';
  FLYER_STATE.fotosBytes[i] = '';
  FLYER_STATE.fotosDesdeDrive[i] = false;
  flyerRefreshPhotoSlot(i);
  flyerUpdate();
}

function flyerRefreshPhotoSlot(i) {
  const input = document.getElementById('flyerPhotoInput' + i);
  if (!input) return;
  const slot = input.parentElement;
  slot.outerHTML = flyerPhotoSlotHTML(i);
}

// ============================================================
// CARGA DE FOTOS DESDE DRIVE (con proxy base64 para CORS)
// ============================================================

function flyerCargarFotosDeDrive(placa) {
  if (!google?.script?.run) return;
  google.script.run.withSuccessHandler(function(r){
    if (!r || !r.exito || !r.fotos) return;
    r.fotos.forEach(function(url, i){
      if (!url || i > 3) return;
      // Convertir cada URL de Drive a base64 vía backend (resuelve CORS)
      google.script.run.withSuccessHandler(function(r2){
        if (r2 && r2.exito) {
          FLYER_STATE.fotos[i] = r2.dataUri;
          FLYER_STATE.fotosDesdeDrive[i] = true;
          FLYER_STATE.fotosBytes[i] = '';
          flyerRefreshPhotoSlot(i);
          flyerUpdate();
        }
      }).obtenerFotoComoBase64(url);
    });
    const cuantas = r.fotos.filter(Boolean).length;
    if (cuantas > 0) toast(`✅ ${cuantas} foto${cuantas>1?'s':''} cargada${cuantas>1?'s':''} desde Drive`, "success");
  }).obtenerFotosVehiculo(placa);
}

// ============================================================
// GUARDAR FOTOS EN DRIVE (botón explícito)
// ============================================================

function flyerSavePhotosToDrive() {
  if (!FLYER_STATE.placa) { toast("⚠️ Selecciona primero un vehículo del stock", "error"); return; }
  const hayNuevas = FLYER_STATE.fotosBytes.some(b => b && b.length > 0);
  if (!hayNuevas) { toast("⚠️ No hay fotos nuevas para subir", "error"); return; }

  const btn = document.getElementById('flyerSavePhotosBtn');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Subiendo fotos a Drive...'; }

  const fotosPayload = FLYER_STATE.fotosBytes.map(function(b, i){
    if (!b) return null;
    return { nombre: `${FLYER_STATE.placa}_slot${i}.jpg`, tipo: 'image/jpeg', bytes: b };
  });

  google.script.run
    .withSuccessHandler(function(r){
      if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar fotos en Drive (por placa)'; }
      if (r && r.exito) {
        r.fotos.forEach(function(url, i){
          if (url) {
            FLYER_STATE.fotosDesdeDrive[i] = true;
            FLYER_STATE.fotosBytes[i] = '';
            flyerRefreshPhotoSlot(i);
          }
        });
        toast("✅ Fotos guardadas en Drive", "success");
      } else {
        toast("⚠️ Error: " + (r && r.error || 'desconocido'), "error");
      }
    })
    .withFailureHandler(function(err){
      if (btn) { btn.disabled = false; btn.innerHTML = '💾 Guardar fotos en Drive (por placa)'; }
      toast("⚠️ Error: " + (err.message||err), "error");
    })
    .guardarFotosVehiculo({
      placa: FLYER_STATE.placa,
      marca: FLYER_STATE.marca,
      modelo: FLYER_STATE.modelo,
      fotos: fotosPayload
    });
}

function flyerUpdate() {
  const wrap = document.getElementById('flyerScaleWrap');
  if (!wrap) return;
  wrap.innerHTML = flyerCanvasHTML();
  flyerBindEditableElements();
  flyerScalePreview();
}

async function flyerCapturarCanvas() {
  const node = document.getElementById('flyerCanvas');
  if (!node) throw new Error('No se encontró el canvas');
  const wrap = document.getElementById('flyerScaleWrap');
  const originalTransform = wrap.style.transform;
  wrap.style.transform = 'none';
  try {
    const canvas = await html2canvas(node, {
      width: 1080, height: 1920, scale: 2,
      useCORS: true, allowTaint: false,
      backgroundColor: '#0a0a0a', logging: false, imageTimeout: 0
    });
    return canvas;
  } finally {
    wrap.style.transform = originalTransform;
  }
}

async function flyerDownloadOnly() {
  const btn = document.getElementById('flyerBtnDownload');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Generando...'; }
  try {
    const canvas = await flyerCapturarCanvas();
    const link = document.createElement('a');
    link.download = `flyer_${FLYER_STATE.placa||'auto'}_${new Date().toISOString().slice(0,10)}.png`;
    link.href = canvas.toDataURL('image/png');
    link.click();
    toast("✅ Flyer descargado", "success");
  } catch(err) {
    toast("⚠️ Error: " + (err.message||err), "error");
    console.error(err);
  } finally {
    if (btn) { btn.disabled = false; btn.innerHTML = '⬇ Solo descargar'; }
  }
}

async function flyerGenerateAndSave() {
  if (!FLYER_STATE.placa) { toast("⚠️ Selecciona un vehículo primero", "error"); return; }
  const btn = document.getElementById('flyerBtnSave');
  if (btn) { btn.disabled = true; btn.innerHTML = '⏳ Generando...'; }
  try {
    const canvas = await flyerCapturarCanvas();
    const dataUri = canvas.toDataURL('image/png');
    const link = document.createElement('a');
    link.download = `flyer_${FLYER_STATE.placa}_${new Date().toISOString().slice(0,10)}.png`;
    link.href = dataUri;
    link.click();
    if (btn) btn.innerHTML = '⏳ Subiendo a Drive...';
    google.script.run
      .withSuccessHandler(function(r){
        if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
        if (r && r.exito) toast("✅ Flyer descargado y guardado en Drive", "success");
        else toast("⚠️ Descargado pero error en Drive: " + (r && r.error || ''), "error");
      })
      .withFailureHandler(function(err){
        if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
        toast("⚠️ Descargado pero error en Drive: " + (err.message||err), "error");
      })
      .guardarFlyerGenerado({
        placa: FLYER_STATE.placa,
        marca: FLYER_STATE.marca,
        modelo: FLYER_STATE.modelo,
        imageBase64: dataUri
      });
  } catch(err) {
    if (btn) { btn.disabled = false; btn.innerHTML = '💾 Generar + Guardar'; }
    toast("⚠️ Error: " + (err.message||err), "error");
    console.error(err);
  }
}
</script>


<script>
// ────────────── CONSTANTES ──────────────
const MARCAS = ["Toyota","Hyundai","Kia","Nissan","Chevrolet","Ford","Honda","Mazda","Mitsubishi","Suzuki","Changan","Chery","Geely","Volkswagen","Otros"];
const COLORES = ["Blanco","Negro","Plata","Gris","Rojo","Azul","Beige","Verde","Otro"];
const TRANSMISIONES = ["Manual","Automático","CVT","Doble embrague","MT","AT"];
const TRACCIONES = ["4x2","4x4","AWD","FWD","RWD"];
const ESTADOS = ["Disponible","Publicado","Reservado","Vendido"];
const CARROCERIAS = ["Sedán","SUV","Hatchback","Pickup","Van","Coupé","Indiferente"];
const ORIGENES = ["Facebook","Instagram","TikTok","WhatsApp","Referido","Web","OLX","Otros"];
const PAGOS = ["Contado","Financiado","Por definir"];
const STATUS_CRM = ["Caliente","Tibio","Frío","Descartado"];
const STATUS_COLORS = { Caliente:"#ef4444", Tibio:"#f59e0b", "Frío":"#3b82f6", Descartado:"#6b7280" };
const STATUS_EMOJI = { Caliente:"🔴", Tibio:"🟡", "Frío":"❄️", Descartado:"⚫" };

const CARROCERIA_MAP = {
  "Rush":"SUV","Kicks":"SUV","Tracker":"SUV","Tucson":"SUV","Venue":"SUV","Xtrail":"SUV","Qashqai":"SUV",
  "CX3":"SUV","Outlander":"SUV","Captiva":"SUV","Territory":"SUV","CS35":"SUV","GX3 Pro":"SUV",
  "Sentra":"Sedán","Tiida":"Sedán","Sonic":"Sedán","Gol":"Sedán","Joy":"Sedán",
  "I20":"Hatchback","Agya":"Hatchback","Groove":"Hatchback","Beat":"Hatchback",
  "Colorado":"Pickup"
};

// ────────────── ESTADO (INICIA VACÍO) ──────────────
let vehs = [];
let clis = [];
let currentTab = "dashboard";
let filterEstado = "Todos";
let filterStatus = "Todos";
let searchVeh = "";
let searchCli = "";
let lastMatchVeh = null;
let lastMatches = [];
let cargando = true;

// ────────────── CONEXIÓN GOOGLE APPS SCRIPT ──────────────
function sincronizar() {
  cargando = true;
  showLoader(true);
  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(procesarDatos)
      .withFailureHandler(errorCarga)
      .obtenerDatos("Inventario_Stock");
  } else {
    setTimeout(()=>{
      errorCarga({message:"google.script.run no disponible (modo preview). La app funcionará al desplegarla en Google Apps Script."});
    }, 800);
  }
}

function procesarDatos(data) {
  try {
    if(!data) data = {};
    if(Array.isArray(data)) {
      vehs = data.map(normalizarVehiculo);
      clis = [];
    } else {
      vehs = (data.vehiculos || data.inventario || []).map(normalizarVehiculo);
      clis = (data.clientes || data.crm || []).map(normalizarCliente);
    }
    cargando = false;
    showLoader(false);
    render();
    toast(`✅ ${vehs.length} vehículos · ${clis.length} clientes`, "success");
  } catch(err) {
    errorCarga(err);
  }
}

function errorCarga(err) {
  cargando = false;
  showLoader(false);
  console.error("Error de carga:", err);
  vehs = [];
  clis = [];
  render();
  toast("⚠️ " + (err.message || "Error al conectar con Google Sheets"), "error");
}

// Convierte filas del Excel al formato interno (claves snake_case → camelCase)
function normalizarVehiculo(row) {
  return {
    id: row.id || row.ID || Date.now() + Math.random(),
    marca: row.Marca || row.marca || "",
    modelo: row.Modelo || row.modelo || "",
    version: row.Version || row.version || "",
    transmision: row.Transmision || row.transmision || "",
    traccion: row.Traccion || row.traccion || "",
    motor: row.Motor || row.motor || "",
    anio: parseInt(row["Año"] || row.anio || row.Anio || 0) || 0,
    kilometraje: parseInt(row.KM || row.kilometraje || 0) || 0,
    color: row.Color || row.color || "",
    placa: row.Placa || row.placa || "",
    soat: parseFecha(row.SOAT || row.soat),
    revTecnica: parseFecha(row.Revision_Tecnica || row.revTecnica),
    prenda: row.Prenda || row.prenda || "No",
    fechaCompra: parseFecha(row.Fecha_Compra || row.fechaCompra),
    comision: parseFloat(row.Comision || row.comision || 0) || 0,
    costoInspeccion: parseFloat(row.Costo_Inspeccion || row.costoInspeccion || 0) || 0,
    gastosNotaria: parseFloat(row.Gastos_Notaria || row.gastosNotaria || 0) || 0,
    gastoFirma: parseFloat(row.Gasto_Firma || row.gastoFirma || 0) || 0,
    costoCompra: parseFloat(row.Costo_Compra || row.costoCompra || 0) || 0,
    retoques: parseFloat(row.Retoques || row.retoques || 0) || 0,
    gastoCombustible: parseFloat(row.Gasto_Combustible || row.gastoCombustible || 0) || 0,
    gastoLavado: parseFloat(row.Gasto_Lavado || row.gastoLavado || 0) || 0,
    gastosCochera: parseFloat(row.Gastos_Cochera || row.gastosCochera || 0) || 0,
    otrosGastos: parseFloat(row.Otros_Gastos || row.otrosGastos || 0) || 0,
    precioVenta: parseFloat(row.Precio_Venta || row.precioVenta || 0) || 0,
    fechaPublicacion: parseFecha(row.Fecha_Publicacion || row.fechaPublicacion),
    precioPublicacion: parseFloat(row.Precio_Publicacion || row.precioPublicacion || 0) || 0,
    fechaVenta: parseFecha(row.Fecha_Venta || row.fechaVenta),
    descripcionGastos: row.Descripcion_de_Gastos || row.descripcionGastos || "",
    comentarios: row.Comentario || row.comentarios || "",
    estado: row.Estado || row.estado || "Disponible",
    combustible: row.Combustible || row.combustible || "GASOLINA",
    pasajeros: row.Pasajeros || row.pasajeros || 5,
    pantalla: row.Pantalla || row.pantalla || ""
  };
}

function normalizarCliente(row) {
  return {
    id: row.id || row.ID || Date.now() + Math.random(),
    nombre: row.Nombre || row.nombre || "",
    fechaContacto: parseFecha(row.Fecha_Contacto || row.fechaContacto),
    celular: row.Celular || row.celular || "",
    marcaBusca: row.Marca_Busca || row.marcaBusca || "Indiferente",
    modeloBusca: row.Modelo_Busca || row.modeloBusca || "",
    ranioMin: parseInt(row.Anio_Min || row.ranioMin || 2015) || 2015,
    ranioMax: parseInt(row.Anio_Max || row.ranioMax || 2026) || 2026,
    presupuesto: parseFloat(row.Presupuesto || row.presupuesto || 0) || 0,
    transmisionDesea: row.Transmision_Desea || row.transmisionDesea || "Indiferente",
    carroceria: row.Carroceria || row.carroceria || "Indiferente",
    partePago: row.Parte_Pago || row.partePago || "No",
    partePagoDesc: row.Parte_Pago_Desc || row.partePagoDesc || "",
    status: row.Status || row.status || "Tibio",
    origen: row.Origen || row.origen || "WhatsApp",
    tipoPago: row.Tipo_Pago || row.tipoPago || "Por definir",
    fechaUltimoContacto: parseFecha(row.Fecha_Ultimo_Contacto || row.fechaUltimoContacto)
  };
}

function parseFecha(v) {
  if(!v) return "";
  if(typeof v === "string") {
    if(/^\d{4}-\d{2}-\d{2}/.test(v)) return v.split("T")[0];
    const p = v.split("/");
    if(p.length === 3) {
      let [d,m,y] = p;
      if(y.length === 2) y = "20"+y;
      return `${y}-${m.padStart(2,"0")}-${d.padStart(2,"0")}`;
    }
    return "";
  }
  try {
    return new Date(v).toISOString().split("T")[0];
  } catch { return ""; }
}

// Convierte el objeto interno al formato del backend (claves del Excel)
function vehToBackend(v) {
  return {
    id: v.id,
    Marca: v.marca,
    Modelo: v.modelo,
    Version: v.version,
    Transmision: v.transmision,
    Traccion: v.traccion,
    Motor: v.motor,
    "Año": v.anio,
    KM: v.kilometraje,
    Color: v.color,
    Placa: v.placa,
    SOAT: v.soat,
    Revision_Tecnica: v.revTecnica,
    Prenda: v.prenda,
    Fecha_Compra: v.fechaCompra,
    Comision: v.comision,
    Costo_Inspeccion: v.costoInspeccion,
    Gastos_Notaria: v.gastosNotaria,
    Gasto_Firma: v.gastoFirma,
    Costo_Compra: v.costoCompra,
    Retoques: v.retoques,
    Gasto_Combustible: v.gastoCombustible,
    Gasto_Lavado: v.gastoLavado,
    Gastos_Cochera: v.gastosCochera,
    Otros_Gastos: v.otrosGastos,
    Precio_Venta: v.precioVenta,
    Fecha_Publicacion: v.fechaPublicacion,
    Precio_Publicacion: v.precioPublicacion,
    Fecha_Venta: v.fechaVenta,
    Descripcion_de_Gastos: v.descripcionGastos,
    Comentario: v.comentarios,
    Estado: v.estado,
    Combustible: v.combustible || "GASOLINA",
    Pasajeros: v.pasajeros || 5,
    Pantalla: v.pantalla || ""
  };
}

function recargarApp(result) {
  toast("✅ Guardado correctamente", "success");
  sincronizar();
}

function errorGuardar(err) {
  console.error(err);
  toast("⚠️ Error al guardar: " + (err.message || err), "error");
}

// ────────────── HELPERS UI ──────────────
function showLoader(show) {
  document.getElementById("loader").style.display = show ? "flex" : "none";
}

function toast(msg, type="success") {
  const el = document.createElement("div");
  el.className = `toast ${type}`;
  el.textContent = msg;
  document.getElementById("toastRoot").appendChild(el);
  setTimeout(()=> el.remove(), 3500);
}

const today = () => new Date().toISOString().split("T")[0];
const fmt = d => d ? new Date(d+"T00:00:00").toLocaleDateString("es-PE") : "—";
const diffDays = (a,b) => Math.floor((new Date(b)-new Date(a))/(1000*60*60*24));
const money = n => "$ " + parseFloat(n||0).toLocaleString("en-US",{minimumFractionDigits:2,maximumFractionDigits:2});

const calcCostoTotal = v => [v.costoCompra,v.comision,v.costoInspeccion,v.gastosNotaria,v.gastoFirma,v.retoques,v.gastoCombustible,v.gastoLavado,v.gastosCochera,v.otrosGastos].reduce((s,x)=>s+(parseFloat(x)||0),0);

const calcDiasStock = v => {
  if(!v.fechaPublicacion) return null;
  const fin = v.estado==="Vendido"&&v.fechaVenta ? v.fechaVenta : today();
  return diffDays(v.fechaPublicacion, fin);
};

const calcUtilidad = v => {
  const ct = calcCostoTotal(v);
  if(parseFloat(v.precioVenta)>0) return {val:parseFloat(v.precioVenta)-ct,tipo:"real"};
  if(parseFloat(v.precioPublicacion)>0) return {val:parseFloat(v.precioPublicacion)-ct,tipo:"proyectada"};
  return null;
};

const getCarroceria = v => CARROCERIA_MAP[v.modelo] || "Sedán";

function matchScore(cli, veh) {
  if(parseFloat(veh.precioPublicacion) > parseFloat(cli.presupuesto)) return null;
  if(parseInt(cli.ranioMin) > parseInt(veh.anio) || parseInt(cli.ranioMax) < parseInt(veh.anio)) return null;
  let score = 0;
  const flags = [];
  if(cli.marcaBusca === veh.marca || cli.marcaBusca === "Indiferente") { score += 30; flags.push("✅ Marca"); }
  if(!cli.modeloBusca || cli.modeloBusca.toLowerCase() === veh.modelo.toLowerCase()) { score += 20; flags.push("✅ Modelo"); }
  if(cli.transmisionDesea === veh.transmision || cli.transmisionDesea === "Indiferente") { score += 20; flags.push("✅ Transmisión"); }
  if(cli.carroceria === getCarroceria(veh) || cli.carroceria === "Indiferente") { score += 15; flags.push("✅ Carrocería"); }
  if(parseFloat(veh.precioPublicacion) <= parseFloat(cli.presupuesto)*0.95) { score += 15; flags.push("✅ Precio ok"); }
  return score >= 50 ? {score, flags} : null;
}

function findMatchesForVeh(veh) {
  if(!["Disponible","Publicado"].includes(veh.estado)) return [];
  return clis
    .filter(c => ["Caliente","Tibio"].includes(c.status))
    .map(c => {
      const r = matchScore(c, veh);
      return r ? {cliente:c, score:r.score, flags:r.flags} : null;
    })
    .filter(Boolean)
    .sort((a,b) => {
      const o = {Caliente:0, Tibio:1};
      return (o[a.cliente.status]??2) - (o[b.cliente.status]??2) || b.score - a.score;
    });
}

function findMatchesForCli(cli) {
  if(!["Caliente","Tibio"].includes(cli.status)) return [];
  return vehs
    .filter(v => ["Disponible","Publicado"].includes(v.estado))
    .map(v => {
      const r = matchScore(cli, v);
      return r ? {vehiculo:v, score:r.score, flags:r.flags} : null;
    })
    .filter(Boolean)
    .sort((a,b) => b.score - a.score);
}

const estadoColor = e => e==="Vendido"?"#22c55e":e==="Reservado"?"#a855f7":e==="Publicado"?"#3b82f6":"#64748b";

function badge(text, color) {
  return `<span class="badge" style="background:${color}22;color:${color};border:1px solid ${color}55">${text}</span>`;
}

// ────────────── RENDER PRINCIPAL ──────────────
function render() {
  document.querySelectorAll(".tab-btn").forEach(b => {
    b.classList.toggle("active", b.dataset.tab === currentTab);
  });

  const alertasSOAT = vehs.filter(v=>v.soat && diffDays(today(),v.soat)>=0 && diffDays(today(),v.soat)<=30);
  const alertasRev = vehs.filter(v=>v.revTecnica && diffDays(today(),v.revTecnica)>=0 && diffDays(today(),v.revTecnica)<=30);
  const alertasCli = clis.filter(c=>["Caliente","Tibio"].includes(c.status) && c.fechaUltimoContacto && diffDays(c.fechaUltimoContacto,today())>=7);
  const totalAlertas = alertasSOAT.length + alertasRev.length + alertasCli.length;
  const ab = document.getElementById("alertBadge");
  if(totalAlertas > 0) {
    ab.classList.remove("hidden");
    ab.textContent = `🔔 ${totalAlertas}`;
    ab.onclick = () => { currentTab = "dashboard"; render(); };
  } else {
    ab.classList.add("hidden");
  }

  const content = window.content = document.getElementById("content");
  // Si es técnico, siempre forzar pestaña de inspección
  if(usuarioActual && usuarioActual.rol === "tecnico") {
    currentTab = "inspeccion";
    content.innerHTML = renderInspeccion();
    initInspeccion();
    return;
  }
  if(vehs.length === 0 && clis.length === 0 && !cargando && currentTab !== "tasadora" && currentTab !== "cotizaciones" && currentTab !== "inspeccion" && currentTab !== "flyer") {
    content.innerHTML = renderEmpty();
    return;
  }
  if(currentTab === "dashboard") content.innerHTML = renderDashboard(alertasSOAT, alertasRev, alertasCli);
  else if(currentTab === "inventario") content.innerHTML = renderInventario();
  else if(currentTab === "crm") content.innerHTML = renderCRM();
  else if(currentTab === "matches") content.innerHTML = renderMatches();
  else if(currentTab === "tasadora") content.innerHTML = renderTasadora();
  else if(currentTab === "cotizaciones") { content.innerHTML = renderCotizaciones(); cargarCotizaciones(); }
  else if(currentTab === "inspeccion") { content.innerHTML = renderInspeccion(); initInspeccion(); }
  else if(currentTab === "flyer")      { content.innerHTML = renderFlyer();      initFlyer();      }
}

function renderEmpty() {
  return `<div class="text-center py-20">
    <div class="text-6xl mb-4">📭</div>
    <h2 class="text-xl font-bold mb-2">Sin datos</h2>
    <p class="text-slate-500 text-sm mb-6">No se encontraron registros en Google Sheets.</p>
    <button onclick="sincronizar()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-5 py-2 text-sm font-semibold mr-2">🔄 Reintentar</button>
    <button onclick="openVehModal()" class="border border-slate-700 text-slate-300 rounded-lg px-5 py-2 text-sm font-semibold">+ Agregar Vehículo</button>
  </div>`;
}

function renderDashboard(alertasSOAT, alertasRev, alertasCli) {
  const enStock = vehs.filter(v=>["Disponible","Publicado"].includes(v.estado));
  const vendidos = vehs.filter(v=>v.estado==="Vendido");
  const utilRealTotal = vendidos.reduce((s,v)=>{const u=calcUtilidad(v);return s+(u?.val||0);},0);
  const utilProyTotal = enStock.reduce((s,v)=>{const u=calcUtilidad(v);return s+(u?.val||0);},0);
  const cliActivos = clis.filter(c=>["Caliente","Tibio"].includes(c.status)).length;
  const inversionStock = enStock.reduce((s,v)=>s+calcCostoTotal(v),0);

  const stats = [
    {label:"En Stock", val:enStock.length, icon:"🚗", color:"#3b82f6"},
    {label:"Vendidos", val:vendidos.length, icon:"✅", color:"#22c55e"},
    {label:"Inversión Stock", val:money(inversionStock), icon:"📦", color:"#f59e0b"},
    {label:"Utilidad Real", val:money(utilRealTotal), icon:"💰", color:"#a855f7"},
    {label:"Utilidad Proy.", val:money(utilProyTotal), icon:"📈", color:"#38bdf8"},
    {label:"Clientes Activos", val:cliActivos, icon:"👥", color:"#ec4899"},
  ];

  let html = `<h1 class="text-xl font-extrabold mb-4">Dashboard</h1>
    <div class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-6 gap-3 mb-6">
      ${stats.map(s=>`
        <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div class="text-2xl mb-1">${s.icon}</div>
          <div class="text-lg font-extrabold" style="color:${s.color}">${s.val}</div>
          <div class="text-xs text-slate-500 mt-1">${s.label}</div>
        </div>
      `).join("")}
    </div>`;

  if(alertasSOAT.length + alertasRev.length + alertasCli.length > 0) {
    html += `<div class="bg-slate-900 border border-slate-700 rounded-xl p-4 mb-4">
      <h3 class="text-red-500 text-sm font-bold mb-3">🔔 Alertas Activas</h3>
      ${alertasSOAT.map(v=>`<div class="bg-red-500/10 border border-red-500/30 rounded p-2 mb-2 text-sm">⚠️ <b>SOAT por vencer:</b> ${v.marca} ${v.modelo} · ${v.placa} — vence ${fmt(v.soat)}</div>`).join("")}
      ${alertasRev.map(v=>`<div class="bg-red-500/10 border border-red-500/30 rounded p-2 mb-2 text-sm">⚠️ <b>Rev. Técnica:</b> ${v.marca} ${v.modelo} · ${v.placa} — vence ${fmt(v.revTecnica)}</div>`).join("")}
      ${alertasCli.map(c=>`<div class="bg-amber-500/10 border border-amber-500/30 rounded p-2 mb-2 text-sm">🟡 <b>Sin contacto ≥7 días:</b> ${c.nombre} (${c.status}) — último: ${fmt(c.fechaUltimoContacto)}</div>`).join("")}
    </div>`;
  }

  const todosLosMatches = [];
  enStock.forEach(v => {
    const ms = findMatchesForVeh(v);
    if(ms.length > 0) todosLosMatches.push({veh:v, matches:ms});
  });

  if(todosLosMatches.length > 0) {
    html += `<div class="bg-gradient-to-br from-blue-900/30 to-purple-900/20 border border-blue-500/40 rounded-xl p-4 mb-4">
      <h3 class="text-sky-400 text-sm font-bold mb-3">🎯 Oportunidades de Venta Activas</h3>
      ${todosLosMatches.slice(0,5).map(t=>`
        <div class="bg-slate-900/60 border border-slate-700 rounded-lg p-3 mb-2">
          <div class="flex justify-between items-center flex-wrap gap-2">
            <div>
              <span class="text-sky-300 font-bold">${t.veh.marca} ${t.veh.modelo} ${t.veh.anio}</span>
              <span class="text-slate-500 text-xs ml-2">${t.veh.placa} · ${money(t.veh.precioPublicacion)}</span>
            </div>
            <span class="badge bg-blue-500/20 text-sky-400 border border-blue-500/50">${t.matches.length} compatible${t.matches.length>1?"s":""}</span>
          </div>
          <div class="mt-2 text-xs text-slate-400">
            ${t.matches.slice(0,3).map(m=>`<span class="mr-3">${STATUS_EMOJI[m.cliente.status]} ${m.cliente.nombre} (${m.score}/100)</span>`).join("")}
          </div>
        </div>
      `).join("")}
      <button onclick="setTab('matches')" class="text-sky-400 text-xs font-bold mt-2 hover:underline">Ver todos →</button>
    </div>`;
  }

  html += `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-4">
    <h3 class="text-sm text-slate-400 font-bold mb-3">🚗 Stock Actual (${enStock.length})</h3>
    <div class="overflow-x-auto">
      <table>
        <thead><tr>${["Vehículo","Placa","KM","Costo","Pub.","Días","Util. Proy.","Estado","Matches"].map(h=>`<th>${h}</th>`).join("")}</tr></thead>
        <tbody>
          ${enStock.map(v=>{
            const d = calcDiasStock(v);
            const dc = d===null?null:d>45?"#ef4444":d>20?"#f59e0b":"#22c55e";
            const u = calcUtilidad(v);
            const ms = findMatchesForVeh(v);
            return `<tr class="clickable" onclick="openDetalle('${v.id}')">
              <td class="font-semibold">${v.marca} ${v.modelo} <span class="text-slate-500 font-normal">${v.anio}</span></td>
              <td class="text-slate-500">${v.placa}</td>
              <td class="text-slate-500">${parseInt(v.kilometraje).toLocaleString()}</td>
              <td>${money(calcCostoTotal(v))}</td>
              <td class="text-sky-400">${money(v.precioPublicacion)}</td>
              <td>${d!==null?`<span style="color:${dc};font-weight:700">${d}d</span>`:"—"}</td>
              <td style="color:${u && u.val>=0?"#4ade80":"#ef4444"}">${u?money(u.val):"—"}</td>
              <td>${badge(v.estado, estadoColor(v.estado))}</td>
              <td>${ms.length>0?`<span class="badge bg-blue-500/20 text-sky-400 border border-blue-500/50">🎯 ${ms.length}</span>`:"—"}</td>
            </tr>`;
          }).join("")}
        </tbody>
      </table>

};

function calcularOferta(d) {
  const valorComercial = parseFloat(d.valorComercial) || 0;
  const reacond = parseFloat(d.costoReacondicionamiento) || 0;
  const cargas = parseFloat(d.cargasLegales) || 0;
  const margen = parseFloat(d.margenGanancia) || 0;

  const totalDeducciones = reacond + cargas;
  const utilidadNeta = valorComercial * (margen / 100);
  const precioMaxOferta = valorComercial - totalDeducciones - utilidadNeta;
  const inversionTotal = precioMaxOferta + totalDeducciones;

  return { valorComercial, reacond, cargas, totalDeducciones, utilidadNeta, precioMaxOferta, inversionTotal, margen };
}

// Actualización en tiempo real sin re-renderizar todo (no pierde foco en inputs)
function actualizarResultados() {
  const r = calcularOferta(tasadoraData);
  const ofertaInvalida = r.precioMaxOferta <= 0 && r.valorComercial > 0;

  const hero = document.getElementById("heroOferta");
  const display = document.getElementById("precioMaxDisplay");
  const subtext = document.getElementById("ofertaSubtext");
  if(!hero || !display) return;

  hero.className = `bg-gradient-to-br ${ofertaInvalida?'from-red-900/60 to-red-950/40 border-red-500/60':'from-emerald-900/60 to-blue-900/40 border-emerald-500/60'} border-2 rounded-2xl p-6 shadow-2xl shadow-emerald-500/10`;
  display.className = `text-5xl md:text-6xl font-black ${ofertaInvalida?'text-red-300':'text-white'} tracking-tight`;
  display.style.textShadow = `0 0 30px ${ofertaInvalida?'rgba(239,68,68,0.4)':'rgba(16,185,129,0.4)'}`;
  display.textContent = money(r.precioMaxOferta);
  subtext.className = `text-xs mt-3 ${ofertaInvalida?'text-red-400':'text-emerald-200/80'}`;
  subtext.textContent = ofertaInvalida ? '⚠️ La operación no es rentable con estos parámetros' : 'Este es el máximo que puedes pagar por el vehículo.';

  document.getElementById("desgValorComercial").textContent = money(r.valorComercial);
  document.getElementById("desgReacond").textContent = "−"+money(r.reacond);
  document.getElementById("desgCargas").textContent = "−"+money(r.cargas);
  document.getElementById("desgDeducciones").textContent = "−"+money(r.totalDeducciones);
  document.getElementById("desgUtilidad").textContent = money(r.utilidadNeta);
  document.getElementById("desgMargen").textContent = r.margen;
  document.getElementById("desgInversion").textContent = money(r.inversionTotal);
}

function aprobarCompra() {
  const r = calcularOferta(tasadoraData);
  if(!tasadoraData.placa) { toast("⚠️ Ingresa la placa del vehículo", "error"); return; }
  if(r.precioMaxOferta <= 0) { toast("⚠️ El precio máximo de oferta no es válido", "error"); return; }
  if(!confirm(`¿Aprobar compra de ${tasadoraData.placa} con oferta máx de ${money(r.precioMaxOferta)}?`)) return;
  enviarTasacion(r, "Aprobada");
}

function guardarCotizacion() {
  const r = calcularOferta(tasadoraData);
  if(!tasadoraData.placa) { toast("⚠️ Ingresa la placa del vehículo", "error"); return; }
  if(r.valorComercial <= 0) { toast("⚠️ Ingresa el valor comercial", "error"); return; }
  enviarTasacion(r, "Cotización");
}

function enviarTasacion(r, estado) {
  const payload = {
    placa: tasadoraData.placa,
    marca: tasadoraData.marca,
    modelo: tasadoraData.modelo,
    version: tasadoraData.version,
    anio: tasadoraData.anio,
    valorComercial: tasadoraData.valorComercial,
    costoReacondicionamiento: tasadoraData.costoReacondicionamiento,
    cargasLegales: tasadoraData.cargasLegales,
    margenGanancia: tasadoraData.margenGanancia,
    totalDeducciones: r.totalDeducciones,
    utilidadNeta: r.utilidadNeta,
    precioMaxOferta: r.precioMaxOferta,
    inversionTotal: r.inversionTotal,
    estado: estado,
    usuario: usuarioActual ? usuarioActual.nombre : ""
  };

  if(typeof google !== "undefined" && google.script && google.script.run) {
    toast("Guardando en Google Sheets...", "success");
    google.script.run
      .withSuccessHandler(result => {
        toast(`✅ ${estado} guardada: ${tasadoraData.placa}`, "success");
        tasadoraData = {placa:"",marca:"",modelo:"",version:"",anio:"",valorComercial:0,costoReacondicionamiento:0,cargasLegales:0,margenGanancia:15};
        render();
      })
      .withFailureHandler(err => {
        toast("⚠️ Error: " + (err.message || err), "error");
      })
      .guardarTasacion(payload);
  } else {
    toast("⚠️ Modo preview", "error");
    console.log("Tasación a guardar:", payload);
  }
}

let cotizaciones = [];
let cotizacionesCargando = false;

  let html = `<div class="max-w-6xl mx-auto">
    <div class="flex justify-between items-center mb-4 flex-wrap gap-2">
      <h1 class="text-xl font-extrabold">📑 Historial de Cotizaciones</h1>

        <div class="text-xs text-amber-300">⏳ Cotizaciones</div>
        <div class="text-2xl font-extrabold text-amber-400 mt-1">${totalCotizaciones}</div>
      </div>
      <div class="bg-slate-900 border border-slate-800 rounded-xl p-4">
        <div class="text-xs text-slate-500">Suma Ofertas (filtrado)</div>
        <div class="text-2xl font-extrabold text-sky-400 mt-1">${money(sumOfertas)}</div>

    <div class="flex gap-2 mb-4 flex-wrap">

      `).join("")}
    </div>`;

  if(cotizacionesCargando) {
    html += `<div class="text-center py-10"><div class="spinner mx-auto mb-3"></div><div class="text-slate-500 text-sm">Cargando cotizaciones...</div></div>`;
  } else if(filtered.length === 0) {
    html += `<div class="bg-slate-900 border border-slate-800 rounded-xl p-10 text-center">
      <div class="text-5xl mb-3">📭</div>
      <p class="text-slate-400">Sin cotizaciones ${filtroCotizaciones!=='Todas'?'en este filtro':'todavía'}.</p>
      <p class="text-slate-500 text-xs mt-2">Ve a la pestaña ⚖️ Tasación para crear una.</p>
    </div>`;
  } else {
    html += `<div class="bg-slate-900 border border-slate-800 rounded-xl overflow-hidden">
      <div class="overflow-x-auto">
        <table>
          <thead><tr>
            ${["Fecha","Vehículo","Placa","Valor Com.","Deducciones","Margen","Utilidad","Oferta Máx.","Estado","Usuario",""].map(h=>`<th>${h}</th>`).join("")}
          </tr></thead>
          <tbody>
            ${filtered.map(c=>`<tr>
              <td class="text-slate-500 text-xs">${c.Fecha||""} ${c.Hora||""}</td>
              <td><div class="font-semibold">${c.Marca||"—"} ${c.Modelo||""}</div><div class="text-slate-500 text-xs">${c.Anio||""} · ${c.Version||""}</div></td>
              <td class="font-bold">${c.Placa||"—"}</td>
              <td>${money(c.Valor_Comercial)}</td>
              <td class="text-red-400">${money(c.Total_Deducciones)}</td>
              <td class="text-amber-400">${c.Margen_Ganancia_Pct||0}%</td>
              <td class="text-emerald-400">${money(c.Utilidad_Proyectada)}</td>
              <td class="font-bold ${(Number(c.Precio_Maximo_Oferta)||0)>0?'text-emerald-300':'text-red-400'}">${money(c.Precio_Maximo_Oferta)}</td>

            </tr>`).join("")}
          </tbody>
        </table>
      </div>
    </div>`;
  }

  html += `</div>`;
  return html;
}

function cargarCotizaciones() {
  if(typeof google === "undefined" || !google.script || !google.script.run) {
    cotizaciones = [];
    cotizacionesCargando = false;
    return;
  }
  cotizacionesCargando = true;
  render();
  google.script.run
    .withSuccessHandler(data => {
      cotizaciones = data || [];
      cotizacionesCargando = false;
      render();
    })
    .withFailureHandler(err => {
      cotizacionesCargando = false;
      cotizaciones = [];
      toast("⚠️ No se pudieron cargar cotizaciones: " + (err.message||err), "error");
      render();
    })
    .listarOperaciones();
}

function eliminarCotizacion(rowIndex, placa) {
  if(!confirm(`¿Eliminar la cotización de ${placa}?`)) return;
  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(()=>{
        toast("✅ Cotización eliminada", "success");
        cargarCotizaciones();
      })
      .withFailureHandler(err=>toast("⚠️ Error: "+err, "error"))
      .eliminarTasacion(rowIndex);
  }
}

function colorSelectEstado(val) {
  if(!val) return "";
  const v = val.toLowerCase();
  if(v.includes("original") || v.includes("conforme") || v.includes("operativo") || v.includes("excelente")) return "border-green-500/60 text-green-300";
  if(v.includes("repintado") || v.includes("desgaste") || v.includes("mantenimiento") || v.includes("leve")) return "border-amber-500/60 text-amber-300";
  if(v.includes("requiere") || v.includes("roto") || v.includes("retapizar")) return "border-orange-500/60 text-orange-300";
  if(v.includes("crítica") || v.includes("critica")) return "border-red-500/60 text-red-400";
  return "";
}

let inspeccionData = {};
let seccionesAbiertas = { s1: true, s2: false, s3: false, s4: false, s5: false, s6: false };

function renderInspeccion() {
  let html = `<div class="max-w-3xl mx-auto">
    <div class="mb-5">
      <h1 class="text-xl font-extrabold">📋 Inspección Técnica</h1>
      <p class="text-slate-500 text-sm mt-1">Peritaje de campo. Toca cada sección para expandir.</p>
    </div>`;

  INSPECCION_SECCIONES.forEach(sec => {
    const abierta = seccionesAbiertas[sec.id];
    const completados = sec.campos.filter(c => inspeccionData[c.k] && String(inspeccionData[c.k]).trim() !== "").length;
    const total = sec.campos.length;
    const ringClass = sec.crucial ? "ring-2 ring-amber-500/40" : "";

    html += `<div class="bg-slate-900 border border-slate-800 ${ringClass} rounded-xl mb-3 overflow-hidden">
      <button onclick="toggleSeccion('${sec.id}')" class="w-full flex justify-between items-center p-4 hover:bg-slate-800/40 transition">
        <div class="flex items-center gap-3">
          <span class="text-2xl">${sec.icon}</span>
          <div class="text-left">
            <div class="font-bold text-sm">${sec.titulo}</div>
            <div class="text-xs text-slate-500 mt-0.5">${completados}/${total} campos</div>
          </div>
        </div>
        <div class="flex items-center gap-2">
          ${completados === total ? '<span class="text-green-400 text-lg">✓</span>' : completados > 0 ? '<span class="text-amber-400 text-xs">●</span>' : ''}
          <span class="text-slate-400 text-xl transition-transform ${abierta?'rotate-180':''}">⌄</span>
        </div>
      </button>`;

    if(abierta) {
      html += `<div class="px-4 pb-4 border-t border-slate-800 pt-4"><div class="grid grid-cols-1 sm:grid-cols-2 gap-3">`;
      sec.campos.forEach(c => {
        const val = inspeccionData[c.k] || "";
        const fullClass = c.full ? "sm:col-span-2" : "";
        const reqMark = c.req ? '<span class="text-red-400">*</span>' : '';
        const highlightLabel = c.highlight ? 'text-amber-300' : '';

        if(c.t === "estructural" || c.t === "mecanico" || c.t === "operativo" || c.t === "estetica") {
          let opts;
          if(c.t === "estructural") opts = ESTADO_ESTRUCTURAL;
          else if(c.t === "mecanico") opts = ESTADO_MECANICO;
          else if(c.t === "operativo") opts = ESTADO_OPERATIVO;
          else opts = ESTADO_ESTETICA;
          const colorClass = colorSelectEstado(val);
          html += `<div class="${fullClass}">
            <label class="${highlightLabel}">${c.l} ${reqMark}</label>
            <select data-insp="${c.k}" onchange="inspeccionData['${c.k}']=this.value;render()" class="${colorClass}">
              ${opts.map(o => `<option value="${o}" ${val===o?"selected":""}>${o || "— seleccionar —"}</option>`).join("")}
            </select>
          </div>`;
        } else if(c.t === "select") {
          html += `<div class="${fullClass}">
            <label class="${highlightLabel}">${c.l} ${reqMark}</label>
            <select data-insp="${c.k}" onchange="inspeccionData['${c.k}']=this.value;render()">
              ${c.opts.map(o => `<option value="${o}" ${val===o?"selected":""}>${o || "— seleccionar —"}</option>`).join("")}
            </select>
          </div>`;
        } else if(c.t === "textarea") {
          html += `<div class="${fullClass}">
            <label class="${highlightLabel}">${c.l} ${reqMark}</label>
            <textarea data-insp="${c.k}" rows="3" oninput="inspeccionData['${c.k}']=this.value">${val}</textarea>
          </div>`;
        } else {
          const highlightInput = c.highlight ? 'bg-amber-500/5 border-amber-500/50 text-amber-100 font-bold text-base' : '';
          html += `<div class="${fullClass}">
            <label class="${highlightLabel}">${c.l} ${reqMark}</label>
            <input data-insp="${c.k}" type="${c.t}" value="${val}" oninput="inspeccionData['${c.k}']=this.value" class="${highlightInput}">
          </div>`;
        }
      });
      html += `</div></div>`;
    }
    html += `</div>`;
  });

  const totalCampos = INSPECCION_SECCIONES.reduce((s,sec)=>s+sec.campos.length, 0);
  const completadosTotal = INSPECCION_SECCIONES.reduce((s,sec) => s + sec.campos.filter(c=>inspeccionData[c.k]&&String(inspeccionData[c.k]).trim()!=="").length, 0);
  const progreso = Math.round((completadosTotal/totalCampos)*100);

  html += `<div class="bg-slate-900 border border-slate-800 rounded-xl p-4 mb-4 mt-4">
    <div class="flex justify-between text-xs text-slate-400 mb-2"><span>Progreso del peritaje</span><span class="font-bold text-sky-400">${progreso}% · ${completadosTotal}/${totalCampos}</span></div>
    <div class="bg-slate-800 rounded-full h-2 overflow-hidden">
      <div class="bg-gradient-to-r from-sky-500 to-blue-500 h-full transition-all" style="width:${progreso}%"></div>
    </div>
  </div>

  <div class="flex gap-2 mb-6">
    <button onclick="limpiarInspeccion()" class="border border-slate-700 text-slate-400 rounded-lg px-4 py-3 text-sm font-semibold">🗑 Limpiar</button>
    <button id="btnGuardarInsp" onclick="guardarInspeccion()" class="flex-1 bg-blue-600 hover:bg-blue-500 active:bg-blue-700 text-white rounded-lg px-4 py-4 text-base font-bold shadow-lg shadow-blue-500/20">
      💾 Guardar Inspección y Generar PDF
    </button>
  </div>
  </div>`;
  return html;
}

function toggleSeccion(id) {
  seccionesAbiertas[id] = !seccionesAbiertas[id];
  render();
}

function limpiarInspeccion() {
  if(!confirm("¿Limpiar todos los campos de la inspección?")) return;
  inspeccionData = {};
  seccionesAbiertas = { s1: true, s2: false, s3: false, s4: false, s5: false, s6: false };
  render();
}

function scoreEstado(valor) {
  if(!valor) return null;
  const v = valor.toLowerCase();
  if(v.includes("original") || v.includes("conforme") || v.includes("operativo") || v.includes("excelente")) return 10;
  if(v.includes("repintado") || v.includes("desgaste normal") || v.includes("leve")) return 7;
  if(v.includes("desgaste") || v.includes("mantenimiento")) return 5;
  if(v.includes("requiere") || v.includes("roto") || v.includes("retapizar")) return 4;
  if(v.includes("crítica") || v.includes("critica")) return 1;
  return null;
}

function emojiPorScore(score) {
  if(score === null) return "⚪ Sin evaluar";
  if(score >= 8.5) return "🟢 Conforme";
  if(score >= 5) return "🟡 Atención";
  return "🔴 Crítico";
}

function calcularScoreSeccion(seccionId) {
  const sec = INSPECCION_SECCIONES.find(s => s.id === seccionId);
  if(!sec) return { score: null, resumen: "⚪ Sin evaluar", evaluados: 0, totales: 0 };

  let suma = 0;
  let count = 0;
  sec.campos.forEach(c => {
    if(["estructural","mecanico","operativo","estetica"].includes(c.t)) {
      const s = scoreEstado(inspeccionData[c.k]);
      if(s !== null) {
        suma += s;
        count++;
      }
    }
  });
  if(count === 0) return { score: null, resumen: "⚪ Sin evaluar", evaluados: 0, totales: sec.campos.filter(c=>["estructural","mecanico","operativo","estetica"].includes(c.t)).length };
  const promedio = suma / count;
  return {
    score: Math.round(promedio * 10) / 10,
    resumen: emojiPorScore(promedio),
    evaluados: count,
    totales: sec.campos.filter(c=>["estructural","mecanico","operativo","estetica"].includes(c.t)).length
  };
}

function calcularScoreGlobal() {
  const carroceria = calcularScoreSeccion("s2");
  const motor = calcularScoreSeccion("s3");
  const tren = calcularScoreSeccion("s4");
  const electronica = calcularScoreSeccion("s5");

  const scores = [
    { val: motor.score, peso: 0.35 },
    { val: tren.score, peso: 0.25 },
    { val: carroceria.score, peso: 0.25 },
    { val: electronica.score, peso: 0.15 }
  ].filter(s => s.val !== null);

  if(scores.length === 0) return null;
  const pesoTotal = scores.reduce((s, x) => s + x.peso, 0);
  const promedio = scores.reduce((s, x) => s + (x.val * x.peso), 0) / pesoTotal;
  return Math.round(promedio * 10);
}

  INSPECCION_SECCIONES.forEach(sec => {

        faltantes.push(c.l);
      }
    });
  });
  if(faltantes.length > 0) {
    toast("⚠️ Faltan campos obligatorios: " + faltantes.join(", "), "error");
    return;

  const numeroInforme = String(Date.now()).slice(-6);

function exitoInspeccion(result) {
  showInspLoader(false);
  const btn = document.getElementById("btnGuardarInsp");
  if(btn) { btn.disabled = false; btn.innerHTML = "💾 Guardar Inspección y Generar PDF"; }

  const esError = typeof result === "string" && result.toLowerCase().includes("error");

  if(esError) {
    toast("⚠️ " + result, "error");
    return;
  }

  toast(typeof result === "string" ? result : "✅ Inspección guardada", "success");

  modal("✅ Informe Generado", `
    <div class="text-center py-4">
      <div class="text-5xl mb-3">📄</div>
      <p class="text-slate-300 text-sm mb-2">El informe se guardó correctamente.</p>
      <p class="text-slate-500 text-xs mb-5">Revisa tu carpeta de Google Drive para descargar el PDF.</p>
      <button onclick="closeModal();inspeccionData={};seccionesAbiertas={s1:true,s2:false,s3:false,s4:false,s5:false,s6:false};render()" class="bg-blue-600 hover:bg-blue-500 text-white rounded-lg px-6 py-3 text-sm font-bold">📋 Nueva inspección</button>
    </div>
  `);
}

function showInspLoader(show) {
  let el = document.getElementById("inspLoader");
  if(show) {
    if(!el) {
      el = document.createElement("div");
      el.id = "inspLoader";
      el.className = "fixed inset-0 bg-slate-950/90 z-[1500] flex flex-col items-center justify-center";
      el.innerHTML = `
        <div class="spinner mb-5"></div>
        <div class="text-sky-400 font-bold text-lg">Generando Informe PDF...</div>
        <div class="text-slate-500 text-xs mt-2">Procesando peritaje y guardando en Google Drive</div>
      `;
      document.body.appendChild(el);
    }
  } else {
    if(el) el.remove();
  }
}

    <div class="grid grid-cols-3 gap-3 mb-4">${txt("comentarios","Comentarios")}</div>
    <div class="flex gap-2 justify-end">
      <button type="button" onclick="closeModal()" class="border border-slate-700 text-slate-400 rounded px-4 py-2 text-sm">Cancelar</button>
      <button type="submit" id="btnSaveVeh" class="bg-blue-600 text-white rounded px-4 py-2 text-sm font-semibold">Guardar en Google Sheets</button>
    </div>
  </form>`;
  modal(id?"Editar Vehículo":"Nuevo Vehículo", body);
}

function saveVeh(id) {
  const form = document.getElementById("vehForm");
  const data = id ? {...vehs.find(x=>String(x.id)===String(id))} : {...EMPTY_VEH};
  form.querySelectorAll("[data-k]").forEach(el=>{
    const k = el.dataset.k;
    let v = el.value;
    if(el.type === "number") v = parseFloat(v)||0;
    data[k] = v;
  });
  if(id) data.id = id;

  const formData = vehToBackend(data);

  const btn = document.getElementById("btnSaveVeh");
  if(btn) { btn.disabled = true; btn.textContent = "Guardando..."; }

  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(()=>{ closeModal(); recargarApp(); })
      .withFailureHandler(err=>{
        if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
        errorGuardar(err);
      })
      .guardarVehiculo(formData);
  } else {
    if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
    toast("⚠️ Modo preview: google.script.run no disponible", "error");
    console.log("Datos que se enviarían a guardarVehiculo:", formData);
  }
}

function openCliModal(id) {
  const c = id ? {...clis.find(x=>String(x.id)===String(id))} : {...EMPTY_CLI};
  const inp = (k,l,t="text",extra="") => `<div><label>${l}</label><input data-k="${k}" type="${t}" value="${c[k]??""}" ${extra}></div>`;
  const sel = (k,l,opts) => `<div><label>${l}</label><select data-k="${k}">${opts.map(o=>`<option ${c[k]===o?"selected":""}>${o}</option>`).join("")}</select></div>`;

  const body = `<form id="cliForm" onsubmit="event.preventDefault();saveCli('${id||""}')">
    <div class="section-title">Datos del Cliente</div>
    <div class="grid grid-cols-3 gap-3 mb-4">
      ${inp("nombre","Nombre *")}${inp("celular","Celular")}${inp("fechaContacto","F. Contacto","date")}
      ${inp("fechaUltimoContacto","Último Contacto","date")}${sel("status","Status",STATUS_CRM)}${sel("origen","Origen",ORIGENES)}
      ${sel("tipoPago","Tipo Pago",PAGOS)}
    </div>
    <div class="section-title">Búsqueda</div>
    <div class="grid grid-cols-3 gap-3 mb-4">
      ${sel("marcaBusca","Marca",["Indiferente",...MARCAS])}${inp("modeloBusca","Modelo")}${inp("ranioMin","Año mín","number")}
      ${inp("ranioMax","Año máx","number")}${inp("presupuesto","Presupuesto $","number","min=0")}${sel("transmisionDesea","Transmisión",["Indiferente","Manual","Automático","CVT"])}
      ${sel("carroceria","Carrocería",CARROCERIAS)}${sel("partePago","Parte pago",["No","Sí"])}${inp("partePagoDesc","Desc. parte pago")}
    </div>
    <div class="flex gap-2 justify-end">
      <button type="button" onclick="closeModal()" class="border border-slate-700 text-slate-400 rounded px-4 py-2 text-sm">Cancelar</button>
      <button type="submit" id="btnSaveCli" class="bg-blue-600 text-white rounded px-4 py-2 text-sm font-semibold">Guardar en Google Sheets</button>
    </div>
  </form>`;
  modal(id?"Editar Cliente":"Nuevo Cliente", body);
}

function saveCli(id) {
  const form = document.getElementById("cliForm");
  const data = id ? {...clis.find(x=>String(x.id)===String(id))} : {...EMPTY_CLI};
  form.querySelectorAll("[data-k]").forEach(el=>{
    const k = el.dataset.k;
    let v = el.value;
    if(el.type === "number") v = parseFloat(v)||0;
    data[k] = v;
  });

  const formData = {
    id: data.id || "",
    Nombre: data.nombre,
    Fecha_Contacto: data.fechaContacto,
    Celular: data.celular,
    Marca_Busca: data.marcaBusca,
    Modelo_Busca: data.modeloBusca,
    Anio_Min: data.ranioMin,
    Anio_Max: data.ranioMax,
    Presupuesto: data.presupuesto,
    Transmision_Desea: data.transmisionDesea,
    Carroceria: data.carroceria,
    Parte_Pago: data.partePago,
    Parte_Pago_Desc: data.partePagoDesc,
    Status: data.status,
    Origen: data.origen,
    Tipo_Pago: data.tipoPago,
    Fecha_Ultimo_Contacto: data.fechaUltimoContacto
  };

  const btn = document.getElementById("btnSaveCli");
  if(btn) { btn.disabled = true; btn.textContent = "Guardando..."; }

  if(typeof google !== "undefined" && google.script && google.script.run) {
    google.script.run
      .withSuccessHandler(()=>{ closeModal(); recargarApp(); })
      .withFailureHandler(err=>{
        if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
        errorGuardar(err);
      })
      .guardarCliente(formData);
  } else {
    if(btn) { btn.disabled = false; btn.textContent = "Guardar en Google Sheets"; }
    toast("⚠️ Modo preview: google.script.run no disponible", "error");
    console.log("Datos que se enviarían a guardarCliente:", formData);
  }
}

// ────────────── INIT ──────────────
const USUARIOS = {
  "1234": { rol: "tecnico", nombre: "Técnico", color: "#f59e0b", tabInicial: "inspeccion" },
  "admin99": { rol: "admin", nombre: "Administrador", color: "#22c55e", tabInicial: "dashboard" }
};

let usuarioActual = null;

function intentarLogin() {
  const pin = document.getElementById("pinInput").value.trim();
  const err = document.getElementById("loginError");
  const usuario = USUARIOS[pin];
  if(!usuario) {
    err.textContent = "PIN incorrecto. Intente nuevamente.";
    err.classList.remove("hidden");
    document.getElementById("pinInput").value = "";
    return;
  }
  usuarioActual = usuario;
  document.getElementById("loginScreen").classList.add("hidden");
  document.getElementById("appWrapper").classList.remove("hidden");
  aplicarRBAC();
  currentTab = usuario.tabInicial;
  if(usuario.rol === "admin") {
    sincronizar();
  } else {
    cargando = false;
    showLoader(false);
    render();
  }
}

function aplicarRBAC() {
  if(!usuarioActual) return;
  const esAdmin = usuarioActual.rol === "admin";
  document.querySelectorAll(".tab-btn").forEach(btn => {
    const role = btn.dataset.role;
    if(role === "admin" && !esAdmin) {
      btn.classList.add("hidden");
    } else {
      btn.classList.remove("hidden");
    }
  });
  document.getElementById("btnSync").style.display = esAdmin ? "" : "none";
  const badge = document.getElementById("userBadge");
  badge.textContent = `${usuarioActual.rol === "admin" ? "👑" : "🔧"} ${usuarioActual.nombre}`;
  badge.style.background = usuarioActual.color + "22";
  badge.style.color = usuarioActual.color;
  badge.style.border = `1px solid ${usuarioActual.color}55`;
  badge.classList.remove("hidden");
}

function cerrarSesion() {
  if(!confirm("¿Cerrar sesión?")) return;
  usuarioActual = null;
  vehs = [];
  clis = [];
  inspeccionData = {};
  document.getElementById("appWrapper").classList.add("hidden");
  document.getElementById("loginScreen").classList.remove("hidden");
  document.getElementById("pinInput").value = "";
  document.getElementById("loginError").classList.add("hidden");
  setTimeout(()=>document.getElementById("pinInput")?.focus(), 100);
}

document.querySelectorAll(".tab-btn").forEach(b=>{
  b.addEventListener("click", ()=>{ currentTab = b.dataset.tab; render(); });
});

setTimeout(()=>document.getElementById("pinInput")?.focus(), 100);

</script>
